// ================= 2D 兼容渲染（无 WebGL 环境的回退方案） =================
// 复用相机的投影把 3D 世界坐标画到 HUD 画布上，保证任何浏览器都能进游戏。
function worldPx(x, y, z) {
  const a = project(x, y, z), b = project(x + 1, y, z);
  return Math.hypot(b.x - a.x, b.y - a.y) || 0.01;
}
function drawGlow(x, y, r, color, alpha) {
  if (r < 0.5) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(0.4, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawAim2D(f) {
  if (!f.aimMesh.visible) return;
  const len = f.type === 'sword' ? 340 : 620;
  const wid = f.type === 'sword' ? 70 : 90;
  const a = f.angle;
  const p0 = project(f.x, 3, f.z);
  const p1p = project(f.x + Math.sin(a) * len, 3, f.z + Math.cos(a) * len);
  ctx.globalAlpha = 0.20;
  ctx.strokeStyle = f.color; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(3, wid * worldPx(f.x, 3, f.z) * 0.6);
  ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1p.x, p1p.y); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawFighter2D(f) {
  const feet = project(f.x, f.y, f.z);
  const top = project(f.x, f.y + 200, f.z);
  const hgt = Math.max(24, feet.y - top.y);
  const wid = hgt * 0.52;
  const cx = (feet.x + top.x) / 2, cy = (feet.y + top.y) / 2;
  const hurt = f.flash > 0 && (f.flash % 4 < 2);

  // 落地阴影
  const g0 = project(f.x, 0, f.z);
  ctx.globalAlpha = 0.32; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(g0.x, g0.y, wid * 0.62, wid * 0.24, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  // 残影
  for (const gh of f.ghosts) {
    const gp = project(gh.x, 60, gh.z);
    ctx.globalAlpha = (gh.life / 12) * 0.28;
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(gp.x, gp.y - hgt * 0.35, wid * 0.4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(cx, cy);
  // 躯干
  ctx.fillStyle = hurt ? '#ffffff' : f.color;
  roundRect(-wid / 2, -hgt * 0.30, wid, hgt * 0.66, wid * 0.32); ctx.fill();
  // 头
  ctx.fillStyle = hurt ? '#ffffff' : '#f0c39c';
  ctx.beginPath(); ctx.arc(0, -hgt * 0.40, wid * 0.36, 0, TAU); ctx.fill();
  ctx.restore();

  // 朝向 / 武器
  const a = f.angle;
  const dx = Math.sin(a), dy = Math.cos(a);
  const swing = f.attackT > 0 ? (1 - f.attackT / (f.attackDur || 1)) : -1;
  const baseX = cx + dx * wid * 0.5, baseY = cy + dy * wid * 0.5 - hgt * 0.1;
  if (swing >= 0) {
    // 出招弧光
    const arc = clamp(swing / 0.72, 0, 1);
    ctx.globalAlpha = 0.85 * (1 - arc * 0.6);
    ctx.strokeStyle = hurt ? '#fff' : f.color2 || f.color;
    ctx.lineWidth = Math.max(2, wid * 0.22);
    ctx.beginPath();
    ctx.arc(baseX, baseY, wid * (0.9 + arc * 0.6), Math.atan2(dy, dx) - 1.0, Math.atan2(dy, dx) + 0.7);
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = f.color2 || f.color;
    ctx.lineWidth = Math.max(2, wid * 0.14);
    ctx.beginPath(); ctx.moveTo(baseX, baseY);
    ctx.lineTo(cx + dx * wid * 1.5, cy + dy * wid * 1.5 - hgt * 0.1); ctx.stroke();
  }
}
function draw2DScene() {
  // 天空
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050818'); g.addColorStop(0.45, '#0d1536');
  g.addColorStop(0.72, '#20214e'); g.addColorStop(1, '#2b2450');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  camera.updateMatrixWorld();

  const X0 = -ARENA_HX, X1 = ARENA_HX, Z0 = -ARENA_HZ, Z1 = ARENA_HZ;
  const c00 = project(X0, 0, Z0), c10 = project(X1, 0, Z0), c11 = project(X1, 0, Z1), c01 = project(X0, 0, Z1);

  // 地板
  ctx.beginPath();
  ctx.moveTo(c00.x, c00.y); ctx.lineTo(c10.x, c10.y); ctx.lineTo(c11.x, c11.y); ctx.lineTo(c01.x, c01.y);
  ctx.closePath();
  ctx.fillStyle = '#141a34'; ctx.fill();

  // 网格
  ctx.strokeStyle = 'rgba(110,150,255,0.16)'; ctx.lineWidth = 1;
  for (let x = X0; x <= X1 + 1; x += 155) {
    const a = project(x, 0, Z0), b = project(x, 0, Z1);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let z = Z0; z <= Z1 + 1; z += 155) {
    const a = project(X0, 0, z), b = project(X1, 0, z);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // 中央符文圈
  ctx.strokeStyle = 'rgba(120,170,255,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const t = i / 48 * TAU, p = project(Math.cos(t) * 370, 0, Math.sin(t) * 370);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.stroke();
  // 四周光墙
  ctx.strokeStyle = 'rgba(95,128,255,0.55)'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(c00.x, c00.y); ctx.lineTo(c10.x, c10.y); ctx.lineTo(c11.x, c11.y); ctx.lineTo(c01.x, c01.y);
  ctx.closePath(); ctx.stroke();

  // 障碍物（顶面 + 两个可见侧面）
  for (const o of OBSTACLES) {
    const x0 = o.x - o.hx, x1 = o.x + o.hx, z0 = o.z - o.hz, z1 = o.z + o.hz;
    const t0 = project(x0, o.h, z0), t1 = project(x1, o.h, z0),
          t2 = project(x1, o.h, z1), t3 = project(x0, o.h, z1);
    const g0 = project(x0, 0, z0), g3 = project(x0, 0, z1), g2 = project(x1, 0, z1);
    ctx.fillStyle = '#232c55';
    ctx.beginPath();
    ctx.moveTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y); ctx.lineTo(g3.x, g3.y); ctx.lineTo(g2.x, g2.y);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(t3.x, t3.y); ctx.lineTo(t0.x, t0.y); ctx.lineTo(g0.x, g0.y); ctx.lineTo(g3.x, g3.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3b4a86';
    ctx.beginPath();
    ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,160,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // 技能指向
  for (const f of fighters) drawAim2D(f);
  // 地面冲击环
  for (const r of rings) {
    if (!r.active) continue;
    const rad = r.m.scale.x;
    const cc = project(r.m.position.x, 3, r.m.position.z);
    const rx = Math.abs(project(r.m.position.x + rad, 0, r.m.position.z).x - cc.x);
    if (rx < 1) continue;
    ctx.globalAlpha = r.m.material.opacity;
    ctx.strokeStyle = '#' + r.m.material.color.getHexString();
    ctx.lineWidth = Math.max(1.5, rx * 0.10);
    ctx.beginPath(); ctx.ellipse(cc.x, cc.y, rx, rx * 0.42, 0, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 角色（后画的覆盖前面的：按 z 从远到近）
  const order = fighters.filter(f => !f.dead).slice().sort((a, b) => a.z - b.z);
  for (const f of order) drawFighter2D(f);

  // 弹道
  for (const pr of projectiles) {
    const p = project(pr.x, pr.y, pr.z);
    const k = worldPx(pr.x, pr.y, pr.z);
    drawGlow(p.x, p.y, Math.max(4, pr.r * k * 1.6), pr.color, 0.9);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, pr.r * k * 0.9), 0, TAU); ctx.fill();
  }
  // 火花
  for (const s of sparks) {
    if (!s.active) continue;
    const sp = s.s.position;
    const p = project(sp.x, sp.y, sp.z);
    const k = worldPx(sp.x, sp.y, sp.z);
    drawGlow(p.x, p.y, Math.max(1.5, s.s.scale.x * k * 0.9), '#' + s.s.material.color.getHexString(), s.s.material.opacity);
  }

  // 兼容模式标记
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(180,200,255,0.55)';
  ctx.fillText('2D 兼容模式（当前环境不支持 WebGL）', 16, H - 18);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

// ================= 渲染 =================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 血条平滑
  for (const f of fighters) f.hpDisplay += (f.hp - f.hpDisplay) * 0.14;

  updateCamera();
  if (use2D) draw2DScene(); else renderer.render(scene, camera);

  if (gameState === 'menu') { drawMenu(); return; }
  if (gameState === 'netlobby') return;   // 联机大厅由 DOM 覆盖层呈现
  drawHUD();
  drawFloaters();

  if (gameState === 'countdown') drawCountdown();
  if (gameState === 'roundover') drawRoundOver();
  if (gameState === 'upgrade') drawUpgrade();
  if (gameState === 'gameover') drawGameOver();
  if (paused && (gameState === 'fight' || gameState === 'countdown' || gameState === 'roundover')) drawPaused();
}

// ================= 主循环（固定步长） =================
let acc = 0, last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  const step = 1 / 60;
  let guard = 0;
  while (acc >= step && guard++ < 5) { fixedUpdate(); acc -= step; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
