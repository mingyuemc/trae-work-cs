function startRound() {
  for (const f of fighters) { f.reset(); if (f.ai) f.ai.reset(); }
  for (const pr of projectiles) pr.dispose();
  projectiles = []; floaters = [];
  roundTime = TOTAL_ROUND_TIME;
  roundResult = null;
  kills = [0, 0];
  gameState = 'countdown'; stateT = 0; paused = false;
}
function startMatch(modeIdx) {
  if (modeIdx === undefined) modeIdx = currentMode;
  currentMode = modeIdx;
  const modeId = MENU[modeIdx].id;
  matchTeamSize = modeTeamSize(modeId);      // 1v1 只上 0 号，5v5 全队上场
  aiLevel = (modeId === 'pvp' || modeId === 'p2p' || modeId === 'p2p1') ? null : (modeId === 'solo' ? 'normal' : modeId);
  net.active = false;

  humans.length = 0;
  for (const f of fighters) { f.ai = null; f.netRemote = false; f.netPeer = null; f.controls = null; f.dmgMul = 1; }
  teamState[0].hasHuman = false; teamState[1].hasHuman = false;
  teamState[0].remote = false; teamState[1].remote = false;

  // 先把上一局被选人改写的角色还原为名册默认
  for (const f of fighters) if (f.rosterDef && f.heroId) f.applyHero(f.rosterDef);

  // 红方 0 号始终由本机操控
  const h1 = redTeam[0]; h1.controls = SCHEME_A; humans.push(h1); teamState[0].hasHuman = true;
  h1.applyHero(HEROES[selHero[0]]);
  // 同屏双人：蓝方 0 号由本机第二位玩家操控；1v1 / 人机：蓝方 0 号交给 AI（选用英雄）
  const h2 = blueTeam[0];
  if (modeId === 'pvp') {
    h2.controls = SCHEME_B; humans.push(h2); teamState[1].hasHuman = true;
    h2.applyHero(HEROES[selHero[1]]);
  } else if (matchTeamSize === 1) {
    h2.applyHero(HEROES[selHero[1]]);
  }
  const aiLv = aiLevel || 'normal';
  for (const f of fighters) if (!f.bench && humans.indexOf(f) < 0) f.ai = new EnemyAI(aiLv);
  for (const f of fighters) { f.dmgMul = aiLevel ? DIFFS[aiLv].dmg : 1; f.resetMods(); }
  for (const f of humans) f.dmgMul = 1;      // 真人角色不受难度加成影响

  teamState[0].upgradeCounts = {}; teamState[1].upgradeCounts = {};
  teamState[0].upgrades = []; teamState[1].upgrades = [];
  wins = [0, 0]; kills = [0, 0]; round = 1;
  regenerateObstacles();
  Music.duck = 1; Music.play('battle'); Music.apply(0.3);
  startRound();
}
function beginUpgrade() {
  gameState = 'upgrade'; stateT = 0; upgradePhase = 0; upgradeSel = 0;
  upgradeChoices = [rollTeamUpgrades(teamState[0]), rollTeamUpgrades(teamState[1])];
}
function commitUpgrade() {
  const ts = teamState[upgradePhase];
  const card = upgradeChoices[upgradePhase][upgradeSel];
  if (!card) return;
  ts.upgradeCounts[card.id] = (ts.upgradeCounts[card.id] || 0) + 1;
  ts.upgrades.push(card.id);
  const team = upgradePhase === 0 ? redTeam : blueTeam;
  for (const f of team) card.apply(f);     // 全队共享强化
  SFX.ready();
  upgradePhase++; upgradeSel = 0; stateT = 0;
  if (upgradePhase >= 2) { round++; startRound(); }
}

// 障碍物碰撞：沿最小穿透轴把角色推出方块（含角色半径）
function resolveObstacleCollision(f) {
  for (const o of OBSTACLES) {
    if (f.y >= o.h) continue;                       // 已越过方块顶部
    const dx = f.x - o.x, dz = f.z - o.z;
    const ox = o.hx + f.radius, oz = o.hz + f.radius;
    if (Math.abs(dx) >= ox || Math.abs(dz) >= oz) continue;
    const penX = ox - Math.abs(dx), penZ = oz - Math.abs(dz);
    if (penX < penZ) f.x = o.x + (dx < 0 ? -1 : 1) * ox;
    else             f.z = o.z + (dz < 0 ? -1 : 1) * oz;
  }
}

// 身体碰撞：N 体在水平面相互分离
function resolveBodyCollision() {
  for (let i = 0; i < fighters.length; i++) {
    const a = fighters[i];
    if (a.dead || a.bench) continue;
    for (let j = i + 1; j < fighters.length; j++) {
      const b = fighters[j];
      if (b.dead || b.bench) continue;
      if (Math.abs(a.y - b.y) > 130) continue;
      const dx = b.x - a.x, dz = b.z - a.z;
      const d = Math.hypot(dx, dz);
      const minD = a.radius + b.radius;
      if (d >= minD || d < 0.001) continue;
      const push = (minD - d) / 2, ux = dx / d, uz = dz / d;
      a.x -= ux * push; a.z -= uz * push;
      b.x += ux * push; b.z += uz * push;
    }
  }
  for (const f of fighters) {
    if (f.dead || f.bench) continue;
    f.x = clamp(f.x, -ARENA_HX, ARENA_HX); f.z = clamp(f.z, -ARENA_HZ, ARENA_HZ);
    resolveObstacleCollision(f);
  }
}

function updateProjectiles() {
  for (const pr of projectiles) {
    if (pr.dead) continue;
    pr.update();
    // 障碍物拦截：撞到方块则销毁弹道
    if (!pr.dead) {
      for (const o of OBSTACLES) {
        if (pr.y > o.h) continue;
        if (Math.abs(pr.x - o.x) < o.hx + pr.r && Math.abs(pr.z - o.z) < o.hz + pr.r) {
          pr.dead = true;
          spawnHit(pr.x, pr.y, pr.z, pr.type === 'fire' ? 'fire' : 'bolt');
          break;
        }
      }
      if (pr.dead) continue;
    }
    if (gameState === 'fight' && !pr.dead && pr.owner) {
      for (const target of enemiesOf(pr.owner)) {
        if (target.dead || target.invuln > 0) continue;
        const pd = Math.hypot(pr.x - target.x, pr.z - target.z);
        if (pd < pr.r + target.radius && Math.abs(pr.y - (target.y + 80)) < 110) {
          pr.dead = true;
          hitTarget(target, pr.owner, pr.dmg, pr.type === 'fire' ? 16 : 7, pr.type === 'fire' ? 'fire' : 'bolt');
          break;
        }
      }
    }
  }
  for (const pr of projectiles) if (pr.dead) pr.dispose();
  projectiles = projectiles.filter(p => !p.dead);
}

function simulate() {
  time++;
  if (shakeT > 0) shakeT--;
  if (shakeDirK > 0.2) shakeDirK *= 0.86; else shakeDirK = 0;
  if (consume('KeyM')) { muted = !muted; Music.apply(0.15); }

  if (gameState === 'menu') {
    Music.play('menu');
    const n = MENU.length, half = Math.ceil(n / 2);
    const before = menuIndex;
    if (consume('KeyW') || consume('ArrowUp')) menuIndex = (menuIndex + n - 1) % n;
    if (consume('KeyS') || consume('ArrowDown')) menuIndex = (menuIndex + 1) % n;
    if (consume('KeyA') || consume('ArrowLeft') || consume('KeyD') || consume('ArrowRight')) {
      let t = menuIndex < half ? menuIndex + half : menuIndex - half;   // 左右栏之间切换
      menuIndex = clamp(t, 0, n - 1);
    }
    for (let i = 0; i < n; i++) if (consume('Digit' + (i + 1)) || consume('Numpad' + (i + 1))) menuIndex = i;
    if (menuIndex !== before) SFX.nav();
    if (consume('Enter') || consume('Space')) {
      if (MENU[menuIndex].id === 'keys') {
        // 打开键位设置
        gameState = 'keyconfig'; stateT = 0; keycfgScheme = 0; keycfgIndex = 0; rebind = null;
        SFX.go();
      } else if (MENU[menuIndex].id === 'account') {
        SFX.go(); openAccount();
      } else {
        // 先进入选人：同屏双人需要红蓝双方各选一次，其余模式仅红方选
        pendingMode = menuIndex;
        heroPhaseTotal = MENU[menuIndex].id === 'pvp' ? 2 : 1;
        heroSelectPhase = 0;
        heroIndex = selHero[0];
        gameState = 'heroselect'; stateT = 0;
        SFX.go();
      }
    }
    clearPressed(); return;
  }
  if (gameState === 'keyconfig') {
    stateT++;
    if (rebind) { clearPressed(); return; }        // 正在等待玩家按键
    const before = keycfgIndex;
    if (consume('ArrowUp') || consume('KeyW')) keycfgIndex = (keycfgIndex + KEY_ACTIONS.length - 1) % KEY_ACTIONS.length;
    if (consume('ArrowDown') || consume('KeyS')) keycfgIndex = (keycfgIndex + 1) % KEY_ACTIONS.length;
    if (keycfgIndex !== before) SFX.nav();
    if (consume('ArrowLeft') || consume('ArrowRight') || consume('Tab')) { keycfgScheme = keycfgScheme ? 0 : 1; SFX.nav(); }
    if (consume('KeyZ')) {                          // 恢复当前方案默认键位
      const sc = schemeOf(keycfgScheme), d = schemeDef(keycfgScheme);
      sc.up = d.up; sc.down = d.down; sc.left = d.left; sc.right = d.right; sc.attack = d.attack;
      sc.skillKeys = d.skillKeys.slice(); saveKeys(); SFX.ready();
    }
    if (consume('Enter') || consume('Space')) { rebind = { scheme: keycfgScheme, index: keycfgIndex }; SFX.ready(); }
    if (consume('Escape')) { gameState = 'menu'; stateT = 0; menuIndex = MENU.length - 1; }
    clearPressed(); return;
  }
  if (gameState === 'heroselect') {
    stateT++;
    const before = heroIndex;
    if (consume('KeyA') || consume('ArrowLeft') || consume('KeyW') || consume('ArrowUp'))
      heroIndex = (heroIndex + HEROES.length - 1) % HEROES.length;
    if (consume('KeyD') || consume('ArrowRight') || consume('KeyS') || consume('ArrowDown'))
      heroIndex = (heroIndex + 1) % HEROES.length;
    for (let i = 0; i < HEROES.length; i++)
      if (consume('Digit' + (i + 1)) || consume('Numpad' + (i + 1))) heroIndex = i;
    if (heroIndex !== before) SFX.nav();
    // 确认键：红方用红方普攻键 / Enter，蓝方用蓝方普攻键 / 空格
    const confirm = heroSelectPhase === 0
      ? (consume(SCHEME_A.attack) || consume('Enter'))
      : (consume(SCHEME_B.attack) || consume('Space'));
    const back = consume('Escape');
    if (back) { gameState = 'menu'; stateT = 0; clearPressed(); return; }
    if (confirm) {
      selHero[heroSelectPhase] = heroIndex;
      SFX.ready();
      heroSelectPhase++;
      if (heroSelectPhase >= heroPhaseTotal) {
        const mid = MENU[pendingMode].id;
        if (mid === 'p2p' || mid === 'p2p1') openNetLobby();
        else startMatch(pendingMode);
      } else {
        heroIndex = selHero[heroSelectPhase];
        stateT = 0;
      }
    }
    clearPressed(); return;
  }
  if (gameState === 'netlobby') { clearPressed(); return; }
  if (gameState === 'account' || gameState === 'leaderboard') {
    if (consume('Escape')) acctClose();
    clearPressed(); return;
  }
  if (gameState === 'gameover') {
    updateFloaters();
    if (consume('Enter') || consume('Space')) {
      if (net.active || net.connected) netTeardown();
      gameState = 'menu'; stateT = 0;
      menuIndex = currentMode < MENU.length ? currentMode : 0;
    }
    clearPressed(); return;
  }
  if (gameState === 'upgrade') {
    stateT++;
    const ts = teamState[upgradePhase];
    const cards = upgradeChoices[upgradePhase];
    if (upgradePhase === 1 && ts.remote) {
      // 联机：等待蓝方客户端选卡（15 秒无响应则兜底选择第一张）
      if (net.guestPick >= 0) {
        upgradeSel = clamp(net.guestPick | 0, 0, cards.length - 1);
        net.guestPick = -1;
        commitUpgrade();
      } else if (stateT >= 900) { upgradeSel = 0; commitUpgrade(); }
    } else if (!ts.hasHuman) {
      // 全 AI 一方：随机挑选一张
      if (stateT >= 50) { upgradeSel = Math.floor(Math.random() * cards.length); commitUpgrade(); }
    } else {
      const sc = upgradePhase === 0 ? SCHEME_A : SCHEME_B;
      const prev = consume(sc.left);
      const next = consume(sc.right);
      const ok = consume(sc.attack) || consume('Enter') || consume('Space');
      if (prev) { upgradeSel = (upgradeSel + cards.length - 1) % cards.length; SFX.nav(); }
      if (next) { upgradeSel = (upgradeSel + 1) % cards.length; SFX.nav(); }
      if (ok) commitUpgrade();
    }
    clearPressed(); return;
  }
  if (!net.active && consume('KeyR')) { startMatch(); clearPressed(); return; }
  // 联机主机：对局中按 Esc 主动解散并返回主菜单，与客户端行为一致（否则主机只能关掉页面）
  if (net.active && net.role === 'host' && consume('Escape')) {
    netTeardown();
    gameState = 'menu'; stateT = 0;
    menuIndex = currentMode < MENU.length ? currentMode : 0;
    clearPressed(); return;
  }
  if (consume('KeyP')) { paused = !paused; Music.duck = paused ? 0.3 : 1; Music.apply(0.25); }
  if (paused) { clearPressed(); return; }

  if (gameState === 'countdown') {
    stateT++;
    if (stateT % 45 === 0 && stateT < 135) netSfx('count');
    if (stateT === 135) netSfx('go');
    for (const f of fighters) { f.animT++; f.pose(); }
    updateFloaters(); updateSparks(); updateRings();
    if (stateT >= 160) { gameState = 'fight'; stateT = 0; }
    clearPressed(); return;
  }
  if (gameState === 'fight') {
    roundTime--;
    for (const f of fighters) f.update();
    resolveBodyCollision();
    updateProjectiles();
    updateFloaters();
    for (const f of fighters) f.pose();
    updateSparks(); updateRings();
    if (roundTime <= 0) timeOut();
    clearPressed(); return;
  }
  if (gameState === 'roundover') {
    stateT++;
    for (const f of fighters) f.update();
    resolveBodyCollision();
    updateProjectiles();
    updateFloaters();
    for (const f of fighters) f.pose();
    updateSparks(); updateRings();
    if (stateT >= 150) {
      if (wins[0] >= 2 || wins[1] >= 2) {
        gameState = 'gameover'; stateT = 0;
        Music.stop(); playVictory();
        reportMatchResultIfNeeded();
      } else beginUpgrade();
    }
    clearPressed(); return;
  }
  clearPressed();
}

// 固定步长分发：客户端只上传输入并渲染主机快照，主机负责全部模拟
function fixedUpdate() {
  if (net.active && net.role === 'guest') { netGuestStep(); return; }
  simulate();
  if (net.active && net.role === 'host') netHostSend();
}

// ================= 相机跟随 =================
// 镜头始终以本机操控的英雄为中心（humans[0] 即本地操控的角色）；
// 该英雄阵亡时，平滑过渡到存活队友的重心，避免镜头停在空处。
const _mid = new THREE.Vector3();
function updateCamera() {
  const focus = humans[0] || null;
  let fx, fz;
  if (focus && !focus.dead) {
    fx = focus.x; fz = focus.z;
  } else {
    const team = focus ? alliesOf(focus) : fighters;
    const alive = team.filter(f => !f.dead);
    if (alive.length) {
      let ax = 0, az = 0;
      for (const f of alive) { ax += f.x; az += f.z; }
      fx = ax / alive.length; fz = az / alive.length;
    } else if (focus) { fx = focus.x; fz = focus.z; }
    else { fx = 0; fz = 0; }
  }
  const D = 1000;
  const tx = fx, tz = fz + D * 0.62, ty = D * 0.80;
  camera.position.lerp(_mid.set(tx, ty, tz), 0.12);
  let lx = fx, ly = 30, lz = fz;
  if (shakeT > 0) {
    // 刚性平移抖动：相机与视线目标同步偏移，避免被 lerp / lookAt 抵消
    const k = shakeMag * (shakeT / 14);
    const dk = shakeDirK * (shakeT / 14) * 2.4;        // 方向性冲量：沿命中方向推镜头
    const sx = rand(-1, 1) * k * 2.2 + Math.sin(shakeAng) * dk;
    const sy = rand(-1, 1) * k * 2.2;
    const sz = rand(-1, 1) * k * 2.2 + Math.cos(shakeAng) * dk;
    camera.position.x += sx; camera.position.y += sy; camera.position.z += sz;
    lx += sx; ly += sy; lz += sz;
  }
  camera.lookAt(lx, ly, lz);
}

// ================= HUD 绘制（2D 覆盖层） =================
// 队伍面板：显示该队参战英雄的生命 / 阵亡状态 / 击杀数 / 胜场（1v1 时仅 1 行）
function drawTeamPanel(side, left) {
  const team = side === TEAM_RED ? redTeam : blueTeam;
  const pw = 300, rowH = 30, headH = 42;
  const ph = headH + matchTeamSize * rowH + 6;
  const x0 = left ? 28 : W - 28 - pw, y0 = 20;
  const col = side === TEAM_RED ? '#ff5a5f' : '#4fa8ff';

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(x0 - 4, y0 - 4, pw + 8, ph + 8, 10); ctx.fill();
  ctx.fillStyle = 'rgba(14,18,36,0.92)';
  roundRect(x0, y0, pw, ph, 8); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  roundRect(x0, y0, pw, ph, 8); ctx.stroke();

  ctx.textBaseline = 'middle';
  ctx.textAlign = left ? 'left' : 'right';
  ctx.font = 'bold 19px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = col;
  ctx.fillText((side === TEAM_RED ? '红方' : '蓝方') + (teamState[side].hasHuman ? '' : ' · AI'), left ? x0 + 12 : x0 + pw - 12, y0 + 21);
  ctx.textAlign = left ? 'right' : 'left';
  ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.fillText('击杀 ' + kills[side], left ? x0 + pw - 12 : x0 + 12, y0 + 21);
  // 胜场圆点
  for (let i = 0; i < 2; i++) {
    const cx = x0 + pw / 2 - 10 + i * 20;
    ctx.beginPath(); ctx.arc(cx, y0 + 21, 6, 0, TAU);
    if (i < wins[side]) { ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    else { ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke(); }
  }

  for (let i = 0; i < matchTeamSize; i++) {
    const f = team[i];
    const ry = y0 + headH + i * rowH;
    const bx = x0 + 12, bw = pw - 24, bh = 9;
    ctx.textAlign = 'left';
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = f.dead ? 'rgba(150,160,190,0.5)' : '#dfe7ff';
    ctx.fillText(f.name, bx, ry + 5);
    if (f.dead) {
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,150,150,0.85)';
      ctx.fillText('复活 ' + Math.ceil(f.respawnT / 60) + 's', bx + bw, ry + 5);
    }
    ctx.fillStyle = 'rgba(8,10,22,0.92)';
    roundRect(bx, ry + 13, bw, bh, 4); ctx.fill();
    if (!f.dead) {
      const r = clamp(f.hp / f.maxHp, 0, 1);
      ctx.fillStyle = f.color;
      roundRect(bx, ry + 13, Math.max(0, bw * r), bh, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      roundRect(bx, ry + 14, Math.max(0, bw * r), bh * 0.4, 3); ctx.fill();
    }
  }
  ctx.textBaseline = 'alphabetic';
}

// 生成某角色技能按键提示，例如 "G 冲刺斩  H 烈焰旋风"
function humanSkillHint(f) {
  if (!f || !f.skills) return '';
  return f.skills.map((s, i) => {
    const k = (f.controls && f.controls.skillKeys && f.controls.skillKeys[i]) || s.key;
    return keyLabel(k) + ' ' + s.label;
  }).join('  ');
}

// 本地真人技能栏（环形冷却 + 就绪脉冲）
function drawSkillBar(f, align) {
  if (!f) return;
  const iw = 52, ih = 54, gap = 10, n = f.skills.length;
  const totalW = n * iw + (n - 1) * gap;
  const x0 = align === 'left' ? 60 : W - 60 - totalW;
  const iy = H - 92;
  if (!f._ready) f._ready = new Array(n).fill(0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const sk = f.skills[i];
    const ix = x0 + i * (iw + gap);
    const cd = (f.cds && f.cds[i]) || 0;
    const ratio = clamp(cd / sk.cd, 0, 1);
    const ready = cd <= 0 && !f.dead;
    // 就绪脉冲：冷却刚结束的瞬间记录时间戳，用于播放扩散闪光
    if (ready && !f._ready[i]) f._ready[i] = time;
    if (!ready) f._ready[i] = 0;
    const pulseAge = ready && f._ready[i] ? (time - f._ready[i]) : 999;
    const pulse = pulseAge < 22 ? (1 - pulseAge / 22) : 0;

    // 底板
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ix, iy, iw, ih, 8); ctx.fill();

    // 环形冷却
    const ccx = ix + iw / 2, ccy = iy + ih / 2, rr = iw / 2 - 4;
    ctx.beginPath(); ctx.arc(ccx, ccy, rr, 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 3; ctx.stroke();
    if (ratio > 0) {
      ctx.beginPath();
      ctx.arc(ccx, ccy, rr, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - ratio), false);
      ctx.strokeStyle = '#7ee8fa'; ctx.lineWidth = 3.5; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(ccx, ccy, rr, 0, TAU);
      ctx.strokeStyle = 'rgba(255,209,102,0.85)'; ctx.lineWidth = 3; ctx.stroke();
    }

    // 文字
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = ready ? '#ffd166' : 'rgba(160,180,220,0.62)';
    ctx.fillText(sk.label.slice(0, 2), ccx, iy + 17);
    ctx.font = 'bold 11px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(200,215,245,0.65)';
    const dispKey = (f.controls && f.controls.skillKeys && f.controls.skillKeys[i]) || sk.key;
    ctx.fillText(keyLabel(dispKey), ccx, iy + ih - 11);
    if (cd > 0) {
      ctx.font = 'bold 17px "PingFang SC",sans-serif';
      ctx.fillStyle = '#eaf0ff';
      ctx.fillText(Math.ceil(cd / 60), ccx, ccy + 1);
    }

    // 就绪脉冲闪光
    if (pulse > 0) {
      ctx.save();
      ctx.globalAlpha = pulse * 0.4;
      ctx.fillStyle = '#ffd166';
      roundRect(ix, iy, iw, ih, 8); ctx.fill();
      ctx.globalAlpha = pulse * 0.9;
      ctx.beginPath(); ctx.arc(ccx, ccy, rr + 3 + (1 - pulse) * 13, 0, TAU);
      ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 3 * pulse + 0.5; ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
  ctx.textBaseline = 'alphabetic';
}

// 世界坐标浮动文字
function drawFloaters() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    const sp = project(f.x, f.y, f.z);
    if (sp.z > 1) continue;
    const maxLife = f.max || 40;
    const a = clamp(f.life / maxLife, 0, 1);
    // 弹跳放大：出现瞬间快速放大回弹
    const age = maxLife - f.life;
    const pop = age < 12 ? 1 + (1 - age / 12) * (f.big ? 0.9 : 0.55) : 1;
    const base = f.big ? 40 : 28;
    ctx.globalAlpha = a;
    ctx.save();
    ctx.translate(sp.x, sp.y); ctx.scale(pop, pop);
    ctx.font = 'bold ' + base + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// 屏幕空间刀光弧：跟随命中方向的弧线拖尾
function drawSlashes() {
  if (!slashes.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of slashes) {
    const t = 1 - s.life / s.max;                 // 0 → 1 进度
    const c = project(s.x, 70, s.z);
    if (c.z > 1) continue;
    const e = project(s.x + Math.sin(s.ang) * 120, 70, s.z + Math.cos(s.ang) * 120);
    const scrAng = Math.atan2(e.y - c.y, e.x - c.x);   // 命中方向在屏幕上的朝向
    const r = (s.fin ? 108 : 78) * (0.72 + t * 0.5);
    const span = s.fin ? Math.PI * 0.98 : Math.PI * 0.62;
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(scrAng);
    ctx.globalAlpha = clamp((1 - t) * 1.15, 0, 1) * (s.fin ? 0.95 : 0.72);
    ctx.lineWidth = (s.fin ? 17 : 11) * (1 - t * 0.55);
    const grad = ctx.createLinearGradient(0, -r, 0, r);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, s.fin ? 'rgba(255,238,190,0.98)' : 'rgba(214,232,255,0.88)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, -span / 2, span / 2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// 击杀播报横幅：入场下滑 + 退场淡出，连杀时转为橙红配色
function drawKillBanner() {
  if (killBanner.t <= 0) return;
  const inT = clamp((110 - killBanner.t) / 10, 0, 1);
  const outT = clamp(killBanner.t / 18, 0, 1);
  const a = Math.min(inT, outT);
  if (a <= 0) return;
  const isStreak = killStreak >= 2;
  const cx = W / 2, cy = 178;
  const slide = (1 - easeOut(inT)) * -60;
  const bw = 380 + Math.max(0, killBanner.text.length - 4) * 12, bh = 78;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = a;
  ctx.translate(0, slide);
  ctx.fillStyle = 'rgba(9,12,26,0.84)';
  roundRect(cx - bw / 2, cy - bh / 2, bw, bh, 12); ctx.fill();
  ctx.strokeStyle = isStreak ? 'rgba(255,124,84,0.95)' : 'rgba(255,209,102,0.95)';
  ctx.lineWidth = 2.5;
  roundRect(cx - bw / 2, cy - bh / 2, bw, bh, 12); ctx.stroke();
  // 顶部高光条
  ctx.fillStyle = isStreak ? 'rgba(255,124,84,0.55)' : 'rgba(255,209,102,0.5)';
  roundRect(cx - 46, cy - bh / 2 - 3, 92, 5, 3); ctx.fill();
  ctx.font = 'bold 34px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  ctx.strokeText(killBanner.text, cx, cy - 9);
  ctx.fillStyle = isStreak ? '#ff9a5a' : '#ffd166';
  ctx.fillText(killBanner.text, cx, cy - 9);
  if (killBanner.sub) {
    ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(206,220,248,0.88)';
    ctx.fillText(killBanner.sub, cx, cy + 22);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// 英雄头顶血条 + 连击称号
function drawOverhead() {
  for (const f of fighters) {
    if (f.dead || f.bench) continue;
    const sp = project(f.x, f.y + 205, f.z);
    if (sp.z <= 1) {
      const ratio = clamp(f.hp / f.maxHp, 0, 1);
      const bw = 64, bh = 7, bx = sp.x - bw / 2, by = sp.y;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      roundRect(bx - 2, by - 2, bw + 4, bh + 4, 3); ctx.fill();
      ctx.fillStyle = f.color;
      roundRect(bx, by, bw * ratio, bh, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      roundRect(bx, by, bw, bh, 3); ctx.stroke();
    }
    if (f.combo >= 2 && f.comboT > 0) {
      const sp2 = project(f.x, f.y + 250, f.z);
      const tier = COMBO_TIERS.find(t => f.combo >= t.min) || COMBO_TIERS[COMBO_TIERS.length - 1];
      const pop = f.comboT > 88 ? 1 + (f.comboT - 88) * 0.03 : 1;
      ctx.globalAlpha = clamp(f.comboT / 60, 0, 1);
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.round(26 * pop) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = tier.color;
      ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 5;
      const txt = f.combo + ' ' + tier.name;
      ctx.strokeText(txt, sp2.x, sp2.y);
      ctx.fillText(txt, sp2.x, sp2.y);
      ctx.globalAlpha = 1;
    }
  }
}

// 小地图：俯瞰整个竞技场（障碍物 + 双方位置与朝向）
function drawMinimap() {
  const mw = 240, mh = mw * ARENA_HZ / ARENA_HX;
  const x0 = W - 40 - mw, y0 = H - 62 - mh;
  const mx = x => x0 + (x + ARENA_HX) / (2 * ARENA_HX) * mw;
  const mz = z => y0 + (z + ARENA_HZ) / (2 * ARENA_HZ) * mh;

  ctx.fillStyle = 'rgba(6,9,22,0.72)';
  roundRect(x0 - 8, y0 - 8, mw + 16, mh + 16, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(140,170,240,0.45)'; ctx.lineWidth = 2;
  roundRect(x0 - 8, y0 - 8, mw + 16, mh + 16, 10); ctx.stroke();

  ctx.fillStyle = 'rgba(30,40,80,0.55)';
  roundRect(x0, y0, mw, mh, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(120,160,255,0.35)'; ctx.lineWidth = 1.5;
  roundRect(x0, y0, mw, mh, 5); ctx.stroke();

  ctx.fillStyle = 'rgba(150,190,255,0.30)';
  ctx.beginPath(); ctx.arc(mx(0), mz(0), 3, 0, TAU); ctx.fill();

  // 双方基地
  ctx.fillStyle = 'rgba(255,90,95,0.18)';
  ctx.fillRect(mx(-SPAWN_X - 260), mz(-620), 260 / ARENA_HX * mw * 2, 620 / ARENA_HZ * mh * 2);
  ctx.fillStyle = 'rgba(79,168,255,0.18)';
  ctx.fillRect(mx(SPAWN_X) - 260 / ARENA_HX * mw * 2, mz(-620), 260 / ARENA_HX * mw * 2, 620 / ARENA_HZ * mh * 2);

  // 障碍物
  ctx.fillStyle = 'rgba(120,160,255,0.78)';
  for (const o of OBSTACLES) {
    ctx.fillRect(mx(o.x - o.hx), mz(o.z - o.hz), o.hx / ARENA_HX * mw, o.hz / ARENA_HZ * mh);
  }

  // 英雄标记（圆点 + 朝向指示；1v1 时仅显示参战角色）
  for (const f of fighters) {
    if (f.dead || f.bench) continue;
    const px = mx(f.x), pz = mz(f.z);
    ctx.strokeStyle = f.color; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(px, pz);
    ctx.lineTo(px + Math.sin(f.angle) * 11, pz + Math.cos(f.angle) * 11);
    ctx.stroke();
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(px, pz, 4.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(px, pz, 4.5, 0, TAU); ctx.stroke();
    if (humans.indexOf(f) >= 0) {   // 本机操控的角色加高亮圈
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, pz, 8, 0, TAU); ctx.stroke();
    }
  }

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 12px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(170,190,225,0.7)';
  ctx.fillText('小地图', x0 + 2, y0 - 14);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
}

function drawHUD() {
  drawTeamPanel(TEAM_RED, true);
  drawTeamPanel(TEAM_BLUE, false);
  drawOverhead();
  drawMinimap();
  if (humans[0]) drawSkillBar(humans[0], humans[0].side === TEAM_RED ? 'left' : 'right');
  if (humans[1]) drawSkillBar(humans[1], humans[1].side === TEAM_RED ? 'left' : 'right');

  const sec = Math.ceil(roundTime / 60);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cx = W / 2, cy = 62;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(cx - 52, cy - 34, 104, 68, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(160,190,255,0.5)'; ctx.lineWidth = 2;
  roundRect(cx - 52, cy - 34, 104, 68, 12); ctx.stroke();
  ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = sec <= 10 ? '#ff6b6b' : '#eef3ff';
  ctx.fillText(sec, cx, cy + 2);
  ctx.font = 'bold 16px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(200,215,255,0.75)';
  ctx.fillText('第 ' + round + ' 回合', cx, cy + 56);
  ctx.textBaseline = 'alphabetic';

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(170,190,225,0.5)';
  const localH = humans[0];                  // 本机操控角色（联机客户端时可能是蓝方）
  const localSide = localH ? (localH.side === TEAM_RED ? '红方 ' : '蓝方 ') : '';
  const localHint = localH
    ? localSide + localH.name + '：' + schemeHint(localH.controls || SCHEME_A) + '  ' + humanSkillHint(localH)
    : '';
  const leftHint = localH
    ? (localH.side === TEAM_RED ? localHint : (aiLevel ? '红方：电脑 AI（' + DIFFS[aiLevel].label + '）' : net.active ? '红方：玩家联机' : '红方：' + schemeHint(SCHEME_A)))
    : '5v5 · 本机操控红方 0 号';
  ctx.fillText(leftHint, 56, H - 26);
  ctx.textAlign = 'right';
  const rightHint = localH
    ? (localH.side === TEAM_BLUE ? localHint : (aiLevel ? '蓝方：电脑 AI（' + DIFFS[aiLevel].label + '）' : net.active ? '蓝方：玩家联机' : '蓝方：' + schemeHint(SCHEME_B)))
    : (aiLevel ? '蓝方：电脑 AI（' + DIFFS[aiLevel].label + '）' : net.active ? '蓝方：玩家联机' : '蓝方：' + schemeHint(SCHEME_B));
  ctx.fillText(rightHint, W - 56, H - 26);
  ctx.textAlign = 'center';
  ctx.fillText((net.active ? '' : 'R 重开   ') + 'P 暂停   M 静音' + (muted ? '（已静音）' : ''), W / 2, H - 12);
  ctx.textBaseline = 'alphabetic';

  if (net.active) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = net.connected ? 'rgba(126,232,250,0.92)' : 'rgba(255,120,120,0.95)';
    ctx.fillText('联机 · ' + (net.role === 'host' ? '主机' : '客户端')
      + (net.connected ? (' · ' + Math.max(0, Math.round(net.rtt)) + 'ms') : ' · 已断开'), W / 2, 118);
    // 临时提示（如断线接管）：覆盖层已隐藏时也保证玩家看到
    if (netNoticeT > 0) {
      ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,196,90,' + (0.95 * Math.min(1, netNoticeT / 60)).toFixed(3) + ')';
      ctx.fillText(netNotice, W / 2, 146);
    }
    ctx.textBaseline = 'alphabetic';
  }

  if (aiLevel) {
    ctx.textAlign = 'right';
    ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,209,102,0.9)';
    ctx.fillText('[ 电脑 · ' + DIFFS[aiLevel].label + ' ]', W - 58, 106);
  }
}

// ================= 状态遮罩绘制 =================
function drawCountdown() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const n = 3 - Math.floor(stateT / 45);
  if (stateT < 135) {
    const local = (stateT % 45) / 45;
    const scale = 1 + (1 - local) * 0.5;
    ctx.save();
    ctx.globalAlpha = clamp(1.6 - local * 1.6, 0, 1);
    ctx.translate(W / 2, H / 2 - 40); ctx.scale(scale, scale);
    ctx.font = 'bold 160px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText(n, 0, 0);
    const g = ctx.createLinearGradient(0, -80, 0, 80);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffd166');
    ctx.fillStyle = g; ctx.fillText(n, 0, 0);
    ctx.restore();
  } else {
    const local = clamp((stateT - 135) / 25, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1 - local * 0.7;
    ctx.font = 'bold 120px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText('开 始 !', W / 2, H / 2 - 40);
    ctx.fillStyle = '#8fe3ff';
    ctx.fillText('开 始 !', W / 2, H / 2 - 40);
    ctx.restore();
  }
  ctx.globalAlpha = 0.85;
  ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#dbe6ff';
  ctx.fillText('第 ' + round + ' 回合', W / 2, H / 2 + 90);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function drawRoundOver() {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const appear = clamp(stateT / 18, 0, 1);
  ctx.globalAlpha = appear;
  const scale = 1 + (1 - easeOut(appear)) * 0.4;
  ctx.translate(W / 2, H / 2 - 30); ctx.scale(scale, scale);
  if (roundResult === -1) {
    ctx.font = 'bold 96px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText('平 局', 0, 0);
    ctx.fillStyle = '#dfe6ff'; ctx.fillText('平 局', 0, 0);
  } else {
    const winT = roundResult === TEAM_RED ? redTeam[0] : blueTeam[0];
    const winName = roundResult === TEAM_RED ? '红 方' : '蓝 方';
    ctx.font = 'bold 96px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText('K.O.', 0, -40);
    ctx.fillStyle = '#ffffff'; ctx.fillText('K.O.', 0, -40);
    ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
    const g = ctx.createLinearGradient(-200, 0, 200, 0);
    g.addColorStop(0, winT.color2); g.addColorStop(0.5, winT.color); g.addColorStop(1, winT.color2);
    ctx.fillStyle = g;
    ctx.strokeText(winName + ' 获胜', 0, 50);
    ctx.fillText(winName + ' 获胜', 0, 50);
  }
  ctx.restore();
  ctx.globalAlpha = appear;

function wrapText(text, maxW) {
  const tokens = text.match(/[A-Za-z0-9%.+\-]+|./g) || [];
  const lines = [];
  let cur = '';
  for (const tk of tokens) {
    const test = cur + tk;
    if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = tk; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawKeyConfig() {

  const sc = schemeOf(keycfgScheme);
  const col = keycfgScheme === 0 ? '#ff5a5f' : '#4fa8ff';

  // 方案切换标签
  const tabs = [['红方（主控）', 0, '#ff5a5f'], ['蓝方（副控）', 1, '#4fa8ff']];
  for (const [label, idx, c] of tabs) {
    const tw = 260, th = 46, tx = W / 2 - 270 + idx * 280, ty = 122;
    const on = idx === keycfgScheme;
    ctx.fillStyle = on ? 'rgba(38,44,78,0.98)' : 'rgba(16,20,38,0.9)';
    roundRect(tx, ty, tw, th, 10); ctx.fill();

    ctx.fillStyle = on ? '#ffffff' : 'rgba(190,205,235,0.75)';
    ctx.fillText(label, tx + tw / 2, ty + th / 2 + 1);
  }

  // 冲突检测：同一方案内重复绑定
  const used = {};
  for (const a of KEY_ACTIONS) { const k = getBinding(sc, a); used[k] = (used[k] || 0) + 1; }

  const rowW = 660, rowH = 52, x0 = (W - rowW) / 2, y0 = 196;
  for (let i = 0; i < KEY_ACTIONS.length; i++) {
    const a = KEY_ACTIONS[i];
    const code = getBinding(sc, a);
    const sel = i === keycfgIndex;
    const listening = sel && rebind;
    const conflict = used[code] > 1;
    const ry = y0 + i * (rowH + 6), mid = ry + rowH / 2;

    ctx.fillStyle = sel ? 'rgba(38,44,78,0.98)' : 'rgba(16,20,38,0.92)';

    ctx.strokeStyle = listening ? '#ffd166' : sel ? col : 'rgba(120,150,210,0.30)';
    ctx.lineWidth = sel ? 2.5 : 2;
    roundRect(x0, ry, rowW, rowH, 10); ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = sel ? '#ffffff' : 'rgba(205,218,248,0.85)';
    ctx.fillText(a.label, x0 + 26, mid + 1);

    // 右侧按键卡

    ctx.fillStyle = listening ? 'rgba(255,209,102,0.22)' : 'rgba(8,11,26,0.9)';
    roundRect(kx, ky, kw, kh, 8); ctx.fill();
    ctx.strokeStyle = listening ? '#ffd166' : conflict ? '#ff6b6b' : 'rgba(140,170,240,0.5)';
    ctx.lineWidth = 2;
    roundRect(kx, ky, kw, kh, 8); ctx.stroke();

    ctx.fillStyle = listening ? '#ffd166' : conflict ? '#ff9a9a' : '#dfe7ff';
    ctx.fillText(listening ? '按下新按键…' : keyLabel(code), kx + kw / 2, ky + kh / 2 + 1);
    if (conflict && !listening) {
      ctx.font = 'bold 12px "PingFang SC",sans-serif';
      ctx.fillStyle = '#ff8a8a';
      ctx.fillText('按键重复', kx + kw / 2, ry + rowH - 5);

  ctx.textAlign = 'center';
  ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(160,180,220,0.75)';
  ctx.fillText('↑ / ↓ 选择操作　·　← / → 切换红 / 蓝方　·　Enter 修改按键　·　Z 恢复默认', W / 2, H - 62);

  const a2 = 0.5 + 0.5 * Math.sin(time * 0.08);

  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + a2 * 0.6) + ')';
  ctx.fillText('按 Esc 返回主菜单', W / 2, H - 14);

  ctx.fillText('按 Enter 返回主菜单', W / 2, 540);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function drawPaused() {
  ctx.fillStyle = 'rgba(5,7,16,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 80px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  ctx.strokeText('暂 停', W / 2, H / 2 - 10);
  ctx.fillStyle = '#e8f0ff'; ctx.fillText('暂 停', W / 2, H / 2 - 10);
  ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(200,215,255,0.8)';
  ctx.fillText('按 P 继续', W / 2, H / 2 + 70);
  ctx.textBaseline = 'alphabetic';
}

// ================= 2D 兼容渲染（无 WebGL 环境的回退方案） =================
// 复用相机的投影把 3D 世界坐标画到 HUD 画布上，保证任何浏览器都能进游戏。
function worldPx(x, y, z) {
  const a = project(x, y, z), b = project(x + 1, y, z);
  return Math.hypot(b.x - a.x, b.y - a.y) || 0.01;
}
function drawGlow(x, y, r, color, alpha) {
  if (r < 0.5) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(0.4, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawAim2D(f) {
  if (!f.aimMesh.visible) return;
  const len = f.type === 'sword' ? 340 : 620;
  const wid = f.type === 'sword' ? 70 : 90;
  const a = f.angle;
  const p0 = project(f.x, 3, f.z);
  const p1p = project(f.x + Math.sin(a) * len, 3, f.z + Math.cos(a) * len);
  ctx.globalAlpha = 0.20;
  ctx.strokeStyle = f.color; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(3, wid * worldPx(f.x, 3, f.z) * 0.6);
  ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1p.x, p1p.y); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawFighter2D(f) {
  const feet = project(f.x, f.y, f.z);
  const top = project(f.x, f.y + 200, f.z);
  const hgt = Math.max(24, feet.y - top.y);
  const wid = hgt * 0.52;
  const cx = (feet.x + top.x) / 2, cy = (feet.y + top.y) / 2;
  const hurt = f.flash > 0 && (f.flash % 4 < 2);

  // 落地阴影
  const g0 = project(f.x, 0, f.z);
  ctx.globalAlpha = 0.32; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(g0.x, g0.y, wid * 0.62, wid * 0.24, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  // 残影
  for (const gh of f.ghosts) {
    const gp = project(gh.x, 60, gh.z);
    ctx.globalAlpha = (gh.life / 12) * 0.28;
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(gp.x, gp.y - hgt * 0.35, wid * 0.4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(cx, cy);
  // 躯干
  ctx.fillStyle = hurt ? '#ffffff' : f.color;
  roundRect(-wid / 2, -hgt * 0.30, wid, hgt * 0.66, wid * 0.32); ctx.fill();
  // 头
  ctx.fillStyle = hurt ? '#ffffff' : '#f0c39c';
  ctx.beginPath(); ctx.arc(0, -hgt * 0.40, wid * 0.36, 0, TAU); ctx.fill();
  ctx.restore();

  // 朝向 / 武器
  const a = f.angle;
  const dx = Math.sin(a), dy = Math.cos(a);
  const swing = f.attackT > 0 ? (1 - f.attackT / (f.attackDur || 1)) : -1;
  const baseX = cx + dx * wid * 0.5, baseY = cy + dy * wid * 0.5 - hgt * 0.1;
  if (swing >= 0) {
    // 出招弧光
    const arc = clamp(swing / 0.72, 0, 1);
    ctx.globalAlpha = 0.85 * (1 - arc * 0.6);
    ctx.strokeStyle = hurt ? '#fff' : f.color2 || f.color;
    ctx.lineWidth = Math.max(2, wid * 0.22);
    ctx.beginPath();
    ctx.arc(baseX, baseY, wid * (0.9 + arc * 0.6), Math.atan2(dy, dx) - 1.0, Math.atan2(dy, dx) + 0.7);
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = f.color2 || f.color;
    ctx.lineWidth = Math.max(2, wid * 0.14);
    ctx.beginPath(); ctx.moveTo(baseX, baseY);
    ctx.lineTo(cx + dx * wid * 1.5, cy + dy * wid * 1.5 - hgt * 0.1); ctx.stroke();
  }
}
function draw2DScene() {
  // 天空
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050818'); g.addColorStop(0.45, '#0d1536');
  g.addColorStop(0.72, '#20214e'); g.addColorStop(1, '#2b2450');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  camera.updateMatrixWorld();

  const X0 = -ARENA_HX, X1 = ARENA_HX, Z0 = -ARENA_HZ, Z1 = ARENA_HZ;
  const c00 = project(X0, 0, Z0), c10 = project(X1, 0, Z0), c11 = project(X1, 0, Z1), c01 = project(X0, 0, Z1);

  // 地板
  ctx.beginPath();
  ctx.moveTo(c00.x, c00.y); ctx.lineTo(c10.x, c10.y); ctx.lineTo(c11.x, c11.y); ctx.lineTo(c01.x, c01.y);
  ctx.closePath();
  ctx.fillStyle = '#141a34'; ctx.fill();

  // 网格
  ctx.strokeStyle = 'rgba(110,150,255,0.16)'; ctx.lineWidth = 1;
  for (let x = X0; x <= X1 + 1; x += 155) {
    const a = project(x, 0, Z0), b = project(x, 0, Z1);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let z = Z0; z <= Z1 + 1; z += 155) {
    const a = project(X0, 0, z), b = project(X1, 0, z);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // 中央符文圈
  ctx.strokeStyle = 'rgba(120,170,255,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const t = i / 48 * TAU, p = project(Math.cos(t) * 370, 0, Math.sin(t) * 370);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.stroke();
  // 四周光墙
  ctx.strokeStyle = 'rgba(95,128,255,0.55)'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(c00.x, c00.y); ctx.lineTo(c10.x, c10.y); ctx.lineTo(c11.x, c11.y); ctx.lineTo(c01.x, c01.y);
  ctx.closePath(); ctx.stroke();

  // 障碍物（顶面 + 两个可见侧面）
  for (const o of OBSTACLES) {
    const x0 = o.x - o.hx, x1 = o.x + o.hx, z0 = o.z - o.hz, z1 = o.z + o.hz;
    const t0 = project(x0, o.h, z0), t1 = project(x1, o.h, z0),
          t2 = project(x1, o.h, z1), t3 = project(x0, o.h, z1);
    const g0 = project(x0, 0, z0), g3 = project(x0, 0, z1), g2 = project(x1, 0, z1);
    ctx.fillStyle = '#232c55';
    ctx.beginPath();
    ctx.moveTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y); ctx.lineTo(g3.x, g3.y); ctx.lineTo(g2.x, g2.y);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(t3.x, t3.y); ctx.lineTo(t0.x, t0.y); ctx.lineTo(g0.x, g0.y); ctx.lineTo(g3.x, g3.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3b4a86';
    ctx.beginPath();
    ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,160,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // 技能指向
  for (const f of fighters) drawAim2D(f);
  // 地面冲击环
  for (const r of rings) {
    if (!r.active) continue;
    const rad = r.m.scale.x;
    const cc = project(r.m.position.x, 3, r.m.position.z);
    const rx = Math.abs(project(r.m.position.x + rad, 0, r.m.position.z).x - cc.x);
    if (rx < 1) continue;
    ctx.globalAlpha = r.m.material.opacity;
    ctx.strokeStyle = '#' + r.m.material.color.getHexString();
    ctx.lineWidth = Math.max(1.5, rx * 0.10);
    ctx.beginPath(); ctx.ellipse(cc.x, cc.y, rx, rx * 0.42, 0, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 角色（后画的覆盖前面的：按 z 从远到近）
  const order = fighters.filter(f => !f.dead && !f.bench).slice().sort((a, b) => a.z - b.z);
  for (const f of order) drawFighter2D(f);

  // 弹道
  for (const pr of projectiles) {
    const p = project(pr.x, pr.y, pr.z);
    const k = worldPx(pr.x, pr.y, pr.z);
    drawGlow(p.x, p.y, Math.max(4, pr.r * k * 1.6), pr.color, 0.9);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, pr.r * k * 0.9), 0, TAU); ctx.fill();
  }
  // 火花
  for (const s of sparks) {
    if (!s.active) continue;
    const sp = s.s.position;
    const p = project(sp.x, sp.y, sp.z);
    const k = worldPx(sp.x, sp.y, sp.z);
    drawGlow(p.x, p.y, Math.max(1.5, s.s.scale.x * k * 0.9), '#' + s.s.material.color.getHexString(), s.s.material.opacity);
  }

  // 兼容模式标记
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(180,200,255,0.55)';
  ctx.fillText('2D 兼容模式（当前环境不支持 WebGL）', 16, H - 18);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

// ================= 渲染 =================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (netNoticeT > 0) netNoticeT--;

  // 血条平滑
  for (const f of fighters) f.hpDisplay += (f.hp - f.hpDisplay) * 0.14;

  updateCamera();
  if (use2D) draw2DScene(); else renderer.render(scene, camera);

  if (gameState === 'menu') { drawMenu(); return; }
  if (gameState === 'heroselect') { drawHeroSelect(); return; }
  if (gameState === 'keyconfig') { drawKeyConfig(); return; }
  if (gameState === 'netlobby') return;   // 联机大厅由 DOM 覆盖层呈现
  if (gameState === 'account' || gameState === 'leaderboard') return;   // 账号 / 排行榜由 DOM 覆盖层呈现
  drawHUD();
  drawSlashes();
  drawFloaters();
  drawKillBanner();

  if (gameState === 'countdown') drawCountdown();
  if (gameState === 'roundover') drawRoundOver();
  if (gameState === 'upgrade') drawUpgrade();
  if (gameState === 'gameover') drawGameOver();
  if (paused && (gameState === 'fight' || gameState === 'countdown' || gameState === 'roundover')) drawPaused();
}

// ================= 主循环（固定步长） =================
let acc = 0, last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  const step = 1 / 60;
  let guard = 0;
  while (acc >= step && guard++ < 5) {
    if (hitstopT > 0) hitstopT--;              // 顿帧：冻结模拟，仅保留画面与特效
    else fixedUpdate();
    acc -= step;
  }
  render();
  requestAnimationFrame(loop);
}
loadKeys();                 // 读取本地保存的自定义键位
apiRefreshSession();        // 读取登录状态（后端不可用时静默忽略）
netLoadIce();               // 拉取后端 TURN 凭证（失败时退回纯 STUN）
requestAnimationFrame(loop);

})();
</script>
</body>
