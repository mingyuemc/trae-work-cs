<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>王者对决 · 3D MOBA 对战</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#05060c;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  #stage{width:1280px;height:720px;flex:0 0 auto;position:relative;transform-origin:center center;
    box-shadow:0 0 80px rgba(90,140,255,.28), 0 0 0 1px rgba(120,160,255,.15);
    border-radius:10px;overflow:hidden;background:#05060c;}
  #stage canvas{position:absolute;inset:0;display:block;width:1280px;height:720px;}
  #hud{pointer-events:none;z-index:2;}
  #netui{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:40px;text-align:center;color:#dbe4ff;
    background:radial-gradient(circle at 50% 35%,#141a3a,#05060c 72%);}
  #netui h2{font-size:30px;letter-spacing:2px;color:#ffd166;}
  #netui p{font-size:15px;line-height:1.75;color:#93a2cf;max-width:760px;}
  #netui b{color:#cfe0ff;}
  #netui textarea{width:760px;height:104px;resize:none;background:#0b0f22;color:#cfe0ff;
    border:1px solid rgba(120,160,255,.35);border-radius:8px;padding:10px;font-size:12px;
    line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;outline:none;}
  #netui .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  #netui button{cursor:pointer;padding:12px 26px;border-radius:10px;border:1px solid rgba(140,170,240,.5);
    background:linear-gradient(180deg,#2a3566,#1a2244);color:#e6eeff;font-size:17px;font-weight:600;
    font-family:inherit;}
  #netui button:hover{background:linear-gradient(180deg,#38477f,#232c57);}
  #netui button.pri{background:linear-gradient(180deg,#ffd166,#f0a52e);color:#3a2600;border-color:#ffd166;}
  #netui #netMsg{min-height:20px;color:#7ee8fa;font-size:14px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="hud" width="1280" height="720"></canvas><div id="netui"></div></div></div>
<script src="three.min.js"></script>
<script>
(() => {
'use strict';

// ================= 基础常量与数学工具 =================
const W = 1280, H = 720;
const TAU = Math.PI * 2;
const GRAVITY = 0.9;              // 竖直方向重力（每帧）
const ARENA_HX = 1800, ARENA_HZ = 1360;  // 竞技场半宽（x 轴）/ 半深（z 轴）
const BODY_R = 30;                // 角色水平碰撞半径
const GROUND_Y = 0;
const SPAWN_X = 620;              // 双方出生基地 x 坐标（±，对称）
const GROUND_TEX_HALF = 2200;     // 地面纹理半宽（512px）对应的世界距离（地面平面 4400）
const TEAM_SIZE = 5, TEAM_RED = 0, TEAM_BLUE = 1;
const RESPAWN_TIME = 300;         // 阵亡后复活所需帧数（5 秒）
const SLOT_Z = [0, -420, 420, -210, 210];   // 队内 5 个出生位的 z 偏移

// 地图障碍物：每局随机生成（hx/hz 为半宽，h 为高度）
let OBSTACLES = [];
let obstacleMeshes = [];
let obstacleVer = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const distXZ = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const aimAt = (a, b) => Math.atan2(b.x - a.x, b.z - a.z);   // 朝向 b 的角度

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const ctx = hud.getContext('2d');
function roundRect(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ================= 自适应缩放 =================
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit);
fit();

// ================= 输入 =================
const keys = Object.create(null);
const pressed = Object.create(null);
const BLOCK = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  initAudio();
}, { passive: false });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function consume(code) { if (pressed[code]) { pressed[code] = false; return true; } return false; }
function clearPressed() { for (const k in pressed) delete pressed[k]; }

// ================= 音频引擎（WebAudio 实时合成，无需外部音频文件） =================
let actx = null, muted = false;
let masterGain = null, sfxGain = null, musicGain = null, noiseBuf = null;

const N = m => 440 * Math.pow(2, (m - 69) / 12);   // MIDI 音高 → 频率

function initAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain(); masterGain.gain.value = 1; masterGain.connect(actx.destination);
      sfxGain = actx.createGain(); sfxGain.gain.value = 0.85; sfxGain.connect(masterGain);
      musicGain = actx.createGain(); musicGain.gain.value = 0; musicGain.connect(masterGain);
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.5), actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
  if (actx) {
    if (Music.pending) { const n = Music.pending; Music.pending = null; Music.play(n); }
    Music.apply();
  }
}

// ---- 音效 ----
function tone(freq, dur, type, vol, slideTo) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseHit(dur, vol, hp, t, dest) {
  if (!actx || muted || !noiseBuf) return;
  const at = t === undefined ? actx.currentTime : t;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxGain);
  s.start(at); s.stop(at + dur + 0.02);
}

const SFX = {
  hit()   { tone(230, 0.12, 'square', 0.09, 90); noiseHit(0.06, 0.05, 1800); },
  slash() { tone(760, 0.08, 'sawtooth', 0.05, 300); noiseHit(0.05, 0.03, 2400); },
  shoot() { tone(560, 0.13, 'triangle', 0.06, 190); },
  dash()  { tone(300, 0.2, 'sawtooth', 0.07, 950); noiseHit(0.16, 0.035, 900); },
  jump()  { tone(430, 0.1, 'sine', 0.05, 720); },
  land()  { tone(140, 0.14, 'sine', 0.07, 60); noiseHit(0.08, 0.04, 700); },
  boom()  { tone(130, 0.3, 'sawtooth', 0.11, 45); noiseHit(0.22, 0.07, 500); },
  ko()    { tone(170, 0.5, 'sawtooth', 0.1, 55); noiseHit(0.3, 0.06, 400); },
  heavy() { tone(180, 0.22, 'sawtooth', 0.11, 70); tone(560, 0.1, 'square', 0.05, 200); noiseHit(0.16, 0.07, 1100); },
  whirl() { tone(340, 0.42, 'sawtooth', 0.08, 880); noiseHit(0.38, 0.05, 1600); },
  nova()  { tone(1250, 0.34, 'sine', 0.09, 320); tone(760, 0.3, 'triangle', 0.06, 1600); noiseHit(0.28, 0.05, 2600); },
  ready() { tone(1180, 0.08, 'sine', 0.045, 1500); },
  nav()   { tone(600, 0.06, 'square', 0.05); },
  count() { tone(680, 0.12, 'sine', 0.07); },
  go()    { tone(880, 0.28, 'sine', 0.09, 1250); }
};

// ---- 背景音乐：实时合成的循环乐段 ----
function blip(midi, t, dur, type, vol, dest, attack) {
  if (!actx || muted || !dest) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(N(midi), t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (attack || 0.012));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.04);
}
function pad(midi, t, dur, vol, dest) {
  if (!actx || muted || !dest) return;
  const o = actx.createOscillator(), o2 = actx.createOscillator();
  const f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'sawtooth'; o2.type = 'sawtooth';
  o.frequency.setValueAtTime(N(midi), t);
  o2.frequency.setValueAtTime(N(midi) * 1.006, t);
  f.type = 'lowpass'; f.frequency.value = 950; f.Q.value = 0.6;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.55);
  g.gain.setValueAtTime(vol, t + dur * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(dest);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function kick(t, dest) {
  if (!actx || muted || !dest) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(155, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.24);
}
const snare = (t, dest) => noiseHit(0.13, 0.22, 1500, t, dest);
const hat   = (t, dest) => noiseHit(0.035, 0.08, 7000, t, dest);

const ROOTS = [45, 41, 48, 43];
const TRIAD = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];
const LEAD = { 16: [76, 3], 19: [74, 1], 20: [72, 2], 24: [69, 4], 29: [72, 1], 30: [74, 2], 31: [76, 1] };

const TRACKS = {
  menu: {
    bpm: 74, len: 32, vol: 0.55,
    play(step, t, sd, dest) {
      const bar = (step / 8) | 0, s = step % 8, root = ROOTS[bar], triad = TRIAD[bar];
      if (s === 0) {
        blip(root - 12, t, sd * 7.5, 'triangle', 0.16, dest, 0.4);
        for (const m of triad) pad(m, t, sd * 7.6, 0.05, dest);
      }
      if (s % 2 === 0) blip(triad[(s / 2) % 3] + 12, t, sd * 1.3, 'triangle', 0.05, dest, 0.05);
    }
  },
  battle: {
    bpm: 138, len: 32, vol: 0.5,
    play(step, t, sd, dest) {
      const bar = (step / 8) | 0, s = step % 8, root = ROOTS[bar], triad = TRIAD[bar];
      if (s === 0 || s === 3 || s === 4) blip(root - 12, t, sd * 1.5, 'square', 0.13, dest, 0.01);
      if (s === 6) blip(root, t, sd * 1.2, 'square', 0.1, dest, 0.01);
      if (s === 7) blip(root - 5, t, sd * 0.9, 'square', 0.09, dest, 0.01);
      if (s === 0 || s === 4) kick(t, dest);
      if (s === 2 || s === 6) snare(t, dest);
      if (s % 2 === 1) hat(t, dest);
      blip(triad[s % 3] + 12, t, sd * 0.85, 'triangle', 0.045, dest, 0.01);
      const ld = LEAD[step];
      if (ld) blip(ld[0], t, sd * ld[1], 'square', 0.075, dest, 0.01);
    }
  }
};

const Music = {
  track: null, pending: null, voice: null, step: 0, nextTime: 0, timer: null, duck: 1,

  play(name) {
    if (!actx) { this.pending = name; return; }
    if (this.track === name && this.voice) return;
    const now = actx.currentTime;
    if (this.voice) this.fadeVoice(this.voice, 0, now + 0.45);
    this.track = name; this.step = 0; this.nextTime = now + 0.08;
    const v = actx.createGain();
    v.gain.setValueAtTime(0, now);
    v.gain.linearRampToValueAtTime(TRACKS[name].vol, now + 0.9);
    v.connect(musicGain);
    this.voice = v;
    this.apply(0.5);
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },
  stop() {
    this.pending = null;
    if (actx && this.voice) this.fadeVoice(this.voice, 0, actx.currentTime + 0.4);
    this.voice = null; this.track = null;
    this.apply(0.4);
  },
  fadeVoice(v, to, endTime) {
    const g = v.gain, now = actx.currentTime;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(now);
    else { g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); }
    g.linearRampToValueAtTime(to, endTime);
    setTimeout(() => { try { v.disconnect(); } catch (e) { } }, (endTime - now + 0.25) * 1000);
  },
  apply(fade) {
    if (!actx || !musicGain) return;
    const now = actx.currentTime, g = musicGain.gain;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(now);
    else { g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); }
    g.linearRampToValueAtTime(muted ? 0 : this.duck, now + (fade === undefined ? 0.6 : fade));
  },
  tick() {
    if (!actx || !this.track || !this.voice) return;
    if (muted) { this.nextTime = actx.currentTime + 0.1; return; }
    const tr = TRACKS[this.track];
    const sd = 60 / tr.bpm / 2;
    if (this.nextTime < actx.currentTime) this.nextTime = actx.currentTime + 0.02;
    while (this.nextTime < actx.currentTime + 0.14) {
      tr.play(this.step, this.nextTime, sd, this.voice);
      this.step = (this.step + 1) % tr.len;
      this.nextTime += sd;
    }
  }
};

function playVictory() {
  if (!actx || muted) return;
  const t0 = actx.currentTime + 0.08, D = sfxGain;
  [[69, 0, .18], [72, .18, .18], [76, .36, .18], [81, .56, .75]]
    .forEach(([m, dt, d]) => blip(m, t0 + dt, d, 'square', 0.14, D, 0.01));
  [57, 60, 64, 69].forEach(m => blip(m, t0 + .56, 1.1, 'triangle', 0.085, D, 0.02));
  noiseHit(0.4, 0.05, 3000, t0 + .56, D);
}
Music.play('menu');

// ================= Three.js 场景基座 =================
// 若环境不支持 WebGL，则自动降级到 2D 兼容渲染（use2D = true），保证仍可对战。
let renderer = null;
let use2D = false;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);
  renderer.domElement.style.zIndex = '1';
} catch (err) {
  console.warn('[3D MOBA] WebGL 不可用，已切换到 2D 兼容渲染：', err);
  use2D = true;
}

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1030, 2600, 6600);

const camera = new THREE.PerspectiveCamera(48, W / H, 1, 9000);
camera.position.set(0, 900, 620);
camera.lookAt(0, 0, 0);

// ---- 光照 ----
const hemi = new THREE.HemisphereLight(0x9db4ff, 0x1a1030, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.05);
sun.position.set(420, 900, 320);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 100; sun.shadow.camera.far = 5200;
sun.shadow.camera.left = -2100; sun.shadow.camera.right = 2100;
sun.shadow.camera.top = 2100; sun.shadow.camera.bottom = -2100;
sun.shadow.bias = -0.0009;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6f8fff, 0.45);
rim.position.set(-500, 400, -600);
scene.add(rim);

// ---- 天空背景（画布生成的渐变 + 星月） ----
function makeSkyTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const b = c.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#050818');
  g.addColorStop(0.45, '#0d1536');
  g.addColorStop(0.72, '#20214e');
  g.addColorStop(1, '#2b2450');
  b.fillStyle = g; b.fillRect(0, 0, 1024, 512);
  const rnd = mulberry32(9);
  for (let i = 0; i < 220; i++) {
    const x = rnd() * 1024, y = rnd() * 300;
    b.globalAlpha = rnd() * 0.75 + 0.15;
    b.fillStyle = '#d6e6ff';
    b.beginPath(); b.arc(x, y, rnd() * 1.5 + 0.3, 0, TAU); b.fill();
  }
  b.globalAlpha = 1;
  // 月亮
  const mx = 810, my = 120, mr = 52;
  const mg = b.createRadialGradient(mx, my, 6, mx, my, mr * 4);
  mg.addColorStop(0, 'rgba(180,205,255,0.35)');
  mg.addColorStop(0.4, 'rgba(150,180,255,0.12)');
  mg.addColorStop(1, 'rgba(150,180,255,0)');
  b.fillStyle = mg; b.beginPath(); b.arc(mx, my, mr * 4, 0, TAU); b.fill();
  b.fillStyle = '#e6eeff'; b.beginPath(); b.arc(mx, my, mr, 0, TAU); b.fill();
  b.fillStyle = 'rgba(150,175,220,0.42)';
  b.beginPath(); b.arc(mx - 16, my - 12, 9, 0, TAU); b.fill();
  b.beginPath(); b.arc(mx + 15, my + 10, 13, 0, TAU); b.fill();
  const t = new THREE.CanvasTexture(c);
  return t;
}
scene.background = makeSkyTexture();

// ---- 场地地面纹理 ----
function makeGroundTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const b = c.getContext('2d');
  // 底色
  const g = b.createRadialGradient(512, 512, 60, 512, 512, 720);
  g.addColorStop(0, '#2a2f5e');
  g.addColorStop(0.55, '#1a1d3c');
  g.addColorStop(1, '#0b0c1c');
  b.fillStyle = g; b.fillRect(0, 0, 1024, 1024);
  // 网格
  b.strokeStyle = 'rgba(120,160,255,0.10)'; b.lineWidth = 1.5;
  for (let i = 0; i <= 1024; i += 64) {
    b.beginPath(); b.moveTo(i, 0); b.lineTo(i, 1024); b.stroke();
    b.beginPath(); b.moveTo(0, i); b.lineTo(1024, i); b.stroke();
  }
  // 场地边框（对应世界 ARENA_HX / HZ）
  const px = u => 512 + u / GROUND_TEX_HALF * 512;   // 世界单位 → 纹理像素
  const pz = u => 512 + u / GROUND_TEX_HALF * 512;
  b.strokeStyle = 'rgba(150,190,255,0.55)'; b.lineWidth = 5;
  b.strokeRect(px(-ARENA_HX), pz(-ARENA_HZ), px(ARENA_HX) - px(-ARENA_HX), pz(ARENA_HZ) - pz(-ARENA_HZ));
  b.strokeStyle = 'rgba(120,160,255,0.22)'; b.lineWidth = 14;
  b.strokeRect(px(-ARENA_HX) - 10, pz(-ARENA_HZ) - 10, px(ARENA_HX) - px(-ARENA_HX) + 20, pz(ARENA_HZ) - pz(-ARENA_HZ) + 20);
  // 中央符文圈
  b.save();
  b.translate(512, 512);
  for (let i = 0; i < 3; i++) {
    b.globalAlpha = 0.30 - i * 0.07;
    b.strokeStyle = '#8fb8ff'; b.lineWidth = 3;
    b.beginPath(); b.arc(0, 0, (200 + i * 160) / GROUND_TEX_HALF * 512, 0, TAU); b.stroke();
  }
  b.globalAlpha = 0.5;
  b.strokeStyle = '#8fb8ff'; b.lineWidth = 2;
  b.beginPath(); b.moveTo(-170, 0); b.lineTo(170, 0); b.stroke();
  b.beginPath(); b.moveTo(0, -170); b.lineTo(0, 170); b.stroke();
  b.restore();
  b.globalAlpha = 1;
  // 障碍物底座标记
  b.fillStyle = 'rgba(110,150,255,0.16)';

    b.lineWidth = 3;

  }
  const t = new THREE.CanvasTexture(c);

}

// 点到矩形（含半宽 hx/hz）的最短距离
function pointRectDist(px, pz, o) {
  const dx = Math.max(0, Math.abs(px - o.x) - o.hx);
  const dz = Math.max(0, Math.abs(pz - o.z) - o.hz);
  return Math.hypot(dx, dz);
}
// 两矩形（带间距 pad）是否重叠
function rectsOverlap(a, b, pad) {
  return Math.abs(a.x - b.x) < a.hx + b.hx + pad && Math.abs(a.z - b.z) < a.hz + b.hz + pad;
}

// 随机生成障碍布局：点对称，保证双方公平；避开双方基地与中央符文区
function generateLayout() {
  const pairs = randInt(4, 7);
  const list = [];
  let tries = 0;
  while (list.length < pairs && tries < 1400) {
    tries++;
    const hx = rand(80, 150), hz = rand(70, 140);
    const o = {
      x: rand(430, ARENA_HX - hx - 140),
      z: rand(-(ARENA_HZ - hz - 140), ARENA_HZ - hz - 140),
      hx: hx, hz: hz, h: rand(70, 112)
    };
    if (Math.hypot(o.x, o.z) < 720) continue;                              // 中央保护区
    if (Math.abs(o.x - SPAWN_X) < o.hx + 320 && Math.abs(o.z) < o.hz + 560) continue;   // 基地净空（镜像自动对称）
    let bad = false;
    for (const q of list) {
      if (rectsOverlap(o, q, 220) || rectsOverlap(o, { x: -q.x, z: -q.z, hx: q.hx, hz: q.hz }, 220)) { bad = true; break; }
    }
    if (bad) continue;
    list.push(o);
  }
  // 镜像出另一半（点对称）
  return list.concat(list.map(o => ({ x: -o.x, z: -o.z, hx: o.hx, hz: o.hz, h: o.h })));
}

// 应用一套障碍布局：刷新地面纹理与 3D 网格
function applyObstacleLayout(arr) {
  OBSTACLES = arr;
  if (groundMat.map) groundMat.map.dispose();
  groundMat.map = makeGroundTexture();
  groundMat.needsUpdate = true;
  buildObstacleMeshes();
}
// 每局随机重开
function regenerateObstacles() {
  applyObstacleLayout(generateLayout());
  obstacleVer++;
}

}

// ================= 敌人 AI（x/z 平面决策） =================
const DIFFS = {
  easy:   { label: '简单', dmg: 0.60, react: 34, skillChance: 0.25, dodge: 0.15, aggro: 0.45, hold: [34, 84] },
  normal: { label: '普通', dmg: 0.90, react: 18, skillChance: 0.45, dodge: 0.42, aggro: 0.65, hold: [22, 58] },
  hard:   { label: '困难', dmg: 1.20, react: 10, skillChance: 0.65, dodge: 0.72, aggro: 0.92, hold: [14, 36] }
};

class EnemyAI {
  constructor(level) {
    this.level = level;
    this.p = DIFFS[level] || DIFFS.normal;
    this.reset();
  }
  reset() {
    this.t = 0; this.aimT = 0; this.reactCd = 0; this.decideCd = 0; this.step = 0; this.stepDir = 1; this.actCd = 0;
  }
  think(self, prs) {
    const p = this.p;
    const out = { up: false, down: false, left: false, right: false, attack: false, skills: [false, false] };
    this.t++;
    if (this.reactCd > 0) this.reactCd--;
    if (this.actCd > 0) this.actCd--;

    const opp = nearestEnemy(self);       // 就近选择敌方目标
    self.aiTarget = opp;
    if (!opp) return out;

    const dx = opp.x - self.x, dz = opp.z - self.z;
    const dist = Math.hypot(dx, dz) || 1;
    const ux = dx / dist, uz = dz / dist;      // 指向对手的单位向量

    // ---------- 1. 闪避：来袭弹道 ----------
    let threat = null, threatDist = 1e9;
    for (const pr of prs) {
      if (pr.owner && pr.owner.side === self.side) continue;   // 只闪避敌方弹道
      const rx = self.x - pr.x, rz = self.z - pr.z;
      const toward = (pr.vx * rx + pr.vz * rz) > 0;   // 弹道是否朝自己飞来
      const pd = Math.hypot(rx, rz);
      if (toward && pd < threatDist) { threatDist = pd; threat = pr; }
    }
    let dodging = false, strafe = 0;
    if (self.y <= 0.01 && this.reactCd <= 0 && threat && threatDist < 340) {
      this.reactCd = 6;
      if (Math.random() < p.dodge) {
        strafe = Math.random() < 0.5 ? 1 : -1;   // 向侧面闪避弹道
        dodging = true;
      }
    }
    if (!dodging && self.y <= 0.01 && this.reactCd <= 0 && opp.dashT > 0 && dist < 320) {
      this.reactCd = 6;
      if (Math.random() < p.dodge) { strafe = Math.random() < 0.5 ? 1 : -1; dodging = true; }
    }

    // ---------- 2. 距离控制 ----------
    let desired;
    if (self.type === 'sword') desired = self.hp / self.maxHp < 0.3 ? 82 : 92;
    else {
      desired = 300 + (p.aggro - 0.45) * 200;
      if (dist < 190) desired = Math.max(desired, 430);
      if (opp.hp / opp.maxHp < 0.3) desired = Math.max(desired, 360);
    }
    let radial = 0;
    if (!dodging) {
      if (dist < desired - 60) radial = -1;
      else if (dist > desired + 60) radial = 1;
    }
    // 巡航窗口：随机小幅走位/绕圈
    if (this.decideCd > 0) this.decideCd--;
    else {
      this.decideCd = randInt(p.hold[0], p.hold[1]);
      this.step = Math.random() < 0.5 ? (Math.random() < 0.5 ? -1 : 1) : 0;
      this.stepDir = Math.random() < 0.5 ? -1 : 1;
    }
    let tan = strafe !== 0 ? strafe : (radial === 0 ? this.step : this.step * 0.6);

    let mx = ux * radial - uz * tan;
    let mz = uz * radial + ux * tan;

    // 边界处理：贴近边界时向内回推
    const m = 120;
    if (self.x < -ARENA_HX + m) mx += 1.2;
    if (self.x > ARENA_HX - m) mx -= 1.2;
    if (self.z < -ARENA_HZ + m) mz += 1.2;
    if (self.z > ARENA_HZ - m) mz -= 1.2;

    // 障碍物规避：临近方块时沿最近面外推，避免撞墙卡死
    for (const o of OBSTACLES) {
      const ox = self.x - o.x, oz = self.z - o.z;
      const ex = o.hx + 70, ez = o.hz + 70;
      if (Math.abs(ox) < ex && Math.abs(oz) < ez) {
        const penX = ex - Math.abs(ox), penZ = ez - Math.abs(oz);
        if (penX < penZ) mx += (ox < 0 ? -1 : 1) * (penX / ex) * 2.2;
        else             mz += (oz < 0 ? -1 : 1) * (penZ / ez) * 2.2;
      }
    }

    // 友军分离：避免 AI 队友互相堆叠
    for (const a of alliesOf(self)) {
      if (a === self || a.dead) continue;
      const ax = self.x - a.x, az = self.z - a.z;
      const ad = Math.hypot(ax, az);
      if (ad > 0.001 && ad < 92) { mx += ax / ad; mz += az / ad; }
    }

    if (mx > 0.25) out.right = true; else if (mx < -0.25) out.left = true;
    if (mz > 0.25) out.down = true; else if (mz < -0.25) out.up = true;

    // ---------- 3. 普通攻击 ----------
    const range = self.type === 'sword' ? 150 : 620;
    if (dist <= range) this.aimT++; else this.aimT = 0;
    const hittable = opp.y <= 0.01 && opp.dashT <= 0 && opp.invuln <= 0 && !opp.dead;

    if (!dodging && dist <= range && self.attackCd <= 0 && self.attackT <= 0 && this.aimT >= p.react) {
      let fire = false;
      if (self.type === 'sword') fire = dist <= 140 && opp.invuln <= 0;
      else fire = hittable || this.level === 'easy';
      if (fire) { out.attack = true; this.aimT = 0; }
    }

    // ---------- 4. 技能 ----------
    if (!dodging && !out.attack && self.attackT <= 0 && this.actCd <= 0) {
      this.actCd = 20;
      if (self.type === 'sword') {
        if (self.cds[1] <= 0 && dist < 180 && hittable && Math.random() < p.skillChance * 0.8) out.skills[1] = true;
        else if (self.cds[0] <= 0 && dist > 140 && dist < 320 && hittable && Math.random() < p.skillChance) out.skills[0] = true;
      } else {
        if (self.cds[1] <= 0 && dist < 220 && hittable && Math.random() < p.skillChance * 0.7) out.skills[1] = true;
        else if (self.cds[0] <= 0 && hittable && dist > 160 && dist < 640 && Math.random() < p.skillChance) out.skills[0] = true;
      }
    }
    return out;
  }
}

function alliesOf(f) { return f.side === TEAM_RED ? redTeam : blueTeam; }
function enemiesOf(f) { return f.side === TEAM_RED ? blueTeam : redTeam; }
function nearestEnemy(f) {
  const list = enemiesOf(f);
  let best = null, bd = 1e9;
  for (const e of list) {
    if (e.dead) continue;
    const d = distXZ(f, e);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function teamAlive(side) { const t = side === TEAM_RED ? redTeam : blueTeam; return t.some(f => !f.dead); }

  { id: 'lifesteal', name: '嗜血', tier: 3, desc: '造成伤害的 12% 转化为治疗',
    apply(f) { f.mods.lifesteal += 0.12; } },
  { id: 'finisher', name: '破军', tier: 3, desc: '连招收招（第三段）伤害 +45%',
    apply(f) { f.mods.finisher += 0.45; } }
];
const UPGRADE_MAX = 3;
function rollTeamUpgrades(ts) {
  const bag = UPGRADES.filter(u => (ts.upgradeCounts[u.id] || 0) < UPGRADE_MAX);
  const out = [];
  while (out.length < 3 && bag.length) {
    out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
  }
  return out;
}

// ================= 3D 角色建模 =================
function matStandard(color, rough, metal) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: rough === undefined ? 0.55 : rough, metalness: metal === undefined ? 0.35 : metal });
}
function boxMesh(w, h, d, mat, px, py, pz) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  m.position.set(px || 0, py || 0, pz || 0);
  return m;
}
function sphereMesh(r, mat, px, py, pz, seg) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg || 16, seg || 14), mat);
  m.castShadow = true; m.receiveShadow = true;
  m.position.set(px || 0, py || 0, pz || 0);
  return m;
}
// 肢体：以肩/髋为轴，网格向下垂挂，便于旋转摆动
function limbPivot(w, h, d, mat, px, py) {
  const g = new THREE.Group();
  g.position.set(px, py, 0);
  const m = boxMesh(w, h, d, mat, 0, -h / 2, 0);
  g.add(m);
  return g;
}

function buildSwordHero(color, color2) {
  const grp = new THREE.Group();
  const main = matStandard(color, 0.45, 0.55);   // 红甲
  const dark = matStandard(color2, 0.5, 0.5);

  const gold = matStandard('#ffd166', 0.35, 0.8);
  const steel = new THREE.MeshStandardMaterial({ color: 0xdfe9ff, roughness: 0.25, metalness: 0.9 });
  const mats = [main, dark, skin, gold, steel];   // 本英雄专属材质（受击闪白用）

  // 腿（髋部为轴）
  const legL = limbPivot(16, 62, 18, dark, -13, 66);
  const legR = limbPivot(16, 62, 18, main, 13, 66);
  grp.add(legL, legR);
  // 躯干
  const body = boxMesh(50, 66, 32, main, 0, 105, 0);
  grp.add(body);
  grp.add(boxMesh(52, 12, 34, dark, 0, 72, 0));            // 腰带
  grp.add(sphereMesh(13, dark, -27, 132, 0));              // 肩甲
  grp.add(sphereMesh(13, dark, 27, 132, 0));
  grp.add(sphereMesh(6, gold, 0, 100, 16));                // 胸甲宝石
  // 头
  const head = sphereMesh(20, skin, 0, 156, 0);
  grp.add(head);
  grp.add(sphereMesh(21, dark, 0, 160, -2, 16));           // 头盔
  const crest = boxMesh(6, 26, 20, main, 0, 186, -4);      // 头盔冠羽
  crest.rotation.x = -0.15;
  grp.add(crest);
  // 手臂
  const armL = limbPivot(14, 58, 14, dark, -27, 130);
  const armR = limbPivot(14, 58, 14, skin, 27, 130);
  grp.add(armL, armR);
  // 剑（挂在右臂手部）
  const sword = new THREE.Group();
  sword.position.set(0, -56, 0);
  const blade = boxMesh(8, 96, 14, steel, 0, -46, 0);
  const guard = boxMesh(28, 8, 16, gold, 0, -4, 0);
  const hilt = boxMesh(8, 16, 8, dark, 0, 6, 0);
  sword.add(blade, guard, hilt);
  armR.add(sword);

  grp.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return { group: grp, parts: { legL, legR, armL, armR, head, body, weapon: sword, glow: null }, mats };
}

// 技能指向指示（贴地平面，朝对手方向延伸）
function makeAimIndicator(color) {
  const geo = new THREE.PlaneGeometry(1, 1);

    color, transparent: true, opacity: 0.22, side: THREE.DoubleSide,

// ================= 角色逻辑（3D） =================
class Fighter {
  constructor(cfg) {
    this.name = cfg.name;
    this.color = cfg.color;
    this.color2 = cfg.color2;
    this.type = cfg.type;
    this.side = cfg.side;
    this.maxHp = cfg.maxHp;
    this.speed = cfg.speed;
    this.controls = cfg.controls;
    this.startX = cfg.startX;
    this.startZ = cfg.startZ || 0;
    this.startAngle = cfg.startAngle;
    this.radius = BODY_R;
    this.slot = cfg.slot || 0;
    this.index = cfg.index || 0;
    this.dmg = cfg.type === 'sword' ? 12 : 8;
    this.ai = null;
    this.netPeer = null;               // 联机：该角色由哪个远端客户端操控
    this.dmgMul = 1;
    this.kills = 0;
    this.baseMaxHp = cfg.maxHp;
    this.skills = SKILLS[cfg.type];
    this.resetMods();
    // 3D 表现
    const built = cfg.type === 'sword' ? buildSwordHero(cfg.color, cfg.color2) : buildMageHero(cfg.color, cfg.color2);
    this.model = built.group;
    this.parts = built.parts;
    this.mats = built.mats;
    this.model.position.set(cfg.startX, 0, this.startZ);
    scene.add(this.model);
    this.aimMesh = makeAimIndicator(cfg.color);
    this.reset();
  }
  resetMods() {
    this.hpBonus = 0;
    this.mods = {
      cd: 1, power: 1, atk: 1, range: 1, speed: 1,
      lifesteal: 0, finisher: 1, skillPower: [1, 1], skillCd: [1, 1]
    };
    this.upgrades = [];
    this.upgradeCounts = {};
  }
  applyUpgrade(up) {
    up.apply(this);
    this.upgrades.push(up.id);
    this.upgradeCounts[up.id] = (this.upgradeCounts[up.id] || 0) + 1;
  }
  reset() {
    this.x = this.startX; this.z = this.startZ; this.y = 0;
    this.vx = 0; this.vz = 0; this.vy = 0;
    this.angle = this.startAngle; this.targetAngle = this.startAngle;
    this.maxHp = this.baseMaxHp + this.hpBonus;
    this.hp = this.maxHp; this.hpDisplay = this.maxHp;
    this.animT = 0;
    this.attackT = 0; this.attackDur = 20; this.attackCd = 0;
    this.cds = this.skills.map(() => 0);
    this.hitStun = 0; this.flash = 0; this.invuln = 0;
    this.dashT = 0; this.hitSet = new Set();
    this.combo = 0; this.comboT = 0;
    this.chainStep = 0; this.chainT = 0;
    this.whirlT = 0; this.whirlTick = 0;
    this.novaT = 0;
    this.walkPhase = 0;
    this.ghosts = [];
    this.dead = false; this.respawnT = 0;
    this.opp = null; this.aiTarget = null;
    this.kills = 0;
    this.model.visible = true;
    this.aimMesh.visible = false;
    this.model.position.set(this.x, 0, this.z);
    this.model.rotation.set(0, this.angle, 0);
  }

  update() {
    if (this.flash > 0) this.flash--;
    if (this.dead) {                       // 阵亡：等待复活
      if (this.respawnT > 0) { this.respawnT--; if (this.respawnT === 0) this.respawn(); }
      return;
    }
    if (this.attackCd > 0) this.attackCd--;
    for (let i = 0; i < this.cds.length; i++) {
      if (this.cds[i] > 0) { this.cds[i]--; if (this.cds[i] === 0) SFX.ready(); }
    }
    if (this.invuln > 0) this.invuln--;
    if (this.chainT > 0) { this.chainT--; if (this.chainT === 0) this.chainStep = 0; }
    if (this.whirlT > 0) this.whirlT--;
    if (this.novaT > 0) this.novaT--;
    if (this.comboT > 0) { this.comboT--; if (this.comboT === 0) this.combo = 0; }
    this.animT++;

    const opp = nearestEnemy(this);        // 就近锁定敌方目标
    this.opp = opp;

    const grounded = this.y <= 0.01;
    const canAct = this.hitStun <= 0 && this.dashT <= 0 && gameState === 'fight' && grounded;
    const inp = this.getInput(opp);

    if (this.hitStun > 0) this.hitStun--;

    let mx = 0, mz = 0;
    if (canAct) {
      if (inp.left) mx -= 1;
      if (inp.right) mx += 1;
      if (inp.up) mz -= 1;
      if (inp.down) mz += 1;
    }
    const mlen = Math.hypot(mx, mz);

    if (this.dashT > 0) {
      if (this.animT % 2 === 0) this.ghosts.push({ x: this.x, z: this.z, angle: this.angle, life: 12 });
      this.dashT--;
      if (this.dashT === 0) { this.invuln = 0; this.vx *= 0.2; this.vz *= 0.2; }
    } else if (canAct) {
      if (this.attackT > 0) { this.vx *= 0.86; this.vz *= 0.86; }
      else if (mlen > 0) {
        const s = this.speed * this.mods.speed;
        this.vx = mx / mlen * s; this.vz = mz / mlen * s;
      } else { this.vx *= 0.55; this.vz *= 0.55; }

      if (this.attackT <= 0) {
        if (mlen > 0) this.targetAngle = Math.atan2(mx, mz);
        else if (opp) { const d = distXZ(this, opp); if (d > 4) this.targetAngle = aimAt(this, opp); }
      }
      if (inp.attack && this.attackCd <= 0 && this.attackT <= 0 && opp) this.doAttack(opp);
      for (let i = 0; i < this.skills.length; i++) {
        if (inp.skills[i] && this.cds[i] <= 0 && this.attackT <= 0 && this.dashT <= 0 && opp) this.castSkill(i, opp);
      }
    } else if (grounded) {
      this.vx *= 0.88; this.vz *= 0.88;
    }

    // 平滑转向
    let da = this.targetAngle - this.angle;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    this.angle += da * 0.35;

    // 近战判定
    if (this.attackT > 0) {
      this.attackT--;
      if (this.type === 'sword' && opp) this.meleeCheck(opp);
    }

    // 烈焰旋风：环绕多段打击（命中范围内所有敌人）
    if (this.whirlT > 0 && gameState === 'fight') {
      if (this.whirlTick > 0) this.whirlTick--;
      else {
        this.whirlTick = 11;
        const rr = 200 * this.mods.range;
        for (const e of enemiesOf(this)) {
          if (e.dead || e.invuln > 0) continue;
          if (distXZ(this, e) < rr && Math.abs(this.y - e.y) < 140) {
            hitTarget(e, this, Math.round(this.dmg * 1.1 * this.mods.power * this.mods.skillPower[1] * this.dmgMul), 12, 'whirl');
            spawnHit(e.x, e.y + 80, e.z, 'whirl');
          }
        }
      }
    }

    // 冲刺伤害判定（沿途命中所有敌人）
    if (this.dashT > 0 && gameState === 'fight') {
      for (const e of enemiesOf(this)) {
        if (e.dead || this.hitSet.has(e)) continue;
        if (distXZ(this, e) < 78 && Math.abs(this.y - e.y) < 130) {
          this.hitSet.add(e);
          hitTarget(e, this, Math.round(22 * this.mods.power * this.mods.skillPower[0] * this.dmgMul), 24, 'dash');
        }
      }
    }

    // 物理
    if (this.y > 0 || this.vy > 0) {
      this.vy -= GRAVITY;
      this.y += this.vy;
      if (this.y <= 0) {
        if (this.vy < -7) { SFX.land(); for (let i = 0; i < 8; i++) spawnSpark(this.x + rand(-20, 20), 6, this.z + rand(-20, 20), rand(-3, 3), rand(1, 3), rand(-3, 3), 18, '#bec8e6', rand(5, 10), 0.3); }
        this.y = 0; this.vy = 0;
      }
    }
    this.x += this.vx; this.z += this.vz;
    this.x = clamp(this.x, -ARENA_HX, ARENA_HX);
    this.z = clamp(this.z, -ARENA_HZ, ARENA_HZ);
    resolveObstacleCollision(this);

    if (this.y <= 0.01 && this.attackT <= 0 && this.dashT <= 0) {
      this.walkPhase += Math.hypot(this.vx, this.vz) * 0.11;
    }
    for (const g of this.ghosts) g.life--;
    this.ghosts = this.ghosts.filter(g => g.life > 0);
  }

  getInput(opp) {
    if (this.netRemote) return netRemoteIntent(this);  // 联机：远端玩家的输入由网络提供
    if (this.ai) return this.ai.think(this, projectiles);
    const c = this.controls;
    if (!c) return { up: false, down: false, left: false, right: false, attack: false, skills: this.skills.map(() => false) };
    return {
      up: !!keys[c.up], down: !!keys[c.down],
      left: !!keys[c.left], right: !!keys[c.right],
      attack: consume(c.attack),
      skills: this.skills.map(s => consume(s.key))
    };
  }

  doAttack(opp) {
    this.chainStep = this.chainT > 0 ? (this.chainStep + 1) % 3 : 0;
    const fin = this.chainStep === 2;
    this.targetAngle = this.angle = aimAt(this, opp);   // 出招时对准对手

    if (this.type === 'sword') {
      this.attackT = this.attackDur = fin ? 30 : 20;
      this.attackCd = this.attackT + 8;
      this.chainT = fin ? 0 : this.attackT + 36;
      this.hitSet.clear();
      netSfx(fin ? 'heavy' : 'slash');
    } else {
      this.attackT = fin ? 22 : 16;
      this.attackCd = fin ? 48 : 34;
      this.chainT = fin ? 0 : this.attackT + 40;
      this.hitSet.clear();
      const ang = this.angle;
      projectiles.push(new Projectile(
        this.x + Math.sin(ang) * 42, this.y + 100, this.z + Math.cos(ang) * 42,
        Math.sin(ang) * (fin ? 17 : 13.5), Math.cos(ang) * (fin ? 17 : 13.5), this, {
          dmg: Math.round(this.dmg * (fin ? 1.8 * this.mods.finisher : 1) * this.mods.atk * this.dmgMul),
          color: fin ? '#ffd0ff' : '#6fc6ff', r: Math.round((fin ? 16 : 11) * this.mods.range), life: 130, type: 'bolt'
        }
      ));
      netSfx('shoot');
    }
  }

  castSkill(i, opp) {
    const sk = this.skills[i];
    if (sk.id === 'dash') {
      this.targetAngle = this.angle = aimAt(this, opp);
      this.dashT = 16; this.invuln = 16;
      this.vx = Math.sin(this.angle) * 22; this.vz = Math.cos(this.angle) * 22;
      this.hitSet.clear(); this.ghosts = [];
      netSfx('dash');
    } else if (sk.id === 'whirl') {
      this.whirlT = 44; this.whirlTick = 0; this.animT = 0;
      netSfx('whirl'); netShake(5);
    } else if (sk.id === 'fire') {
      this.targetAngle = this.angle = aimAt(this, opp);
      this.attackT = 26; this.attackDur = 26; this.hitSet.clear();
      const ang = this.angle;
      projectiles.push(new Projectile(
        this.x + Math.sin(ang) * 44, this.y + 100, this.z + Math.cos(ang) * 44,
        Math.sin(ang) * 10, Math.cos(ang) * 10, this,
        { dmg: Math.round(24 * this.mods.power * this.mods.skillPower[0] * this.dmgMul), color: '#ff9430', r: Math.round(21 * this.mods.range), life: 150, type: 'fire' }
      ));
      netSfx('shoot');
    } else if (sk.id === 'nova') {
      this.novaT = 26;
      this.invuln = Math.max(this.invuln, 10);
      netSfx('nova'); netShake(9);
      const rr = 230 * this.mods.range;
      netRing(this.x, this.z, 20, rr, '#a8f0ff', 26);
      for (const e of enemiesOf(this)) {
        if (e.dead || e.invuln > 0) continue;
        if (distXZ(this, e) < rr) hitTarget(e, this, Math.round(16 * this.mods.power * this.mods.skillPower[1] * this.dmgMul), 22, 'nova', -14);
      }
    }
    this.cds[i] = Math.max(30, Math.round(sk.cd * this.mods.cd * this.mods.skillCd[i]));
  }

  meleeCheck(opp) {
    const fin = this.chainStep === 2;
    const elapsed = this.attackDur - this.attackT;
    const from = fin ? 8 : 5, to = fin ? 20 : 13;
    if (elapsed < from || elapsed > to) return;
    if (this.hitSet.has(opp)) return;
    const reach = (fin ? 175 : 150) * this.mods.range;
    if (distXZ(this, opp) <= reach && Math.abs(this.y - opp.y) < 130) {
      this.hitSet.add(opp);
      if (fin) {
        hitTarget(opp, this, Math.round(this.dmg * 1.6 * this.mods.finisher * this.mods.atk * this.dmgMul), 26, 'dash', -13);
        shake(11);
      } else {
        hitTarget(opp, this, Math.round(this.dmg * this.mods.atk * this.dmgMul), 16, 'melee');
      }
    }
  }

  // 阵亡：隐藏模型、进入复活倒计时
  die(attacker) {
    if (this.dead) return;
    this.dead = true;
    this.respawnT = RESPAWN_TIME;
    this.model.visible = false;
    this.aimMesh.visible = false;
    this.attackT = 0; this.whirlT = 0; this.novaT = 0; this.dashT = 0; this.hitStun = 0;
    this.vx = 0; this.vz = 0; this.vy = 0; this.y = 0;
    if (attacker && attacker.side !== undefined && attacker.side !== this.side) {
      attacker.kills++;
      kills[attacker.side]++;
    }
  }
  // 复活：回到出生点、回满生命、短暂无敌
  respawn() {
    this.dead = false; this.respawnT = 0;
    this.x = this.startX; this.z = this.startZ; this.y = 0;
    this.vx = 0; this.vz = 0; this.vy = 0;
    this.angle = this.startAngle; this.targetAngle = this.startAngle;
    this.hp = this.maxHp; this.hpDisplay = this.maxHp;
    this.invuln = 60;
    this.ghosts = [];
    this.model.visible = true;
    this.model.position.set(this.x, 0, this.z);
    this.model.rotation.set(0, this.angle, 0);
    netRing(this.x, this.z, 6, 120, this.color, 22);
  }

  // 每帧姿态更新（3D 表现）
  pose() {
    const g = this.model, P = this.parts;
    const walking = Math.hypot(this.vx, this.vz) > 0.6 && this.y <= 0.01 && this.attackT <= 0 && this.dashT <= 0;
    const bob = walking ? Math.abs(Math.sin(this.walkPhase)) * 3 : 0;
    g.position.set(this.x, this.y + bob, this.z);
    g.rotation.y = this.angle + (this.whirlT > 0 ? this.animT * 0.5 : 0);
    g.rotation.x = this.dashT > 0 ? 0.28 : 0;

    const swing = walking ? Math.sin(this.walkPhase) * 0.55 : 0;
    if (P.legL) P.legL.rotation.x = swing;
    if (P.legR) P.legR.rotation.x = -swing;

    const p = this.attackT > 0 ? 1 - this.attackT / this.attackDur : 0;
    if (this.type === 'sword') {
      P.armR.rotation.x = this.attackT > 0 ? lerp(0.35, -1.85, easeOut(clamp(p / 0.72, 0, 1))) : (this.whirlT > 0 ? -1.2 : 0.08);
      P.armL.rotation.x = walking ? -swing * 0.6 : (this.whirlT > 0 ? -1.2 : 0.08);
      P.armL.rotation.z = 0.05;
    } else {

      P.armR.rotation.x = casting ? -1.35 : (walking ? -swing * 0.5 : 0.12);
      P.armL.rotation.x = walking ? swing * 0.5 : 0.12;
      if (P.glow) P.glow.position.y = 236 + Math.sin(this.animT * 0.08) * 5;
    }
    if (P.head) P.head.rotation.z = 0;

    // 受击闪白
    const hurt = this.flash > 0 && (this.flash % 4 < 2);
    const e = hurt ? 0.85 : 0;
    for (const m of this.mats) if (m.emissive) m.emissive.setRGB(e, e, e);

    // 残影

    this.updateAim(this.opp);
  }

  drawGhosts() {
    // 残影用精灵快速表现：在残影位置生成一次火花状淡影
    if (this.ghosts.length && this.dashT > 0) {
      const last = this.ghosts[this.ghosts.length - 1];
      if (last && last.life === 12) {
        spawnSpark(last.x, this.y + 90, last.z, 0, 0, 0, 10, this.color, 90, 0);
      }
    }
  }

  updateAim(opp) {
    const m = this.aimMesh, sk = this.skills[0];
    const ready = this.cds[0] <= 0 && gameState === 'fight' && opp && !this.dead;
    m.visible = !!ready;
    if (!m.visible) return;
    const len = this.type === 'sword' ? 340 : 620;
    const wid = this.type === 'sword' ? 70 : 90;
    const ang = aimAt(this, opp);
    m.scale.set(wid, 1, len);
    m.rotation.y = ang;
    m.position.set(this.x + Math.sin(ang) * len / 2, 3, this.z + Math.cos(ang) * len / 2);

}

// ================= 命中处理 =================
function hitTarget(target, attacker, dmg, stun, kind, knockUp) {
  if (target.dead || target.invuln > 0 || gameState !== 'fight') return;
  if (attacker && attacker.combo > 0) {
    const s = COMBO_SCALE[Math.min(attacker.combo, COMBO_SCALE.length - 1)];
    dmg = Math.max(1, Math.round(dmg * s));
  }
  target.hp = Math.max(0, target.hp - dmg);
  target.hitStun = stun;
  const dx = target.x - attacker.x, dz = target.z - attacker.z;
  const L = Math.hypot(dx, dz) || 1;
  const kb = (kind === 'dash' || kind === 'fire' || kind === 'nova' || kind === 'whirl') ? 9 : 5.5;
  target.vx += dx / L * kb; target.vz += dz / L * kb;
  if (knockUp) { target.vy = -knockUp; target.y = Math.max(target.y, 1); }   // knockUp 传入负值 → 向上
  target.attackT = 0; target.whirlT = 0; target.flash = 9;
  if (attacker) { attacker.combo++; attacker.comboT = 100; }

  if (attacker && attacker.mods && attacker.mods.lifesteal > 0 && attacker.hp < attacker.maxHp) {
    const heal = Math.max(1, Math.round(dmg * attacker.mods.lifesteal));
    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
    netFloater({ x: attacker.x, y: attacker.y + 210, z: attacker.z, text: '+' + heal, vy: 1.2, life: 34, color: '#7cffa0' });
  }
  netHit(target.x, target.y + 90, target.z, kind);
  const heavyHit = kind === 'dash' || kind === 'fire' || kind === 'nova' || kind === 'whirl';
  netShake(heavyHit ? 10 : 6);
  netFloater({
    x: target.x + rand(-14, 14), y: target.y + 175, z: target.z,
    text: '-' + dmg, vy: 1.5, life: 42,
    color: kind === 'fire' ? '#ffb03a' : heavyHit ? '#ffd166' : '#ffffff', big: heavyHit
  });
  netSfx(heavyHit ? 'boom' : 'hit');
  if (target.hp <= 0) { target.hp = 0; fighterDown(target, attacker); }
}

// 角色阵亡：在该处直接停止模拟，进入复活倒计时（不再立即结束回合）
function fighterDown(target, attacker) {
  target.die(attacker);
  netShake(15); netSfx('ko');
  netHit(target.x, target.y + 60, target.z, 'nova');
  if (!teamAlive(TEAM_RED) || !teamAlive(TEAM_BLUE)) endRound(teamAlive(TEAM_RED) ? TEAM_RED : TEAM_BLUE);
}

// 回合结算：优先采用团灭方，否则按击杀积分判定
function endRound(forced) {
  if (gameState !== 'fight') return;
  gameState = 'roundover'; stateT = 0;
  if (forced === TEAM_RED || forced === TEAM_BLUE) { roundResult = forced; wins[forced]++; }
  else if (kills[0] === kills[1]) roundResult = -1;
  else { roundResult = kills[0] > kills[1] ? 0 : 1; wins[roundResult]++; }
  netSfx('ko');
}

// 时间耗尽：按击杀积分判定胜负
function timeOut() {

}

// ---- 特效 / 音效事件：主机产生，客户端回放 ----

// ---- 远端输入（主机侧按角色所属客户端取用；边沿信号每次结算后清空） ----
function newPeerEdges(f) { return { attack: false, skills: f.skills.map(() => false) }; }
function netRemoteIntent(f) {
  const peer = f.netPeer;

// ---- 状态序列化 / 反序列化 ----
function fighterState(f) {
  const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
  return [
    r1(f.x), r1(f.y), r1(f.z), r2(f.vx), r2(f.vy), r2(f.vz),
    r2(f.angle), r2(f.targetAngle), f.hp, f.maxHp, f.animT, f.attackT, f.attackDur,

    f.hitStun, f.invuln, f.dashT, f.whirlT, f.novaT,
    f.chainStep, f.chainT, f.combo, f.comboT, f.flash, r2(f.walkPhase),
    f.dead ? 1 : 0, f.respawnT

}
function applyFighterState(f, a) {
  f.x = a[0]; f.y = a[1]; f.z = a[2]; f.vx = a[3]; f.vy = a[4]; f.vz = a[5];
  f.angle = a[6]; f.targetAngle = a[7]; f.hp = a[8]; f.maxHp = a[9];
  f.animT = a[10]; f.attackT = a[11]; f.attackDur = a[12];

  f.hitStun = a[15]; f.invuln = a[16]; f.dashT = a[17]; f.whirlT = a[18]; f.novaT = a[19];
  f.chainStep = a[20]; f.chainT = a[21]; f.combo = a[22]; f.comboT = a[23]; f.flash = a[24];
  f.walkPhase = a[25];
  f.dead = !!a[26]; f.respawnT = a[27] || 0;
  f.model.visible = !f.dead;
  f.model.position.set(f.x, f.y, f.z);

}
function upgradesTotal(o) { let n = 0; for (const k in o) n += o[k]; return n; }

function netSyncProjectiles(list) {
  const seen = new Set();
  for (let i = 0; i < list.length; i++) {
    const a = list[i], id = a[0];
    seen.add(id);
    let pr = net.projMap.get(id);
    if (!pr) {
      pr = new Projectile(a[1], a[2], a[3], 0, 0, null, { dmg: 0, color: a[5], r: a[6], life: 99999, type: a[4] });
      net.projMap.set(id, pr);
      projectiles.push(pr);
    }
    pr.x = a[1]; pr.y = a[2]; pr.z = a[3]; pr.place();
    if ((time & 1) === 0) spawnSpark(a[1], a[2], a[3], rand(-1, 1), rand(-1, 1), rand(-1, 1), 12, a[5], a[6] * 0.5, 0);
  }
  for (const id of Array.from(net.projMap.keys())) {
    if (seen.has(id)) continue;
    const pr = net.projMap.get(id);
    pr.dispose();
    net.projMap.delete(id);
    const idx = projectiles.indexOf(pr);
    if (idx >= 0) projectiles.splice(idx, 1);
  }
}

function netMusicFor(gs) {

function applySnapshot(s) {
  const prevGs = gameState;
  gameState = s.gs; stateT = s.st; round = s.rd;
  wins[0] = s.wi[0]; wins[1] = s.wi[1];
  if (s.kl) { kills[0] = s.kl[0]; kills[1] = s.kl[1]; }
  roundTime = s.rt;
  roundResult = (s.pr === undefined ? null : s.pr);
  paused = !!s.pa;
  for (let i = 0; i < fighters.length; i++) applyFighterState(fighters[i], s.f[i]);
  netSyncProjectiles(s.pj || []);
  if (s.obs) applyObstacleLayout(s.obs.map(a => ({ x: a[0], z: a[1], hx: a[2], hz: a[3], h: a[4] })));
  if (s.uc) {
    teamState[0].upgradeCounts = s.uc[0]; teamState[1].upgradeCounts = s.uc[1];
    teamState[0].upgrades = new Array(upgradesTotal(teamState[0].upgradeCounts));
    teamState[1].upgrades = new Array(upgradesTotal(teamState[1].upgradeCounts));
  }
  if (s.up) {
    upgradePhase = s.up.ph;
    if (upgradePhase !== 1) upgradeSel = s.up.sel;   // 客户端在自己选卡时保留本地高亮
    upgradeChoices[0] = (s.up.c[0] || []).map(id => UPGRADES.find(u => u.id === id)).filter(Boolean);
    upgradeChoices[1] = (s.up.c[1] || []).map(id => UPGRADES.find(u => u.id === id)).filter(Boolean);
  }
  if (s.ev) for (let i = 0; i < s.ev.length; i++) applyNetEvent(s.ev[i]);
  netMusicFor(gameState);
  if (gameState === 'gameover' && prevGs !== 'gameover') { Music.stop(); playVictory(); }
}

// ---- 主机：每帧广播快照 ----
function netHostSend() {
  if (net.role !== 'host' || !net.peers.length) return;
  net.txFrame++;
  if (net.txFrame % 30 === 0) {
    const ts = performance.now();
    for (const p of net.peers) { p.pingSent = ts; net.sendTo(p, { t: 'ping', ts: ts }); }
  }
  const snap = {
    gs: gameState, st: stateT, rd: round, wi: [wins[0], wins[1]], kl: [kills[0], kills[1]], rt: roundTime,
    pr: (roundResult === null ? null : roundResult), pa: paused,
    f: fighters.map(fighterState),
    pj: projectiles.map(p => [p.__id, Math.round(p.x), Math.round(p.y), Math.round(p.z), p.type, p.color, p.r]),
    ev: net.events
  };
  // 障碍布局变更时随快照下发（保持两端一致）
  if (net.sentObstacleVer !== obstacleVer) {
    snap.obs = OBSTACLES.map(o => [Math.round(o.x), Math.round(o.z), Math.round(o.hx), Math.round(o.hz), Math.round(o.h)]);
    net.sentObstacleVer = obstacleVer;
  }
  if (gameState === 'upgrade') {
    snap.up = { ph: upgradePhase, sel: upgradeSel, c: [upgradeChoices[0].map(u => u.id), upgradeChoices[1].map(u => u.id)] };
    snap.uc = [teamState[0].upgradeCounts, teamState[1].upgradeCounts];
  }
  net.events = [];

}

// ---- 客户端：上传输入 + 应用快照 ----
function netGuestStep() {
  time++;

}

// ---- WebRTC 握手 ----
function netNewPC() {
  const pc = new RTCPeerConnection(NET_ICE);
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') netMsg('连接失败，请检查网络后重试'); };
  return pc;
}
function netWaitICE(pc) {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const done = () => { pc.removeEventListener('icegatheringstatechange', h); clearTimeout(to); res(); };
    const h = () => { if (pc.iceGatheringState === 'complete') done(); };
    pc.addEventListener('icegatheringstatechange', h);

}
function netEnc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function netDec(s) { return JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/\s+/g, ''))))); }

function netBindDC(peer, dc) {
  peer.dc = dc;
  dc.onopen = () => { peer.ready = true; netOnPeerConnected(peer); };
  dc.onclose = () => { netDropPeer(peer, net.role === 'guest' ? '与主机的连接已断开' : '有一名玩家已断开，其角色已由 AI 接管'); };

}

function netOnMessage(m, peer) {
  if (m.t === 'i') {                       // 主机：收到某客户端输入
    if (!peer.edges || peer.slot !== m.slot) {
      peer.slot = m.slot;
      peer.fighter = fighters[m.slot];
      peer.edges = newPeerEdges(peer.fighter);
      peer.remoteSeq = -1;
    }
    if (m.seq <= peer.remoteSeq) return;
    peer.remoteSeq = m.seq;
    const d = m.d;
    peer.held.up = !!d.up; peer.held.down = !!d.down; peer.held.left = !!d.left; peer.held.right = !!d.right;
    if (d.attack) peer.edges.attack = true;
    for (let i = 0; i < peer.edges.skills.length; i++) if (d.skills[i]) peer.edges.skills[i] = true;
  } else if (m.t === 's') {                 // 客户端：应用权威快照
    net.latestSnap = m.d;
    if (gameState === 'netlobby') netHide();
  } else if (m.t === 'hello') {             // 客户端：得知自己操控的角色
    net.mySlot = m.slot;
    const f = fighters[m.slot];
    f.ai = null; f.netRemote = false; f.netPeer = null; f.controls = SCHEME_A;
    teamState[1].hasHuman = true; teamState[1].remote = true;
    humans.length = 0; humans.push(f);
    netShowWaiting('已连接（操控：' + f.name + '），等待主机开始…');
  } else if (m.t === 'pick') {
    net.guestPick = m.p;
  } else if (m.t === 'ping') {
    net.sendTo(peer, { t: 'pong', ts: m.ts });
  } else if (m.t === 'pong') {
    peer.rtt = performance.now() - m.ts;
  } else if (m.t === 'bye') {
    if (peer.ready) netDropPeer(peer, net.role === 'guest' ? '主机已关闭房间' : '有一名玩家已离开');
  }
}

// 主机：新客户端接入
function netOnPeerConnected(peer) {
  peer.edges = peer.edges || newPeerEdges(peer.fighter);
  if (net.role === 'host') {
    if (net.peers.indexOf(peer) < 0) net.peers.push(peer);
    net.active = true; net.connected = true;
    const f = peer.fighter;
    f.ai = null; f.netRemote = true; f.netPeer = peer; f.controls = SCHEME_A; f.dmgMul = 1;
    teamState[1].hasHuman = true; teamState[1].remote = true;
    net.sendTo(peer, { t: 'hello', slot: peer.slot });
    net.pendingPeer = null;
    netShowHostRoom();
  } else {
    net.connected = true; net.active = true;
  }
}

// 断线处理：主机移除该客户端并把其角色交还 AI
function netDropPeer(peer, msg) {
  if (peer.dc) { try { peer.dc.close(); } catch (e) { } }
  if (peer.pc) { try { peer.pc.close(); } catch (e) { } }
  if (net.role === 'guest') { netEnd(msg); return; }
  const f = peer.fighter;
  if (f) { f.netRemote = false; f.netPeer = null; f.ai = new EnemyAI('normal'); }
  net.peers = net.peers.filter(p => p !== peer);
  if (net.pendingPeer === peer) net.pendingPeer = null;
  const still = net.peers.length > 0;
  teamState[1].hasHuman = still; teamState[1].remote = still;
  if (gameState === 'netlobby') netShowHostRoom();
  else netMsg(msg);
}

// 主机：开始对战（分配真人 / AI 角色）
function startNetMatch() {
  net.active = true;

  humans.length = 0;
  teamState[0].hasHuman = false; teamState[0].remote = false;
  teamState[1].hasHuman = false; teamState[1].remote = false;
  const host = redTeam[0]; host.ai = null; host.controls = SCHEME_A; humans.push(host); teamState[0].hasHuman = true;
  for (const peer of net.peers) {
    const f = fighters[peer.slot];
    f.ai = null; f.netRemote = true; f.netPeer = peer; f.controls = SCHEME_A; f.dmgMul = 1;
    teamState[1].hasHuman = true; teamState[1].remote = true;
    net.sendTo(peer, { t: 'hello', slot: peer.slot });
  }
  for (const f of fighters) if (!f.netRemote && humans.indexOf(f) < 0) f.ai = new EnemyAI('normal');
  for (const f of fighters) f.resetMods();
  teamState[0].upgradeCounts = {}; teamState[1].upgradeCounts = {};
  teamState[0].upgrades = []; teamState[1].upgrades = [];
  wins = [0, 0]; kills = [0, 0]; round = 1;
  net.events = []; net.guestPick = -1; net.inputSeq = 0; net.sentObstacleVer = -1;
  for (const pr of net.projMap.values()) pr.dispose();
  net.projMap = new Map();
  regenerateObstacles();               // 主机生成，随后随快照同步给客户端
  netHide();
  Music.duck = 1; Music.play('battle'); Music.apply(0.3);
  startRound();
}

async function netStartHost() {
  net.role = 'host';
  net.peers = []; net.pendingPeer = null; net.active = false; net.connected = false;
  for (const f of fighters) { f.ai = new EnemyAI('normal'); f.netRemote = false; f.netPeer = null; f.controls = null; f.dmgMul = 1; }
  humans.length = 0;
  teamState[0].hasHuman = true; teamState[0].remote = false;
  teamState[1].hasHuman = false; teamState[1].remote = false;
  const host = redTeam[0]; host.ai = null; host.controls = SCHEME_A; humans.push(host);
  netShowHostRoom();
}
async function netAddHostPeer() {
  if (net.peers.length >= MAX_CLIENTS) return netMsg('已达到最大真人数量（4 人）');
  const slot = CLIENT_SLOTS[net.peers.length];
  const peer = newPeer(slot);
  peer.edges = newPeerEdges(peer.fighter);
  peer.pc = netNewPC();
  netBindDC(peer, peer.pc.createDataChannel('game', { ordered: true }));
  const offer = await peer.pc.createOffer();
  await peer.pc.setLocalDescription(offer);
  await netWaitICE(peer.pc);
  net.pendingPeer = peer;
  netShowHostRoom(netEnc(peer.pc.localDescription), net.peers.length + 1);
}
async function netHostAccept(code) {
  const peer = net.pendingPeer;
  if (!peer) return;
  await peer.pc.setRemoteDescription(netDec(code));
  netShowWaiting('正在与玩家 ' + (net.peers.length + 1) + ' 建立连接…');
}
async function netJoin(code) {
  net.role = 'guest';
  net.peers = []; net.mySlot = -1;
  const peer = newPeer(-1);
  peer.pc = netNewPC();
  peer.pc.ondatachannel = e => netBindDC(peer, e.channel);
  net.peers.push(peer);
  await peer.pc.setRemoteDescription(netDec(code));
  const ans = await peer.pc.createAnswer();
  await peer.pc.setLocalDescription(ans);
  netShowWaiting('正在生成应答码…');
  await netWaitICE(peer.pc);
  netShowGuestAnswer(netEnc(peer.pc.localDescription));
}

function netTeardown() {
  for (const p of net.peers) { net.sendTo(p, { t: 'bye' }); if (p.dc) { try { p.dc.close(); } catch (e) { } } if (p.pc) { try { p.pc.close(); } catch (e) { } } }
  if (net.pendingPeer && net.pendingPeer.pc) { try { net.pendingPeer.pc.close(); } catch (e) { } }
  for (const pr of net.projMap.values()) {
    pr.dispose();
    const i = projectiles.indexOf(pr);
    if (i >= 0) projectiles.splice(i, 1);
  }
  net.projMap = new Map();
  net.peers = []; net.pendingPeer = null;
  net.active = false; net.connected = false; net.role = null;
  net.latestSnap = null; net.mySlot = -1;
  netHide();
}

// ================= 状态与流程 =================
let gameState = 'menu';
let stateT = 0, time = 0;
let wins = [0, 0], round = 1, roundTime = 75 * 60;
let roundResult = null;
let paused = false;
let upgradePhase = 0, upgradeSel = 0, upgradeChoices = [[], []];
const TOTAL_ROUND_TIME = 75 * 60;

const MENU = [
  { id: 'pvp',    label: '双人对战',   desc: '5v5 · 两名玩家同屏，各带 5 人' },
  { id: 'p2p',    label: '联机对战',   desc: '5v5 · P2P 直连（最多 4 名真人）' },
  { id: 'easy',   label: '人机 · 简单', desc: '5v5 · 电脑反应慢、会失误' },
  { id: 'normal', label: '人机 · 普通', desc: '5v5 · 电脑会走位与闪避' },
  { id: 'hard',   label: '人机 · 困难', desc: '5v5 · 电脑反应快、抓破绽' }
];
let menuIndex = 0;
let currentMode = 0;
let aiLevel = null;

// ---- 同屏真人控制方案 ----
const SCHEME_A = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', attack: 'KeyF' };                       // 红方主控
const SCHEME_B = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', attack: 'KeyK' };   // 蓝方副控

// ---- 队伍状态（技能强化按队共享） ----
const teamState = [
  { hasHuman: false, remote: false, upgradeCounts: {}, upgrades: [] },
  { hasHuman: false, remote: false, upgradeCounts: {}, upgrades: [] }
];
const humans = [];                 // 本机操控的角色
let kills = [0, 0];                // 每队本回合击杀数

// ---- 英雄名册：红蓝各 5 名，近战/远程交替 ----
const ROSTER = [
  [ // 红方（TEAM_RED）
    { name: '烈焰剑客', color: '#ff5a5f', color2: '#a81f38', type: 'sword' },
    { name: '赤炎刀锋', color: '#ff7a3d', color2: '#a83c12', type: 'sword' },
    { name: '绯红术士', color: '#ff6b8a', color2: '#9e2445', type: 'mage' },
    { name: '血月刺客', color: '#e0455f', color2: '#7c1230', type: 'sword' },
    { name: '烈焰法师', color: '#ff8f5a', color2: '#a04a1c', type: 'mage' }
  ],
  [ // 蓝方（TEAM_BLUE）
    { name: '秘法星灵', color: '#4fa8ff', color2: '#1b4f9e', type: 'mage' },
    { name: '苍穹剑士', color: '#5b8cff', color2: '#1e3a8e', type: 'sword' },
    { name: '寒霜法师', color: '#57d4ff', color2: '#146a9e', type: 'mage' },
    { name: '碧海刀客', color: '#4fc3c8', color2: '#146a72', type: 'sword' },
    { name: '紫电术士', color: '#8f7bff', color2: '#3a2598', type: 'mage' }
  ]
];

// ---- 实例化 10 名英雄并编入红蓝两队 ----
const fighters = [];
const redTeam = [];
const blueTeam = [];
for (let side = 0; side < 2; side++) {
  const team = side === TEAM_RED ? redTeam : blueTeam;
  for (let i = 0; i < TEAM_SIZE; i++) {
    const h = ROSTER[side][i];
    const f = new Fighter({
      name: h.name, color: h.color, color2: h.color2, type: h.type,
      maxHp: h.type === 'sword' ? 220 : 200,
      speed: h.type === 'sword' ? 5.9 : 4.7,
      side: side, slot: i,
      startX: side === TEAM_RED ? -SPAWN_X : SPAWN_X,
      startZ: SLOT_Z[i],
      startAngle: side === TEAM_RED ? Math.PI / 2 : -Math.PI / 2,
      controls: null
    });
    fighters.push(f);
    team.push(f);
  }
}

function startRound() {
  for (const f of fighters) { f.reset(); if (f.ai) f.ai.reset(); }
  for (const pr of projectiles) pr.dispose();
  projectiles = []; floaters = [];
  roundTime = TOTAL_ROUND_TIME;
  roundResult = null;
  kills = [0, 0];
  gameState = 'countdown'; stateT = 0; paused = false;
}
function startMatch(modeIdx) {
  if (modeIdx === undefined) modeIdx = currentMode;
  currentMode = modeIdx;
  const modeId = MENU[modeIdx].id;
  aiLevel = (modeId === 'pvp' || modeId === 'p2p') ? null : modeId;
  net.active = false;

  humans.length = 0;
  for (const f of fighters) { f.ai = null; f.netRemote = false; f.netPeer = null; f.controls = null; f.dmgMul = 1; }
  teamState[0].hasHuman = false; teamState[1].hasHuman = false;
  teamState[0].remote = false; teamState[1].remote = false;

  // 红方 0 号始终由本机操控
  const h1 = redTeam[0]; h1.controls = SCHEME_A; humans.push(h1); teamState[0].hasHuman = true;
  // 同屏双人：蓝方 0 号由本机第二位玩家操控
  if (modeId === 'pvp') {
    const h2 = blueTeam[0]; h2.controls = SCHEME_B; humans.push(h2); teamState[1].hasHuman = true;
  }
  const aiLv = aiLevel || 'normal';
  for (const f of fighters) if (humans.indexOf(f) < 0) f.ai = new EnemyAI(aiLv);
  for (const f of fighters) { f.dmgMul = aiLevel ? DIFFS[aiLv].dmg : 1; f.resetMods(); }
  for (const f of humans) f.dmgMul = 1;      // 真人角色不受难度加成影响

  teamState[0].upgradeCounts = {}; teamState[1].upgradeCounts = {};
  teamState[0].upgrades = []; teamState[1].upgrades = [];
  wins = [0, 0]; kills = [0, 0]; round = 1;
  regenerateObstacles();
  Music.duck = 1; Music.play('battle'); Music.apply(0.3);
  startRound();
}
function beginUpgrade() {
  gameState = 'upgrade'; stateT = 0; upgradePhase = 0; upgradeSel = 0;
  upgradeChoices = [rollTeamUpgrades(teamState[0]), rollTeamUpgrades(teamState[1])];
}
function commitUpgrade() {
  const ts = teamState[upgradePhase];
  const card = upgradeChoices[upgradePhase][upgradeSel];
  if (!card) return;
  ts.upgradeCounts[card.id] = (ts.upgradeCounts[card.id] || 0) + 1;
  ts.upgrades.push(card.id);
  const team = upgradePhase === 0 ? redTeam : blueTeam;
  for (const f of team) card.apply(f);     // 全队共享强化
  SFX.ready();
  upgradePhase++; upgradeSel = 0; stateT = 0;
  if (upgradePhase >= 2) { round++; startRound(); }
}

// 障碍物碰撞：沿最小穿透轴把角色推出方块（含角色半径）
function resolveObstacleCollision(f) {
  for (const o of OBSTACLES) {
    if (f.y >= o.h) continue;                       // 已越过方块顶部
    const dx = f.x - o.x, dz = f.z - o.z;
    const ox = o.hx + f.radius, oz = o.hz + f.radius;
    if (Math.abs(dx) >= ox || Math.abs(dz) >= oz) continue;
    const penX = ox - Math.abs(dx), penZ = oz - Math.abs(dz);
    if (penX < penZ) f.x = o.x + (dx < 0 ? -1 : 1) * ox;
    else             f.z = o.z + (dz < 0 ? -1 : 1) * oz;
  }
}

// 身体碰撞：N 体在水平面相互分离
function resolveBodyCollision() {
  for (let i = 0; i < fighters.length; i++) {
    const a = fighters[i];
    if (a.dead) continue;
    for (let j = i + 1; j < fighters.length; j++) {
      const b = fighters[j];
      if (b.dead) continue;
      if (Math.abs(a.y - b.y) > 130) continue;
      const dx = b.x - a.x, dz = b.z - a.z;
      const d = Math.hypot(dx, dz);
      const minD = a.radius + b.radius;
      if (d >= minD || d < 0.001) continue;
      const push = (minD - d) / 2, ux = dx / d, uz = dz / d;
      a.x -= ux * push; a.z -= uz * push;
      b.x += ux * push; b.z += uz * push;
    }
  }
  for (const f of fighters) {
    if (f.dead) continue;
    f.x = clamp(f.x, -ARENA_HX, ARENA_HX); f.z = clamp(f.z, -ARENA_HZ, ARENA_HZ);
    resolveObstacleCollision(f);
  }
}

function updateProjectiles() {
  for (const pr of projectiles) {
    if (pr.dead) continue;
    pr.update();
    // 障碍物拦截：撞到方块则销毁弹道
    if (!pr.dead) {
      for (const o of OBSTACLES) {
        if (pr.y > o.h) continue;
        if (Math.abs(pr.x - o.x) < o.hx + pr.r && Math.abs(pr.z - o.z) < o.hz + pr.r) {
          pr.dead = true;
          spawnHit(pr.x, pr.y, pr.z, pr.type === 'fire' ? 'fire' : 'bolt');
          break;
        }
      }
      if (pr.dead) continue;
    }
    if (gameState === 'fight' && !pr.dead && pr.owner) {
      for (const target of enemiesOf(pr.owner)) {
        if (target.dead || target.invuln > 0) continue;
        const pd = Math.hypot(pr.x - target.x, pr.z - target.z);
        if (pd < pr.r + target.radius && Math.abs(pr.y - (target.y + 80)) < 110) {
          pr.dead = true;
          hitTarget(target, pr.owner, pr.dmg, pr.type === 'fire' ? 16 : 7, pr.type === 'fire' ? 'fire' : 'bolt');
          break;
        }
      }
    }
  }
  for (const pr of projectiles) if (pr.dead) pr.dispose();
  projectiles = projectiles.filter(p => !p.dead);
}

function simulate() {
  time++;
  if (shakeT > 0) shakeT--;
  if (consume('KeyM')) { muted = !muted; Music.apply(0.15); }

  if (gameState === 'menu') {
    Music.play('menu');
    const before = menuIndex;
    if (consume('KeyW') || consume('ArrowUp')) menuIndex = (menuIndex + MENU.length - 1) % MENU.length;
    if (consume('KeyS') || consume('ArrowDown')) menuIndex = (menuIndex + 1) % MENU.length;
    for (let i = 0; i < MENU.length; i++) if (consume('Digit' + (i + 1)) || consume('Numpad' + (i + 1))) menuIndex = i;
    if (menuIndex !== before) SFX.nav();
    if (consume('Enter') || consume('Space')) {
      if (MENU[menuIndex].id === 'p2p') openNetLobby();
      else startMatch(menuIndex);
      SFX.go();
    }
    clearPressed(); return;
  }
  if (gameState === 'netlobby') { clearPressed(); return; }
  if (gameState === 'gameover') {
    updateFloaters();
    if (consume('Enter') || consume('Space')) {
      if (net.active || net.connected) netTeardown();
      gameState = 'menu'; stateT = 0;
      menuIndex = currentMode < MENU.length ? currentMode : 0;
    }
    clearPressed(); return;
  }
  if (gameState === 'upgrade') {
    stateT++;
    const ts = teamState[upgradePhase];
    const cards = upgradeChoices[upgradePhase];
    if (upgradePhase === 1 && ts.remote) {
      // 联机：等待蓝方客户端选卡（15 秒无响应则兜底选择第一张）
      if (net.guestPick >= 0) {
        upgradeSel = clamp(net.guestPick | 0, 0, cards.length - 1);
        net.guestPick = -1;
        commitUpgrade();
      } else if (stateT >= 900) { upgradeSel = 0; commitUpgrade(); }
    } else if (!ts.hasHuman) {
      // 全 AI 一方：随机挑选一张
      if (stateT >= 50) { upgradeSel = Math.floor(Math.random() * cards.length); commitUpgrade(); }
    } else {
      const prev = consume(upgradePhase === 0 ? 'KeyA' : 'ArrowLeft');
      const next = consume(upgradePhase === 0 ? 'KeyD' : 'ArrowRight');
      const ok = upgradePhase === 0 ? (consume('KeyF') || consume('Enter')) : (consume('KeyK') || consume('Space'));
      if (prev) { upgradeSel = (upgradeSel + cards.length - 1) % cards.length; SFX.nav(); }
      if (next) { upgradeSel = (upgradeSel + 1) % cards.length; SFX.nav(); }
      if (ok) commitUpgrade();
    }
    clearPressed(); return;
  }
  if (!net.active && consume('KeyR')) { startMatch(); clearPressed(); return; }
  if (consume('KeyP')) { paused = !paused; Music.duck = paused ? 0.3 : 1; Music.apply(0.25); }
  if (paused) { clearPressed(); return; }

  if (gameState === 'countdown') {
    stateT++;
    if (stateT % 45 === 0 && stateT < 135) netSfx('count');
    if (stateT === 135) netSfx('go');
    for (const f of fighters) { f.animT++; f.pose(); }
    updateFloaters(); updateSparks(); updateRings();
    if (stateT >= 160) { gameState = 'fight'; stateT = 0; }
    clearPressed(); return;
  }
  if (gameState === 'fight') {
    roundTime--;
    for (const f of fighters) f.update();
    resolveBodyCollision();
    updateProjectiles();
    updateFloaters();
    for (const f of fighters) f.pose();
    updateSparks(); updateRings();
    if (roundTime <= 0) timeOut();
    clearPressed(); return;
  }
  if (gameState === 'roundover') {
    stateT++;
    for (const f of fighters) f.update();
    resolveBodyCollision();
    updateProjectiles();
    updateFloaters();
    for (const f of fighters) f.pose();
    updateSparks(); updateRings();
    if (stateT >= 150) {
      if (wins[0] >= 2 || wins[1] >= 2) {
        gameState = 'gameover'; stateT = 0;
        Music.stop(); playVictory();
      } else beginUpgrade();
    }
    clearPressed(); return;
  }
  clearPressed();
}

// 固定步长分发：客户端只上传输入并渲染主机快照，主机负责全部模拟
function fixedUpdate() {
  if (net.active && net.role === 'guest') { netGuestStep(); return; }
  simulate();
  if (net.active && net.role === 'host') netHostSend();
}

// ================= 相机跟随 =================
// 镜头始终以本机操控的英雄为中心（humans[0] 即本地操控的角色）；
// 该英雄阵亡时，平滑过渡到存活队友的重心，避免镜头停在空处。
const _mid = new THREE.Vector3();
function updateCamera() {
  const focus = humans[0] || null;
  let fx, fz;
  if (focus && !focus.dead) {
    fx = focus.x; fz = focus.z;
  } else {
    const team = focus ? alliesOf(focus) : fighters;
    const alive = team.filter(f => !f.dead);
    if (alive.length) {
      let ax = 0, az = 0;
      for (const f of alive) { ax += f.x; az += f.z; }
      fx = ax / alive.length; fz = az / alive.length;
    } else if (focus) { fx = focus.x; fz = focus.z; }
    else { fx = 0; fz = 0; }
  }
  const D = 1000;
  let tx = fx, tz = fz + D * 0.62, ty = D * 0.80;
  if (shakeT > 0) { const k = shakeMag * (shakeT / 14); tx += rand(-1, 1) * k * 4; ty += rand(-1, 1) * k * 4; tz += rand(-1, 1) * k * 4; }
  camera.position.lerp(_mid.set(tx, ty, tz), 0.12);
  camera.lookAt(fx, 30, fz);
}

// 本地真人技能栏
function drawSkillBar(f, align) {
  if (!f) return;
  const iw = 52, ih = 54, gap = 10, n = f.skills.length;

  for (let i = 0; i < n; i++) {
    const sk = f.skills[i];
    const ix = x0 + i * (iw + gap);

    const ratio = clamp(cd / sk.cd, 0, 1);
    const ready = cd <= 0 && !f.dead;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ix, iy, iw, ih, 8); ctx.fill();
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';

      ctx.fillStyle = 'rgba(10,14,30,0.7)';

}

function wrapText(text, maxW) {
  const tokens = text.match(/[A-Za-z0-9%.+\-]+|./g) || [];
  const lines = [];
  let cur = '';
  for (const tk of tokens) {
    const test = cur + tk;
    if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = tk; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

    if (sel) { ctx.translate(mid, cy + ch / 2); ctx.scale(1.05, 1.05); ctx.translate(-mid, -(cy + ch / 2)); }
    const bgGrad = ctx.createLinearGradient(0, cy, 0, cy + ch);
    bgGrad.addColorStop(0, sel ? 'rgba(38,44,78,0.98)' : 'rgba(20,24,46,0.96)');
    bgGrad.addColorStop(1, 'rgba(12,15,30,0.98)');
    ctx.fillStyle = bgGrad;
    roundRect(cx, cy, cw, ch, 16); ctx.fill();
    if (sel) {
      ctx.save();
      ctx.shadowColor = st.color; ctx.shadowBlur = 34;
      ctx.strokeStyle = st.color; ctx.lineWidth = 3;
      roundRect(cx, cy, cw, ch, 16); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = 'rgba(120,150,220,0.35)'; ctx.lineWidth = 2;
      roundRect(cx, cy, cw, ch, 16); ctx.stroke();
    }
    ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = st.color;
    ctx.fillText('★ ' + st.label, mid, cy + 36);
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#f2f6ff';
    ctx.fillText(card.name, mid, cy + 94);
    ctx.strokeStyle = 'rgba(140,170,240,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx + 28, cy + 124); ctx.lineTo(cx + cw - 28, cy + 124); ctx.stroke();
    ctx.font = '21px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(214,226,255,0.92)';
    const text = typeof card.desc === 'function' ? card.desc(chooser) : card.desc;
    let ly = cy + 168;
    for (const ln of wrapText(text, cw - 56)) { ctx.fillText(ln, mid, ly); ly += 32; }
    const got = ts.upgradeCounts[card.id] || 0;
    if (got > 0) {
      ctx.font = 'bold 15px "PingFang SC",sans-serif';
      ctx.fillStyle = 'rgba(255,209,102,0.85)';
      ctx.fillText('已强化 ×' + got, mid, cy + ch - 32);
    }
    ctx.restore();
  }
  ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = redTeam[0].color;
  ctx.fillText('红方　已强化 ' + teamState[0].upgrades.length + ' 项', 60, H - 40);
  ctx.textAlign = 'right';
  ctx.fillStyle = blueTeam[0].color;
  ctx.fillText('蓝方　已强化 ' + teamState[1].upgrades.length + ' 项', W - 60, H - 40);
  ctx.textBaseline = 'alphabetic';
}

      ctx.strokeStyle = 'rgba(255,209,102,0.85)'; ctx.lineWidth = 2;
      roundRect(W / 2 - 280, y - 21, 560, 42, 10); ctx.stroke();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(W / 2 - 266, y - 9); ctx.lineTo(W / 2 - 254, y); ctx.lineTo(W / 2 - 266, y + 9);
      ctx.closePath(); ctx.fill();
    }
    ctx.textAlign = 'left';
    ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = sel ? '#ffd166' : 'rgba(200,215,245,0.72)';
    ctx.fillText(o.label, W / 2 - 244, y);
    ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = sel ? 'rgba(235,242,255,0.9)' : 'rgba(150,170,210,0.55)';
    ctx.fillText(o.desc, W / 2 + 34, y + 1);
  });

  ctx.textAlign = 'center';
  ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(160,180,220,0.7)';
  ctx.fillText('W / S 或 ↑ / ↓ 切换模式    ·    数字键 1-5 直选    ·    M 静音', W / 2, 638);

  const a = 0.5 + 0.5 * Math.sin(time * 0.08);
  ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,' + (0.45 + a * 0.55) + ')';
  ctx.fillText('按  Enter  开始对战', W / 2, 682);

}

function drawGameOver() {

function drawPaused() {
