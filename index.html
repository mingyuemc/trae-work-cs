<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>王者对决 · 2D 双人对战</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#05060c;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  #stage{width:1280px;height:720px;flex:0 0 auto;position:relative;transform-origin:center center;
    box-shadow:0 0 80px rgba(90,140,255,.28), 0 0 0 1px rgba(120,160,255,.15);
    border-radius:10px;overflow:hidden;background:#05060c;}
  canvas{display:block;width:1280px;height:720px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="game" width="1280" height="720"></canvas></div></div>
<script>
(() => {
'use strict';

// ================= 基础 =================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const W = 1280, H = 720;
const GROUND = 620;
const GRAVITY = 0.9;
const WALL_L = 120, WALL_R = W - 120;
const TAU = Math.PI * 2;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const sign = v => v < 0 ? -1 : 1;
const randInt = (a, b) => Math.floor(rand(a, b + 1));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRect(cx, cy, r, b) {
  const nx = clamp(cx, b.x, b.x + b.w);
  const ny = clamp(cy, b.y, b.y + b.h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ================= 自适应缩放 =================
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit);
fit();

// ================= 输入 =================
const keys = Object.create(null);
const pressed = Object.create(null);
const BLOCK = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  initAudio();
}, { passive: false });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function consume(code) { if (pressed[code]) { pressed[code] = false; return true; } return false; }
function clearPressed() { for (const k in pressed) delete pressed[k]; }

// ================= 音频引擎（WebAudio 实时合成，无需外部音频文件） =================
let actx = null, muted = false;
let masterGain = null, sfxGain = null, musicGain = null, noiseBuf = null;

const N = m => 440 * Math.pow(2, (m - 69) / 12);   // MIDI 音高 → 频率

function initAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      // 总线：音效 + 音乐 → 总输出
      masterGain = actx.createGain(); masterGain.gain.value = 1; masterGain.connect(actx.destination);
      sfxGain = actx.createGain(); sfxGain.gain.value = 0.85; sfxGain.connect(masterGain);
      musicGain = actx.createGain(); musicGain.gain.value = 0; musicGain.connect(masterGain);
      // 噪声缓冲：供鼓组与打击音使用
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.5), actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
  if (actx) {
    if (Music.pending) { const n = Music.pending; Music.pending = null; Music.play(n); }
    Music.apply();
  }
}

// ---- 音效 ----
function tone(freq, dur, type, vol, slideTo) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseHit(dur, vol, hp, t, dest) {
  if (!actx || muted || !noiseBuf) return;
  const at = t === undefined ? actx.currentTime : t;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxGain);
  s.start(at); s.stop(at + dur + 0.02);
}

const SFX = {
  hit()   { tone(230, 0.12, 'square', 0.09, 90); noiseHit(0.06, 0.05, 1800); },
  slash() { tone(760, 0.08, 'sawtooth', 0.05, 300); noiseHit(0.05, 0.03, 2400); },
  shoot() { tone(560, 0.13, 'triangle', 0.06, 190); },
  dash()  { tone(300, 0.2, 'sawtooth', 0.07, 950); noiseHit(0.16, 0.035, 900); },
  jump()  { tone(430, 0.1, 'sine', 0.05, 720); },
  land()  { tone(140, 0.14, 'sine', 0.07, 60); noiseHit(0.08, 0.04, 700); },
  boom()  { tone(130, 0.3, 'sawtooth', 0.11, 45); noiseHit(0.22, 0.07, 500); },
  ko()    { tone(170, 0.5, 'sawtooth', 0.1, 55); noiseHit(0.3, 0.06, 400); },
  heavy() { tone(180, 0.22, 'sawtooth', 0.11, 70); tone(560, 0.1, 'square', 0.05, 200); noiseHit(0.16, 0.07, 1100); },
  whirl() { tone(340, 0.42, 'sawtooth', 0.08, 880); noiseHit(0.38, 0.05, 1600); },
  nova()  { tone(1250, 0.34, 'sine', 0.09, 320); tone(760, 0.3, 'triangle', 0.06, 1600); noiseHit(0.28, 0.05, 2600); },
  ready() { tone(1180, 0.08, 'sine', 0.045, 1500); },
  nav()   { tone(600, 0.06, 'square', 0.05); },
  count() { tone(680, 0.12, 'sine', 0.07); },
  go()    { tone(880, 0.28, 'sine', 0.09, 1250); }
};

// ---- 背景音乐：实时合成的循环乐段 ----
// 单音（可指定音色、音量、起音时间与输出总线）
function blip(midi, t, dur, type, vol, dest, attack) {
  if (!actx || muted || !dest) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(N(midi), t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (attack || 0.012));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.04);
}
// 铺底和弦：两个轻微失谐的锯齿波过低通，声音更厚
function pad(midi, t, dur, vol, dest) {
  if (!actx || muted || !dest) return;
  const o = actx.createOscillator(), o2 = actx.createOscillator();
  const f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'sawtooth'; o2.type = 'sawtooth';
  o.frequency.setValueAtTime(N(midi), t);
  o2.frequency.setValueAtTime(N(midi) * 1.006, t);
  f.type = 'lowpass'; f.frequency.value = 950; f.Q.value = 0.6;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.55);
  g.gain.setValueAtTime(vol, t + dur * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(dest);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function kick(t, dest) {
  if (!actx || muted || !dest) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(155, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.24);
}
const snare = (t, dest) => noiseHit(0.13, 0.22, 1500, t, dest);
const hat   = (t, dest) => noiseHit(0.035, 0.08, 7000, t, dest);

// 和声进行：Am - F - C - G，每小节八个八分音符
const ROOTS = [45, 41, 48, 43];
const TRIAD = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];
// 主旋律（A 小调五声音阶），后半段进入
const LEAD = { 16: [76, 3], 19: [74, 1], 20: [72, 2], 24: [69, 4], 29: [72, 1], 30: [74, 2], 31: [76, 1] };

const TRACKS = {
  // 主菜单：同一主题的舒缓编曲，无鼓组
  menu: {
    bpm: 74, len: 32, vol: 0.55,
    play(step, t, sd, dest) {
      const bar = (step / 8) | 0, s = step % 8, root = ROOTS[bar], triad = TRIAD[bar];
      if (s === 0) {
        blip(root - 12, t, sd * 7.5, 'triangle', 0.16, dest, 0.4);
        for (const m of triad) pad(m, t, sd * 7.6, 0.05, dest);
      }
      if (s % 2 === 0) blip(triad[(s / 2) % 3] + 12, t, sd * 1.3, 'triangle', 0.05, dest, 0.05);
    }
  },
  // 对战：推进感强，含鼓组、琶音与旋律
  battle: {
    bpm: 138, len: 32, vol: 0.5,
    play(step, t, sd, dest) {
      const bar = (step / 8) | 0, s = step % 8, root = ROOTS[bar], triad = TRIAD[bar];
      if (s === 0 || s === 3 || s === 4) blip(root - 12, t, sd * 1.5, 'square', 0.13, dest, 0.01);
      if (s === 6) blip(root, t, sd * 1.2, 'square', 0.1, dest, 0.01);
      if (s === 7) blip(root - 5, t, sd * 0.9, 'square', 0.09, dest, 0.01);
      if (s === 0 || s === 4) kick(t, dest);
      if (s === 2 || s === 6) snare(t, dest);
      if (s % 2 === 1) hat(t, dest);
      blip(triad[s % 3] + 12, t, sd * 0.85, 'triangle', 0.045, dest, 0.01);
      const ld = LEAD[step];
      if (ld) blip(ld[0], t, sd * ld[1], 'square', 0.075, dest, 0.01);
    }
  }
};

// 调度器：提前一小段时间排布音符，避免 setInterval 抖动导致节奏不稳
const Music = {
  track: null, pending: null, voice: null, step: 0, nextTime: 0, timer: null, duck: 1,

  play(name) {
    if (!actx) { this.pending = name; return; }
    if (this.track === name && this.voice) return;
    const now = actx.currentTime;
    if (this.voice) this.fadeVoice(this.voice, 0, now + 0.45);
    this.track = name; this.step = 0; this.nextTime = now + 0.08;
    const v = actx.createGain();
    v.gain.setValueAtTime(0, now);
    v.gain.linearRampToValueAtTime(TRACKS[name].vol, now + 0.9);   // 淡入
    v.connect(musicGain);
    this.voice = v;
    this.apply(0.5);
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },

  stop() {
    this.pending = null;
    if (actx && this.voice) this.fadeVoice(this.voice, 0, actx.currentTime + 0.4);
    this.voice = null; this.track = null;
    this.apply(0.4);
  },

  fadeVoice(v, to, endTime) {
    const g = v.gain, now = actx.currentTime;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(now);
    else { g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); }
    g.linearRampToValueAtTime(to, endTime);
    setTimeout(() => { try { v.disconnect(); } catch (e) { } }, (endTime - now + 0.25) * 1000);
  },

  // 静音 / 暂停时压低音乐
  apply(fade) {
    if (!actx || !musicGain) return;
    const now = actx.currentTime, g = musicGain.gain;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(now);
    else { g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); }
    g.linearRampToValueAtTime(muted ? 0 : this.duck, now + (fade === undefined ? 0.6 : fade));
  },

  tick() {
    if (!actx || !this.track || !this.voice) return;
    if (muted) { this.nextTime = actx.currentTime + 0.1; return; }
    const tr = TRACKS[this.track];
    const sd = 60 / tr.bpm / 2;
    if (this.nextTime < actx.currentTime) this.nextTime = actx.currentTime + 0.02;
    while (this.nextTime < actx.currentTime + 0.14) {
      tr.play(this.step, this.nextTime, sd, this.voice);
      this.step = (this.step + 1) % tr.len;
      this.nextTime += sd;
    }
  }
};

// 胜利号角（一次性，走音效总线，因此停止音乐后依然可发声）
function playVictory() {
  if (!actx || muted) return;
  const t0 = actx.currentTime + 0.08, D = sfxGain;
  [[69, 0, .18], [72, .18, .18], [76, .36, .18], [81, .56, .75]]
    .forEach(([m, dt, d]) => blip(m, t0 + dt, d, 'square', 0.14, D, 0.01));
  [57, 60, 64, 69].forEach(m => blip(m, t0 + .56, 1.1, 'triangle', 0.085, D, 0.02));
  noiseHit(0.4, 0.05, 3000, t0 + .56, D);
}

Music.play('menu');   // 首次按键后（音频解锁）自动开始播放

// ================= 特效容器 =================
let particles = [], floaters = [], projectiles = [];
let shakeT = 0, shakeMag = 0;
function shake(m) { shakeMag = Math.max(shakeMag, m); shakeT = 14; }

function spawnHit(x, y, kind) {
  const n = kind === 'fire' ? 30 : kind === 'nova' || kind === 'whirl' ? 22 : 16;
  const cols = kind === 'fire' ? ['#ffb03a', '#ff6a00', '#ffe08a', '#ff3d00']
    : kind === 'dash' ? ['#ffd166', '#fff2b0', '#ff9a3c']
    : kind === 'whirl' ? ['#ffb03a', '#ff7a2f', '#fff3c4']
    : kind === 'nova' ? ['#a8f0ff', '#5fd8ff', '#ffffff', '#c8b6ff']
    : ['#ffffff', '#ffd166', '#ff5d73'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(1.5, 7);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.6,
      life: rand(18, 38), max: 38, g: 0.25,
      color: cols[(Math.random() * cols.length) | 0], r: rand(2, 5.5)
    });
  }
  // 冲击环
  particles.push({
    ring: true, x, y, life: 16, max: 16, color: cols[0],
    r0: 6, r1: kind === 'fire' ? 70 : kind === 'nova' ? 120 : 48
  });
}
function updateParticles() {
  for (const p of particles) {
    if (p.ring) { p.life--; continue; }
    p.vy += p.g; p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.98; p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    if (p.ring) {
      const t = 1 - p.life / p.max;
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = p.color; ctx.lineWidth = 3 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, lerp(p.r0, p.r1, easeOut(t)), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function updateFloaters() {
  for (const f of floaters) { f.y += f.vy; f.vy *= 0.94; f.life--; }
  floaters = floaters.filter(f => f.life > 0);
}
function drawFloaters() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    const a = clamp(f.life / 40, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + (f.big ? 44 : 30) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ================= 弹道 =================
class Projectile {
  constructor(x, y, vx, owner, o) {
    this.x = x; this.y = y; this.vx = vx; this.vy = 0;
    this.owner = owner; this.dmg = o.dmg; this.color = o.color;
    this.r = o.r; this.life = o.life; this.type = o.type;
    this.dead = false; this.trail = []; this.t = 0;
  }
  update() {
    this.t++;
    this.x += this.vx; this.y += this.vy;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 10) this.trail.shift();
    this.life--;
    if (this.life <= 0 || this.x < WALL_L - 60 || this.x > WALL_R + 60) this.dead = true;
    if (this.t % 2 === 0) {
      particles.push({
        x: this.x, y: this.y + rand(-4, 4),
        vx: rand(-0.6, 0.6), vy: rand(-0.6, 0.6),
        life: 14, max: 14, g: 0, r: this.r * 0.45, color: this.color
      });
    }
  }
  draw() {
    // 尾迹
    for (let i = 0; i < this.trail.length; i++) {
      const t = i / this.trail.length;
      ctx.globalAlpha = t * 0.6;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, this.r * t * 0.9, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 光晕
    const g = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, this.r * 2.6);
    g.addColorStop(0, this.color);
    g.addColorStop(0.45, this.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2.6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    // 核心
    const pulse = 1 + Math.sin(this.t * 0.5) * 0.12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.5 * pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.82 * pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.42 * pulse, 0, TAU); ctx.fill();
  }
}

// ================= 敌人 AI =================
const DIFFS = {
  easy:   { label: '简单', dmg: 0.60, react: 34, skillChance: 0.25, dodge: 0.15, aggro: 0.45, hold: [34, 84] },
  normal: { label: '普通', dmg: 0.90, react: 18, skillChance: 0.45, dodge: 0.42, aggro: 0.65, hold: [22, 58] },
  hard:   { label: '困难', dmg: 1.20, react: 10, skillChance: 0.65, dodge: 0.72, aggro: 0.92, hold: [14, 36] }
};

class EnemyAI {
  constructor(level) {
    this.level = level;
    this.p = DIFFS[level] || DIFFS.normal;
    this.reset();
  }
  reset() {
    this.t = 0;
    this.aimT = 0;      // 进入射程后的“瞄准”帧数，用于模拟反应时间
    this.reactCd = 0;
    this.decideCd = 0;
    this.step = 0;
    this.actCd = 0;
  }
  // 返回一个与人类输入同构的意图对象
  think(self, opp, prs) {
    const p = this.p;
    const out = { left: false, right: false, jump: false, attack: false, skills: [false, false] };
    this.t++;
    if (this.reactCd > 0) this.reactCd--;
    if (this.actCd > 0) this.actCd--;

    const dx = opp.x - self.x;
    const dist = Math.abs(dx);
    const dir = dx >= 0 ? 1 : -1;

    // ---------- 1. 闪避：来袭弹道与突进 ----------
    let threatDist = 1e9;
    for (const pr of prs) {
      if (pr.owner === self) continue;
      const rel = self.x - pr.x;
      const toward = (pr.vx > 0 && rel > 0) || (pr.vx < 0 && rel < 0);
      if (toward && Math.abs(pr.y - (self.y - 100)) < 120) {
        threatDist = Math.min(threatDist, Math.abs(rel));
      }
    }
    let dodging = false;
    if (self.onGround && this.reactCd <= 0 && threatDist < 340) {
      this.reactCd = 5;
      if (Math.random() < p.dodge) {
        if (self.type === 'sword' && self.cds[0] <= 0 && threatDist < 240) {
          out.skills[0] = true;     // 剑客用无敌冲刺穿过去
        } else {
          out.jump = true;          // 法师起跳躲弹道
        }
        dodging = true;
      }
    }
    if (!dodging && self.onGround && this.reactCd <= 0 && opp.dashT > 0 && dist < 300) {
      this.reactCd = 5;
      if (Math.random() < p.dodge) { out.jump = true; dodging = true; }
    }

    // ---------- 2. 距离控制 ----------
    let desired;
    if (self.type === 'sword') {
      desired = self.hp / self.maxHp < 0.3 ? 62 : 70;   // 近战：贴上去
    } else {
      desired = 260 + (p.aggro - 0.45) * 200;           // 法师：难度越高站位越稳
      if (dist < 170) desired = Math.max(desired, 390); // 被贴脸时后撤
      if (opp.hp / opp.maxHp < 0.3) desired = Math.max(desired, 320);
    }

    let move = 0;
    if (!dodging) {
      if (dist < desired - 60) move = -dir;
      else if (dist > desired + 60) move = dir;
    }
    // 巡航窗口：在安全距离内随机小幅走位
    if (this.decideCd > 0) this.decideCd--;
    else {
      this.decideCd = randInt(p.hold[0], p.hold[1]);
      this.step = Math.random() < 0.45 ? (Math.random() < 0.5 ? -1 : 1) : 0;
    }
    if (!dodging && move === 0) move = this.step;

    // 边界处理
    if (self.x < WALL_L + 130 && move < 0) move = 0;
    if (self.x > WALL_R - 130 && move > 0) move = 0;
    if (!dodging && (self.x < WALL_L + 70 || self.x > WALL_R - 70)) move = dir;
    if (move < 0) out.left = true; else if (move > 0) out.right = true;

    // ---------- 3. 普通攻击 ----------
    const range = self.type === 'sword' ? 124 : 620;
    if (dist <= range) this.aimT++; else this.aimT = 0;
    const hittable = opp.onGround && opp.dashT <= 0 && opp.invuln <= 0;

    if (!dodging && dist <= range && self.attackCd <= 0 && self.attackT <= 0 && this.aimT >= p.react) {
      let fire = false;
      if (self.type === 'sword') fire = dist <= 108 && opp.invuln <= 0;
      else fire = hittable || this.level === 'easy';   // 低难度会朝空中乱放
      if (fire) { out.attack = true; this.aimT = 0; }
    }

    // ---------- 4. 技能 ----------
    if (!dodging && !out.attack && self.attackT <= 0 && this.actCd <= 0) {
      this.actCd = 20;
      if (self.type === 'sword') {
        // 旋风斩：贴身后用来压制
        if (self.cds[1] <= 0 && dist < 130 && hittable && Math.random() < p.skillChance * 0.8) {
          out.skills[1] = true;
        } else if (self.cds[0] <= 0 && dist > 110 && dist < 250 && hittable && Math.random() < p.skillChance) {
          out.skills[0] = true;
        }
      } else {
        // 寒霜新星：被贴脸时反打
        if (self.cds[1] <= 0 && dist < 200 && hittable && Math.random() < p.skillChance * 0.7) {
          out.skills[1] = true;
        } else if (self.cds[0] <= 0 && hittable && dist > 140 && dist < 640 && Math.random() < p.skillChance) {
          out.skills[0] = true;
        }
      }
    }

    return out;
  }
}

// ================= 技能表 =================
// 每个英雄两个技能，各自独立冷却。id 决定实际效果（见 Fighter.castSkill）
const SKILLS = {
  sword: [
    { id: 'dash',  key: 'KeyG', label: '冲刺斩',   cd: 165 },
    { id: 'whirl', key: 'KeyH', label: '烈焰旋风', cd: 300 }
  ],
  mage: [
    { id: 'fire', key: 'KeyL', label: '爆裂火球', cd: 220 },
    { id: 'nova', key: 'KeyJ', label: '寒霜新星', cd: 300 }
  ]
};

// 连招递减：连段越长单次伤害越低，避免一套带走
const COMBO_SCALE = [1, 1, 0.9, 0.82, 0.74, 0.66, 0.6, 0.55, 0.5];
const COMBO_TIERS = [
  { min: 15, name: '无双', color: '#ff4d6d' },
  { min: 10, name: '狂暴', color: '#ff8c42' },
  { min: 7,  name: '华丽', color: '#ffd166' },
  { min: 4,  name: '精彩', color: '#7ee8fa' },
  { min: 2,  name: '连击', color: '#ffffff' }
];

// ================= 技能升级（回合间选卡，双方各自成长） =================
// tier: 1 普通 / 2 稀有 / 3 史诗，仅影响卡面配色
const TIER_STYLE = {
  1: { color: '#6fc6ff', label: '普通' },
  2: { color: '#c08bff', label: '稀有' },
  3: { color: '#ffd166', label: '史诗' }
};
const UPGRADES = [
  { id: 'cd', name: '疾风刻印', tier: 2, desc: '所有技能冷却 -15%',
    apply(f) { f.mods.cd = Math.max(0.4, f.mods.cd * 0.85); } },
  { id: 'power', name: '烈焰铭文', tier: 2, desc: '技能伤害 +20%',
    apply(f) { f.mods.power += 0.20; } },
  { id: 'range', name: '扩张法阵', tier: 1, desc: '技能范围 +18%',
    apply(f) { f.mods.range += 0.18; } },
  { id: 's0', name: '精通·一技能', tier: 2,
    desc: f => '「' + f.skills[0].label + '」伤害 +30%、冷却 -10%',
    apply(f) { f.mods.skillPower[0] += 0.30; f.mods.skillCd[0] = Math.max(0.4, f.mods.skillCd[0] * 0.9); } },
  { id: 's1', name: '精通·二技能', tier: 2,
    desc: f => '「' + f.skills[1].label + '」伤害 +35%',
    apply(f) { f.mods.skillPower[1] += 0.35; } },
  { id: 's1cd', name: '急速·二技能', tier: 2,
    desc: f => '「' + f.skills[1].label + '」冷却 -25%',
    apply(f) { f.mods.skillCd[1] = Math.max(0.4, f.mods.skillCd[1] * 0.75); } },
  { id: 'atk', name: '利刃共鸣', tier: 1, desc: '普通攻击伤害 +18%',
    apply(f) { f.mods.atk += 0.18; } },
  { id: 'speed', name: '疾行战靴', tier: 1, desc: '移动速度 +12%',
    apply(f) { f.mods.speed += 0.12; } },
  { id: 'vital', name: '不灭战意', tier: 1, desc: '最大生命 +45 并立即回复',
    apply(f) { f.hpBonus += 45; f.maxHp += 45; f.hp = Math.min(f.maxHp, f.hp + 45); } },
  { id: 'lifesteal', name: '嗜血', tier: 3, desc: '造成伤害的 12% 转化为治疗',
    apply(f) { f.mods.lifesteal += 0.12; } },
  { id: 'finisher', name: '破军', tier: 3, desc: '连招收招（第三段）伤害 +45%',
    apply(f) { f.mods.finisher += 0.45; } }
];
const UPGRADE_MAX = 3;   // 同一张卡最多叠加次数

// 随机抽取 3 张互不相同、且未叠满的升级卡
function rollUpgrades(f) {
  const bag = UPGRADES.filter(u => (f.upgradeCounts[u.id] || 0) < UPGRADE_MAX);
  const out = [];
  while (out.length < 3 && bag.length) {
    out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
  }
  return out;
}

// ================= 角色 =================
class Fighter {
  constructor(cfg) {
    this.name = cfg.name;
    this.color = cfg.color;
    this.color2 = cfg.color2;
    this.type = cfg.type;
    this.side = cfg.side;
    this.maxHp = cfg.maxHp;
    this.speed = cfg.speed;
    this.jumpPower = cfg.jumpPower;
    this.controls = cfg.controls;
    this.startX = cfg.startX;
    this.startFacing = cfg.facing;
    this.dmg = cfg.type === 'sword' ? 12 : 8;
    this.knock = cfg.type === 'sword' ? 4.5 : 4;
    this.h = 140;
    this.ai = null;
    this.dmgMul = 1;      // 人机模式下按难度调整 AI 输出
    this.baseMaxHp = cfg.maxHp;
    this.skills = SKILLS[cfg.type];
    this.resetMods();     // 强化加成（每场对局重新分配）
    this.reset();
  }
  // 强化：每场对局开始时清空，回合间选卡累计
  resetMods() {
    this.hpBonus = 0;
    this.mods = {
      cd: 1, power: 1, atk: 1, range: 1, speed: 1,   // 全局倍率
      lifesteal: 0, finisher: 1,                      // 吸血比例 / 收招倍率
      skillPower: [1, 1], skillCd: [1, 1]             // 各技能独立的伤害 / 冷却倍率
    };
    this.upgrades = [];
    this.upgradeCounts = {};
  }
  applyUpgrade(up) {
    up.apply(this);
    this.upgrades.push(up.id);
    this.upgradeCounts[up.id] = (this.upgradeCounts[up.id] || 0) + 1;
  }
  reset() {
    this.x = this.startX; this.y = GROUND;
    this.vx = 0; this.vy = 0;
    this.facing = this.startFacing;
    this.maxHp = this.baseMaxHp + this.hpBonus;
    this.hp = this.maxHp; this.hpDisplay = this.maxHp;
    this.onGround = true;
    this.animT = 0;
    this.attackT = 0; this.attackDur = 20; this.attackCd = 0;
    this.cds = this.skills.map(() => 0);
    this.hitStun = 0; this.flash = 0; this.invuln = 0;
    this.dashT = 0; this.hitSet = new Set();
    this.combo = 0; this.comboT = 0;
    this.chainStep = 0; this.chainT = 0;   // 连招段数与续接窗口
    this.whirlT = 0; this.whirlTick = 0;   // 烈焰旋风
    this.novaT = 0;                        // 寒霜新星
    this.walkPhase = 0;
    this.ghosts = [];
  }
  get bodyBox() { return { x: this.x - 24, y: this.y - 138, w: 48, h: 132 }; }

  update(opp) {
    if (this.flash > 0) this.flash--;
    if (this.attackCd > 0) this.attackCd--;
    for (let i = 0; i < this.cds.length; i++) {
      if (this.cds[i] > 0) {
        this.cds[i]--;
        if (this.cds[i] === 0) SFX.ready();   // 冷却结束的提示音
      }
    }
    if (this.invuln > 0) this.invuln--;
    if (this.chainT > 0) { this.chainT--; if (this.chainT === 0) this.chainStep = 0; }
    if (this.whirlT > 0) this.whirlT--;
    if (this.novaT > 0) this.novaT--;
    if (this.comboT > 0) { this.comboT--; if (this.comboT === 0) this.combo = 0; }
    this.animT++;

    const canAct = this.hitStun <= 0 && this.dashT <= 0 && gameState === 'fight';
    const inp = this.getInput(opp);

    if (this.hitStun > 0) this.hitStun--;

    let moving = 0;
    if (canAct) {
      if (inp.left) moving -= 1;
      if (inp.right) moving += 1;
    }

    if (this.dashT > 0) {
      // 冲刺中：保持速度，绘制残影
      if (this.animT % 2 === 0) this.ghosts.push({ x: this.x, y: this.y, facing: this.facing, life: 12 });
      this.dashT--;
      if (this.dashT === 0) { this.invuln = 0; this.vx *= 0.25; }
    } else if (canAct) {
      if (this.attackT > 0) {
        this.vx *= 0.86;
      } else if (moving !== 0) {
        this.vx = moving * this.speed * this.mods.speed;
      } else if (this.onGround) {
        this.vx *= 0.55;
      }
      // 决斗中始终面向对手，出招期间锁定朝向
      if (this.attackT <= 0) {
        const d = opp.x - this.x;
        if (Math.abs(d) > 6) this.facing = d >= 0 ? 1 : -1;
      }
      if (inp.jump && this.onGround && this.attackT <= 0) {
        this.vy = -this.jumpPower; this.onGround = false; SFX.jump();
      }
      if (inp.attack && this.attackCd <= 0 && this.attackT <= 0) this.doAttack();
      for (let i = 0; i < this.skills.length; i++) {
        if (inp.skills[i] && this.cds[i] <= 0 && this.attackT <= 0 && this.dashT <= 0) this.castSkill(i, opp);
      }
    } else if (this.onGround) {
      this.vx *= 0.88;   // 硬直中给地面摩擦，避免被连续击退一路滑到墙角
    }

    // 近战判定
    if (this.attackT > 0) {
      this.attackT--;
      if (this.type === 'sword') this.meleeCheck(opp);
    }

    // 烈焰旋风：环绕多段打击
    if (this.whirlT > 0 && gameState === 'fight') {
      if (this.whirlTick > 0) this.whirlTick--;
      else {
        this.whirlTick = 11;
        const b = this.meleeBox(150, 150);
        if (overlap(b, opp.bodyBox) && opp.invuln <= 0) {
          hitTarget(opp, this, Math.round(this.dmg * 1.1 * this.mods.power * this.mods.skillPower[1] * this.dmgMul), this.facing * 3.5, 12, 'whirl');
          spawnHit(opp.x, opp.y - 92, 'whirl');
        }
      }
    }

    // 冲刺伤害判定
    if (this.dashT > 0 && gameState === 'fight') {
      if (!this.hitSet.has(opp) && overlap(this.bodyBox, opp.bodyBox)) {
        this.hitSet.add(opp);
        hitTarget(opp, this, Math.round(22 * this.mods.power * this.mods.skillPower[0] * this.dmgMul), this.facing * 15, 24, 'dash');
      }
    }

    // 物理
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;
    if (this.y >= GROUND) {
      if (!this.onGround && this.vy > 3) {
        if (this.vy > 7) SFX.land();
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: this.x + rand(-18, 18), y: GROUND,
            vx: rand(-3, 3), vy: rand(-3, -0.5),
            life: 18, max: 18, g: 0.3, r: rand(2, 4), color: 'rgba(190,200,230,0.9)'
          });
        }
      }
      this.y = GROUND; this.vy = 0; this.onGround = true;
    } else this.onGround = false;
    this.x = clamp(this.x, WALL_L, WALL_R);

    if (this.onGround && this.attackT <= 0 && this.dashT <= 0) {
      this.walkPhase += Math.abs(this.vx) * 0.11;
    }

    // 残影衰减
    for (const g of this.ghosts) g.life--;
    this.ghosts = this.ghosts.filter(g => g.life > 0);
  }

  // 统一输入：AI 返回决策意图，人类玩家读取键盘（边沿触发）
  getInput(opp) {
    if (this.ai) return this.ai.think(this, opp, projectiles);
    const c = this.controls;
    return {
      left: !!keys[c.left], right: !!keys[c.right],
      jump: consume(c.jump), attack: consume(c.attack),
      skills: this.skills.map(s => consume(s.key))
    };
  }

  // 普通攻击：三段连招，第三段为收招（击飞 / 强化弹）
  doAttack() {
    this.chainStep = this.chainT > 0 ? (this.chainStep + 1) % 3 : 0;
    const fin = this.chainStep === 2;

    if (this.type === 'sword') {
      this.attackT = this.attackDur = fin ? 30 : 20;
      this.attackCd = this.attackT + 8;
      this.chainT = fin ? 0 : this.attackT + 36;   // 收招后连段重置
      this.hitSet.clear();
      if (fin) SFX.heavy(); else SFX.slash();
    } else {
      this.attackT = fin ? 22 : 16;
      this.attackCd = fin ? 48 : 34;
      this.chainT = fin ? 0 : this.attackT + 40;
      this.hitSet.clear();
      projectiles.push(new Projectile(
        this.x + this.facing * 34, this.y - 96, this.facing * (fin ? 17 : 13.5), this, {
          dmg: Math.round(this.dmg * (fin ? 1.8 * this.mods.finisher : 1) * this.mods.atk * this.dmgMul),
          color: fin ? '#ffd0ff' : '#6fc6ff', r: Math.round((fin ? 16 : 11) * this.mods.range), life: 95, type: 'bolt'
        }
      ));
      SFX.shoot();
    }
  }

  castSkill(i, opp) {
    const sk = this.skills[i];
    if (sk.id === 'dash') {
      this.dashT = 16; this.invuln = 16;
      this.vx = this.facing * 21;
      this.hitSet.clear();
      this.ghosts = [];
      SFX.dash();
    } else if (sk.id === 'whirl') {
      this.whirlT = 44; this.whirlTick = 0;
      this.animT = 0;
      SFX.whirl();
      shake(5);
    } else if (sk.id === 'fire') {
      this.attackT = 26; this.attackDur = 26;
      this.hitSet.clear();
      projectiles.push(new Projectile(
        this.x + this.facing * 40, this.y - 96, this.facing * 10, this,
        { dmg: Math.round(24 * this.mods.power * this.mods.skillPower[0] * this.dmgMul), color: '#ff9430', r: Math.round(21 * this.mods.range), life: 115, type: 'fire' }
      ));
      SFX.shoot();
    } else if (sk.id === 'nova') {
      this.novaT = 26;
      this.invuln = Math.max(this.invuln, 10);
      SFX.nova();
      shake(9);
      // 以自身为中心的范围爆发：命中则击飞，用来反打贴脸的敌人
      const rx = 150 * this.mods.range, ry = 190 * this.mods.range;
      const b = { x: this.x - rx, y: this.y - ry, w: rx * 2, h: ry };
      if (overlap(b, opp.bodyBox) && opp.invuln <= 0) {
        hitTarget(opp, this, Math.round(16 * this.mods.power * this.mods.skillPower[1] * this.dmgMul), sign(opp.x - this.x) * 9, 22, 'nova', -14);
      }
    }
    this.cds[i] = Math.max(30, Math.round(sk.cd * this.mods.cd * this.mods.skillCd[i]));
  }

  meleeBox(w, h) {
    w = (w || 92) * this.mods.range; h = (h || 118) * this.mods.range;
    const x = this.facing > 0 ? this.x + 6 : this.x - 6 - w;
    return { x: x, y: this.y - 132, w: w, h: h };
  }
  meleeCheck(opp) {
    const fin = this.chainStep === 2;
    const elapsed = this.attackDur - this.attackT;
    const from = fin ? 8 : 5, to = fin ? 20 : 13;
    if (elapsed < from || elapsed > to) return;
    if (this.hitSet.has(opp)) return;
    if (overlap(this.meleeBox(fin ? 112 : 92, fin ? 130 : 118), opp.bodyBox)) {
      this.hitSet.add(opp);
      if (fin) {
        // 收招：高伤 + 击飞，可接后续连段
        hitTarget(opp, this, Math.round(this.dmg * 1.6 * this.mods.finisher * this.mods.atk * this.dmgMul), this.facing * 11, 26, 'dash', -13);
        shake(11);
      } else {
        hitTarget(opp, this, Math.round(this.dmg * this.mods.atk * this.dmgMul), this.facing * this.knock, 16, 'melee');
      }
    }
  }
}

// ================= 命中处理 =================
function hitTarget(target, attacker, dmg, knockX, stun, kind, knockY) {
  if (target.invuln > 0 || gameState !== 'fight') return;

  // 连招递减：连段越长，单次伤害越低
  if (attacker && attacker.combo > 0) {
    const s = COMBO_SCALE[Math.min(attacker.combo, COMBO_SCALE.length - 1)];
    dmg = Math.max(1, Math.round(dmg * s));
  }

  target.hp = Math.max(0, target.hp - dmg);
  target.hitStun = stun;
  target.vx += knockX;
  if (knockY) { target.vy = knockY; target.onGround = false; }   // 击飞
  target.attackT = 0;
  target.whirlT = 0;
  target.flash = 9;
  if (attacker) { attacker.combo++; attacker.comboT = 100; }

  // 嗜血：按实际伤害回复自身
  if (attacker && attacker.mods && attacker.mods.lifesteal > 0 && attacker.hp < attacker.maxHp) {
    const heal = Math.max(1, Math.round(dmg * attacker.mods.lifesteal));
    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
    floaters.push({
      x: attacker.x + rand(-10, 10), y: attacker.y - 150,
      text: '+' + heal, vy: -0.9, life: 34, color: '#7cffa0'
    });
  }

  spawnHit(target.x, target.y - 92, kind);
  const heavyHit = kind === 'dash' || kind === 'fire' || kind === 'nova' || kind === 'whirl';
  shake(heavyHit ? 10 : 6);
  floaters.push({
    x: target.x + rand(-14, 14), y: target.y - 136,
    text: '-' + dmg, vy: -1.15, life: 42,
    color: kind === 'fire' ? '#ffb03a' : heavyHit ? '#ffd166' : '#ffffff',
    big: heavyHit
  });
  if (heavyHit) SFX.boom(); else SFX.hit();

  if (target.hp <= 0) knockOut(target, attacker);
}

function knockOut(target, attacker) {
  if (gameState !== 'fight') return;
  gameState = 'roundover';
  stateT = 0;
  roundResult = attacker.side === 0 ? 0 : 1;
  wins[attacker.side]++;
  shake(16);
  SFX.ko();
  // 击飞
  target.vx = sign(target.x - attacker.x) * 12 + attacker.facing * 6;
  target.vy = -12;
  target.hitStun = 120;
}

function timeOut() {
  gameState = 'roundover'; stateT = 0;
  if (p1.hp === p2.hp) roundResult = -1;
  else {
    roundResult = p1.hp > p2.hp ? 0 : 1;
    wins[roundResult]++;
  }
  SFX.ko();
}

// ================= 背景（离屏预渲染） =================
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
function drawMountain(b, baseY, height, color, seed) {
  const rnd = mulberry32(seed);
  b.fillStyle = color;
  b.beginPath();
  b.moveTo(-50, baseY);
  let x = -50;
  while (x < W + 50) {
    const w = 90 + rnd() * 170;
    const h = height * (0.35 + rnd() * 0.65);
    b.lineTo(x + w * 0.5, baseY - h);
    b.lineTo(x + w, baseY);
    x += w;
  }
  b.lineTo(W + 50, H); b.lineTo(-50, H);
  b.closePath(); b.fill();
}
function buildBackground() {
  const b = bg.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, GROUND + 40);
  g.addColorStop(0, '#060a20');
  g.addColorStop(0.38, '#131c44');
  g.addColorStop(0.68, '#2b2856');
  g.addColorStop(1, '#100c22');
  b.fillStyle = g; b.fillRect(0, 0, W, H);

  const rnd = mulberry32(7);
  for (let i = 0; i < 160; i++) {
    const x = rnd() * W, y = rnd() * GROUND * 0.85;
    b.globalAlpha = rnd() * 0.7 + 0.15;
    b.fillStyle = '#cfe3ff';
    b.beginPath(); b.arc(x, y, rnd() * 1.6 + 0.3, 0, TAU); b.fill();
  }
  b.globalAlpha = 1;

  // 月亮
  const mx = 1020, my = 158, mr = 86;
  const mg = b.createRadialGradient(mx, my, 8, mx, my, mr * 3.2);
  mg.addColorStop(0, 'rgba(175,200,255,0.30)');
  mg.addColorStop(0.4, 'rgba(150,180,255,0.10)');
  mg.addColorStop(1, 'rgba(150,180,255,0)');
  b.fillStyle = mg; b.beginPath(); b.arc(mx, my, mr * 3.2, 0, TAU); b.fill();
  b.fillStyle = '#e2ecff'; b.beginPath(); b.arc(mx, my, mr, 0, TAU); b.fill();
  b.fillStyle = 'rgba(150,175,220,0.42)';
  b.beginPath(); b.arc(mx - 26, my - 20, 15, 0, TAU); b.fill();
  b.beginPath(); b.arc(mx + 24, my + 16, 21, 0, TAU); b.fill();
  b.beginPath(); b.arc(mx - 4, my + 42, 9, 0, TAU); b.fill();

  drawMountain(b, GROUND + 8, 330, '#0c1130', 11);
  drawMountain(b, GROUND + 18, 255, '#131a3f', 29);
  drawMountain(b, GROUND + 30, 175, '#1b2352', 53);
  drawMountain(b, GROUND + 42, 95, '#242c62', 71);
}
buildBackground();

function drawArena(t) {
  ctx.drawImage(bg, 0, 0);

  // 地面
  const fg = ctx.createLinearGradient(0, GROUND, 0, H);
  fg.addColorStop(0, '#413a6d');
  fg.addColorStop(0.12, '#262148');
  fg.addColorStop(1, '#08060f');
  ctx.fillStyle = fg;
  ctx.fillRect(0, GROUND, W, H - GROUND);

  // 地面呼吸光
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.045);
  ctx.strokeStyle = 'rgba(150,190,255,' + (0.5 + pulse * 0.45) + ')';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,190,255,0.12)';
  ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(0, GROUND + 12); ctx.lineTo(W, GROUND + 12); ctx.stroke();

  // 场地符文圈
  ctx.save();
  ctx.translate(W / 2, GROUND + 62);
  ctx.scale(1, 0.30);
  for (let i = 0; i < 3; i++) {
    const r = 150 + i * 130;
    ctx.globalAlpha = (0.22 - i * 0.05) * (0.6 + pulse * 0.5);
    ctx.strokeStyle = '#8fb8ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r + Math.sin(t * 0.03 + i) * 6, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 两侧光柱
  for (const px of [90, W - 90]) {
    const lg = ctx.createLinearGradient(0, GROUND - 300, 0, GROUND);
    lg.addColorStop(0, 'rgba(120,170,255,0)');
    lg.addColorStop(1, 'rgba(120,170,255,' + (0.12 + pulse * 0.08) + ')');
    ctx.fillStyle = lg;
    ctx.fillRect(px - 34, GROUND - 300, 68, 300);
    ctx.fillStyle = 'rgba(180,215,255,0.75)';
    roundRect(px - 16, GROUND - 96, 32, 96, 6); ctx.fill();
  }
}

// ================= 角色绘制 =================
function limb(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function drawFighter(f) {
  // 残影
  for (const g of f.ghosts) {
    ctx.save();
    ctx.globalAlpha = (g.life / 12) * 0.35;
    ctx.translate(g.x, g.y - 70);
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 68, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 阴影
  const shScale = clamp(1 - (GROUND - f.y) / 460, 0.45, 1);
  ctx.save();
  ctx.globalAlpha = 0.34 * shScale;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(f.x, GROUND + 6, 40 * shScale, 13 * shScale, 0, 0, TAU); ctx.fill();
  ctx.restore();

  const walking = Math.abs(f.vx) > 0.6 && f.onGround && f.attackT <= 0 && f.dashT <= 0;
  let lean = 0, bob = 0;
  if (f.hitStun > 0) lean = -0.28 * clamp(f.hitStun / 12, 0, 1);
  if (f.dashT > 0) lean = 0.34;
  if (!f.onGround) bob = 4;
  else if (walking) bob = Math.abs(Math.sin(f.walkPhase)) * 3;

  ctx.save();
  ctx.translate(f.x, f.y - bob);
  ctx.scale(f.facing, 1);
  ctx.rotate(lean);

  const hurt = f.flash > 0 && (f.flash % 4 < 2);
  const main = hurt ? '#ffffff' : f.color;
  const dark = hurt ? '#ffdede' : f.color2;
  const skin = hurt ? '#ffffff' : '#f0c39c';

  // 腿
  const swing = walking ? Math.sin(f.walkPhase) * 11 : 0;
  limb(-9, -50, -12 + swing, -4, 14, dark);
  limb(9, -50, 12 - swing, -4, 14, main);

  // 后臂
  limb(-4, -96, -22, -66, 10, dark);

  // 躯干
  ctx.fillStyle = main;
  roundRect(-19, -104, 38, 58, 13); ctx.fill();
  ctx.fillStyle = dark;
  roundRect(-19, -104, 38, 20, 10); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  roundRect(-19, -60, 38, 8, 3); ctx.fill();
  // 胸口宝石
  ctx.fillStyle = hurt ? '#fff' : '#fff6c4';
  ctx.beginPath(); ctx.arc(0, -84, 5, 0, TAU); ctx.fill();

  // 头
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -122, 18, 0, TAU); ctx.fill();
  // 头发 / 头饰
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(0, -126, 18.5, Math.PI * 1.02, Math.PI * 2.02); ctx.fill();
  if (f.type === 'sword') {
    ctx.fillStyle = main;
    ctx.beginPath();
    ctx.moveTo(-18, -128); ctx.lineTo(-30, -152); ctx.lineTo(-8, -140); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = hurt ? '#fff' : '#bfe4ff';
    ctx.beginPath(); ctx.arc(0, -146, 5, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(140,200,255,0.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, -146, 9, 0, TAU); ctx.stroke();
  }
  // 眼睛
  ctx.fillStyle = '#1a1a26';
  ctx.beginPath(); ctx.arc(9, -123, 2.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(2, -123, 2.2, 0, TAU); ctx.fill();

  // 前臂 + 武器
  const p = f.attackT > 0 ? 1 - f.attackT / f.attackDur : 0;
  const active = f.attackT > 0;
  let armA;
  if (f.type === 'sword') {
    armA = active ? lerp(-1.95, 0.5, easeOut(clamp(p / 0.75, 0, 1))) : 0.95;
  } else {
    armA = active ? lerp(0.95, -0.18, easeOut(clamp(p / 0.5, 0, 1))) : 1.05;
  }
  const sx = 6, sy = -96, armLen = 38;
  const hx = sx + Math.cos(armA) * armLen;
  const hy = sy + Math.sin(armA) * armLen;
  limb(sx, sy, hx, hy, 11, skin);

  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(armA);
  if (f.type === 'sword') {
    // 剑
    const bl = 78;
    const bg2 = ctx.createLinearGradient(0, -4, bl, 4);
    bg2.addColorStop(0, '#dfe9ff');
    bg2.addColorStop(0.5, '#ffffff');
    bg2.addColorStop(1, '#a9c2e8');
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.moveTo(0, -5); ctx.lineTo(bl - 14, -5); ctx.lineTo(bl, 0);
    ctx.lineTo(bl - 14, 5); ctx.lineTo(0, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(-3, -13, 8, 26);
    ctx.fillStyle = '#3a2c1e';
    ctx.fillRect(-16, -4, 14, 8);
    if (active && p > 0.15 && p < 0.8) {
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = '#cfe6ff'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(-hx + 20, 0, 62, -1.1, 0.5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else {
    // 法杖
    ctx.fillStyle = '#6b4a2f';
    ctx.fillRect(-24, -4, 66, 8);
    ctx.fillStyle = '#8a6238';
    ctx.fillRect(-24, -4, 66, 3);
    // 魔力球
    const charge = active ? clamp(p / 0.5, 0, 1) : 0;
    const rr = 9 + charge * 9 + Math.sin(f.animT * 0.2) * 1.2;
    const og = ctx.createRadialGradient(48, 0, 1, 48, 0, rr * 2.6);
    og.addColorStop(0, '#ffffff');
    og.addColorStop(0.35, '#8fd4ff');
    og.addColorStop(1, 'rgba(80,160,255,0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(48, 0, rr * 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#eaf7ff';
    ctx.beginPath(); ctx.arc(48, 0, rr * 0.7, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 烈焰旋风：三道环绕刀光
  if (f.whirlT > 0) {
    const fade = clamp(f.whirlT / 10, 0, 1);
    for (let k = 0; k < 3; k++) {
      const a = f.animT * 0.44 - k * 1.15;
      ctx.save();
      ctx.translate(0, -78);
      ctx.rotate(a);
      ctx.globalAlpha = (0.85 - k * 0.24) * fade;
      ctx.strokeStyle = k === 0 ? '#fff3c4' : '#ff8a3c';
      ctx.lineWidth = k === 0 ? 8 : 5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 78 - k * 6, -0.8, 0.8); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // 寒霜新星：向外扩散的冰环
  if (f.novaT > 0) {
    const t = 1 - f.novaT / 26;
    const rad = 34 + t * 150;
    ctx.save();
    ctx.globalAlpha = (1 - t) * 0.9;
    ctx.strokeStyle = '#a8f0ff';
    ctx.lineWidth = 10 - t * 6;
    ctx.beginPath(); ctx.ellipse(f.x, f.y - 80, rad, rad * 0.72, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - t) * 0.55;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(f.x, f.y - 80, rad * 0.68, rad * 0.49, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 受击白光
  if (f.flash > 0) {
    ctx.save();
    ctx.globalAlpha = (f.flash / 9) * 0.35;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(f.x, f.y - 70, 34, 72, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 连击提示（随连段数升级称号）
  if (f.combo >= 2 && f.comboT > 0) {
    const tier = COMBO_TIERS.find(t => f.combo >= t.min) || COMBO_TIERS[COMBO_TIERS.length - 1];
    const pop = f.comboT > 88 ? 1 + (f.comboT - 88) * 0.03 : 1;   // 命中瞬间的放大反馈
    ctx.save();
    ctx.globalAlpha = clamp(f.comboT / 60, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(28 * pop) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = tier.color;
    ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 5;
    const txt = f.combo + ' ' + tier.name;
    ctx.strokeText(txt, f.x, f.y - 168);
    ctx.fillText(txt, f.x, f.y - 168);
    ctx.restore();
  }
}

// ================= HUD =================
function drawHealthBar(f, left) {
  const bw = 430, bh = 26, by = 34;
  const bx = left ? 56 : W - 56 - bw;
  const ratio = clamp(f.hp / f.maxHp, 0, 1);
  const disp = clamp(f.hpDisplay / f.maxHp, 0, 1);
  const dir = left ? 1 : -1;

  // 底框
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(bx - 4, by - 4, bw + 8, bh + 8, 6); ctx.fill();
  ctx.fillStyle = 'rgba(18,20,38,0.95)';
  roundRect(bx, by, bw, bh, 5); ctx.fill();

  // 掉血缓冲
  if (disp > ratio) {
    const dx = left ? bx : bx + bw - bw * disp;
    ctx.fillStyle = 'rgba(255,220,140,0.8)';
    ctx.fillRect(dx, by, bw * Math.abs(disp - ratio), bh);
  }
  // 当前血量
  const fx = left ? bx : bx + bw - bw * ratio;
  const hg = ctx.createLinearGradient(0, by, 0, by + bh);
  hg.addColorStop(0, f.color);
  hg.addColorStop(1, f.color2);
  ctx.fillStyle = hg;
  roundRect(fx, by, Math.max(0, bw * ratio), bh, 5); ctx.fill();
  // 顶部高光
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  roundRect(fx, by + 2, Math.max(0, bw * ratio), bh * 0.35, 4); ctx.fill();

  // 边框
  ctx.strokeStyle = 'rgba(160,190,255,0.55)'; ctx.lineWidth = 2;
  roundRect(bx, by, bw, bh, 5); ctx.stroke();

  // 名字
  ctx.textAlign = left ? 'left' : 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#eaf0ff';
  ctx.fillText(f.name, left ? bx + 2 : bx + bw - 2, by + bh + 24);

  // 已强化数量（显示在名字行的对侧）
  if (f.upgrades && f.upgrades.length) {
    ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.textAlign = left ? 'right' : 'left';
    ctx.fillText('强化 +' + f.upgrades.length, left ? bx + bw - 2 : bx + 2, by + bh + 24);
  }

  // 血量数值
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(210,225,255,0.75)';
  ctx.fillText(Math.ceil(f.hp) + ' / ' + f.maxHp, left ? bx + 2 : bx + bw - 2, by - 10);

  // 回合胜点
  for (let i = 0; i < 2; i++) {
    const cx = left ? bx + 12 + i * 28 : bx + bw - 12 - i * 28;
    ctx.beginPath(); ctx.arc(cx, by + bh + 42, 8, 0, TAU);
    if (i < wins[f.side]) {
      ctx.fillStyle = f.color; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  // 技能冷却（每个英雄两个独立技能）
  const iw = 48, ih = 50, gap = 8, iy = by + bh + 62;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < f.skills.length; i++) {
    const sk = f.skills[i];
    const cx = iw / 2;
    const ix = left ? bx + 6 + i * (iw + gap) : bx + bw - iw - 6 - i * (iw + gap);
    const cd = (f.cds && f.cds[i]) || 0;
    const ratio = clamp(cd / sk.cd, 0, 1);
    const ready = cd <= 0;

    // 底板
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ix, iy, iw, ih, 8); ctx.fill();
    // 技能名
    ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = ready ? '#ffd166' : 'rgba(160,180,220,0.6)';
    ctx.fillText(sk.label.slice(0, 2), ix + cx, iy + 15);
    // 按键提示
    ctx.font = 'bold 10px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(200,215,245,0.55)';
    ctx.fillText(sk.key.replace('Key', ''), ix + cx, iy + ih - 10);
    // 冷却遮罩 + 倒计时
    if (!ready) {
      ctx.fillStyle = 'rgba(10,14,30,0.72)';
      roundRect(ix, iy, iw, ih * ratio, 8); ctx.fill();
      ctx.font = 'bold 16px "PingFang SC",sans-serif';
      ctx.fillStyle = '#eaf0ff';
      ctx.fillText(Math.ceil(cd / 60), ix + cx, iy + 28);
    } else {
      ctx.strokeStyle = 'rgba(255,209,102,0.9)'; ctx.lineWidth = 2;
      roundRect(ix, iy, iw, ih, 8); ctx.stroke();
    }
  }
  ctx.textBaseline = 'alphabetic';
}

const p2 = new Fighter({
  name: '秘法星灵', color: '#4fa8ff', color2: '#1b4f9e', type: 'mage',
  maxHp: 200, speed: 4.7, jumpPower: 16.5, side: 1, startX: 810, facing: -1,
  controls: { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', attack: 'KeyK', skill: 'KeyL' }
});

function startRound() {
  p1.reset(); p2.reset();
  if (p2.ai) p2.ai.reset();
  projectiles = []; particles = []; floaters = [];
  roundTime = TOTAL_ROUND_TIME;
  roundResult = null;
  gameState = 'countdown';
  stateT = 0;
  paused = false;
}
function startMatch(modeIdx) {
  if (modeIdx === undefined) modeIdx = currentMode;
  currentMode = modeIdx;
  aiLevel = modeIdx === 0 ? null : MENU[modeIdx].id;
  p2.ai = aiLevel ? new EnemyAI(aiLevel) : null;
  p2.dmgMul = aiLevel ? DIFFS[aiLevel].dmg : 1;
  p1.resetMods(); p2.resetMods();   // 新对局：清空双方强化
  wins = [0, 0]; round = 1;
  Music.duck = 1;
  Music.play('battle');   // 进入对战：切换到战斗曲
  Music.apply(0.3);
  startRound();
}

// 进入回合间的强化选卡阶段：双方各自获得一组候选卡
function beginUpgrade() {
  gameState = 'upgrade';
  stateT = 0;
  upgradePhase = 0;
  upgradeSel = 0;
  upgradeChoices = [rollUpgrades(p1), rollUpgrades(p2)];
}

// 当前选择者确认一张卡，随后交给下一位（或开始下一回合）
function commitUpgrade() {
  const chooser = upgradePhase === 0 ? p1 : p2;
  const card = upgradeChoices[upgradePhase][upgradeSel];
  if (!card) return;
  chooser.applyUpgrade(card);
  SFX.ready();
  upgradePhase++;
  upgradeSel = 0;
  stateT = 0;
  if (upgradePhase >= 2) { round++; startRound(); }
}

// 身体碰撞：把重叠的两人沿 X 轴分开，避免互相穿过
function resolveBodyCollision() {
  const a = p1.bodyBox, b = p2.bodyBox;
  if (a.y + a.h < b.y || b.y + b.h < a.y) return;   // 一方已跳到另一方头顶，不阻挡
  const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
  if (ox <= 0) return;
  const dir = p1.x <= p2.x ? 1 : -1;
  // 靠墙的一方推不动时，把余量转移给另一方
  const room1 = dir > 0 ? p1.x - WALL_L : WALL_R - p1.x;
  const room2 = dir > 0 ? WALL_R - p2.x : p2.x - WALL_L;
  const move1 = clamp(ox / 2, 0, room1);
  const move2 = clamp(ox - move1, 0, room2);
  p1.x -= dir * move1;
  p2.x += dir * move2;
}

function updateProjectiles() {
  for (const pr of projectiles) {
    if (pr.dead) continue;
    pr.update();
    const target = pr.owner === p1 ? p2 : p1;
    if (gameState === 'fight' && !pr.dead &&
        circleRect(pr.x, pr.y, pr.r, target.bodyBox) && target.invuln <= 0) {
      pr.dead = true;
      hitTarget(target, pr.owner, pr.dmg, sign(pr.vx) * (pr.type === 'fire' ? 8 : 4),
        pr.type === 'fire' ? 16 : 7, pr.type === 'fire' ? 'fire' : 'bolt');
    }
  }
  projectiles = projectiles.filter(p => !p.dead);
}

function fixedUpdate() {
  time++;
  if (shakeT > 0) shakeT--;
  if (consume('KeyM')) { muted = !muted; Music.apply(0.15); }

  if (gameState === 'menu') {
    Music.play('menu');
    const before = menuIndex;
    if (consume('KeyW') || consume('ArrowUp')) menuIndex = (menuIndex + MENU.length - 1) % MENU.length;
    if (consume('KeyS') || consume('ArrowDown')) menuIndex = (menuIndex + 1) % MENU.length;
    for (let i = 0; i < MENU.length; i++) {
      if (consume('Digit' + (i + 1)) || consume('Numpad' + (i + 1))) menuIndex = i;
    }
    if (menuIndex !== before) SFX.nav();
    if (consume('Enter') || consume('Space')) { startMatch(menuIndex); SFX.go(); }
    clearPressed(); return;
  }
  if (gameState === 'gameover') {
    updateParticles(); updateFloaters();
    if (consume('Enter') || consume('Space')) { gameState = 'menu'; stateT = 0; menuIndex = currentMode; }
    clearPressed(); return;
  }
  if (gameState === 'upgrade') {
    stateT++;
    const chooser = upgradePhase === 0 ? p1 : p2;
    const cards = upgradeChoices[upgradePhase];
    if (chooser.ai) {
      // 电脑自动挑选：稍作停顿，让玩家看清它拿了什么
      if (stateT >= 50) { upgradeSel = Math.floor(Math.random() * cards.length); commitUpgrade(); }
    } else {
      const prev = consume(upgradePhase === 0 ? 'KeyA' : 'ArrowLeft');
      const next = consume(upgradePhase === 0 ? 'KeyD' : 'ArrowRight');
      const ok = upgradePhase === 0
        ? (consume('KeyF') || consume('Enter'))
        : (consume('KeyK') || consume('Space'));
      if (prev) { upgradeSel = (upgradeSel + cards.length - 1) % cards.length; SFX.nav(); }
      if (next) { upgradeSel = (upgradeSel + 1) % cards.length; SFX.nav(); }
      if (ok) commitUpgrade();
    }
    clearPressed(); return;
  }
  if (consume('KeyR')) { startMatch(); clearPressed(); return; }
  if (consume('KeyP')) { paused = !paused; Music.duck = paused ? 0.3 : 1; Music.apply(0.25); }
  if (paused) { clearPressed(); return; }

  if (gameState === 'countdown') {
    stateT++;
    if (stateT % 45 === 0 && stateT < 135) SFX.count();
    if (stateT === 135) SFX.go();
    p1.animT++; p2.animT++;
    updateParticles(); updateFloaters();
    if (stateT >= 160) { gameState = 'fight'; stateT = 0; }
    clearPressed(); return;
  }

  if (gameState === 'fight') {
    roundTime--;
    p1.update(p2); p2.update(p1);
    resolveBodyCollision();
    updateProjectiles();
    updateParticles(); updateFloaters();
    if (roundTime <= 0) timeOut();
    clearPressed(); return;
  }

  if (gameState === 'roundover') {
    stateT++;
    p1.update(p2); p2.update(p1);
    resolveBodyCollision();
    updateProjectiles(); updateParticles(); updateFloaters();
    if (stateT >= 150) {
      if (wins[0] >= 2 || wins[1] >= 2) {
        gameState = 'gameover'; stateT = 0;
        Music.stop(); playVictory();   // 决出胜负：停战斗曲，吹胜利号角
      }
      else { beginUpgrade(); }
    }
    clearPressed(); return;
  }
  clearPressed();
}

// 回合间的技能强化选卡界面
function wrapText(text, maxW) {
  // 以“连续数字/字母/符号”为整体换行，避免把 45% 之类拆开
  const tokens = text.match(/[A-Za-z0-9%.+\-]+|./g) || [];
  const lines = [];
  let cur = '';
  for (const tk of tokens) {
    const test = cur + tk;
    if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = tk; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

  ctx.fillStyle = 'rgba(255,209,102,0.95)';
  ctx.fillText('比分  ' + wins[0] + ' : ' + wins[1], W / 2, 448);

  const a = 0.5 + 0.5 * Math.sin(time * 0.08);
  ctx.font = 'bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + a * 0.6) + ')';
  ctx.fillText('按 Enter 返回主菜单', W / 2, 540);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function drawPaused() {
  ctx.fillStyle = 'rgba(5,7,16,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 80px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  ctx.strokeText('暂 停', W / 2, H / 2 - 10);
  ctx.fillStyle = '#e8f0ff';
  ctx.fillText('暂 停', W / 2, H / 2 - 10);
  ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(200,215,255,0.8)';
  ctx.fillText('按 P 继续', W / 2, H / 2 + 70);
  ctx.textBaseline = 'alphabetic';
}

// ================= 渲染 =================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'menu') { drawMenu(); return; }

  // 平滑血条
  p1.hpDisplay += (p1.hp - p1.hpDisplay) * 0.14;
  p2.hpDisplay += (p2.hp - p2.hpDisplay) * 0.14;

  let ox = 0, oy = 0;
  if (shakeT > 0) {
    const k = shakeMag * (shakeT / 14);
    ox = rand(-1, 1) * k; oy = rand(-1, 1) * k;
  }

  ctx.save();
  ctx.translate(ox, oy);
  drawArena(time);
  ctx.save();
  drawProjectilesAll();
  // 后出手的画在上层
  if (p1.y <= p2.y) { drawFighter(p1); drawFighter(p2); }
  else { drawFighter(p2); drawFighter(p1); }
  drawParticles();
  drawFloaters();
  ctx.restore();
  ctx.restore();

  drawHUD();

  if (gameState === 'countdown') drawCountdown();
  if (gameState === 'roundover') drawRoundOver();
  if (gameState === 'upgrade') drawUpgrade();
  if (gameState === 'gameover') drawGameOver();
  if (paused && (gameState === 'fight' || gameState === 'countdown' || gameState === 'roundover')) drawPaused();
}
function drawProjectilesAll() { for (const pr of projectiles) pr.draw(); }

// ================= 主循环（固定步长） =================
let acc = 0, last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  const step = 1 / 60;
  let guard = 0;
  while (acc >= step && guard++ < 5) { fixedUpdate(); acc -= step; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
