name = "duizhan-game"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 非敏感配置；敏感项（TURN / 会话密钥等）通过 `wrangler secret put` 注入
[vars]
# 允许跨域访问 API 的额外 origin（逗号分隔）。同源部署时留空即可。
SITE_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "duizhan-db"
database_id = "00659c40-8f3c-43d1-bbbe-038f63eab89d"

[[kv_namespaces]]
binding = "SESSIONS"
id = "e779611fe09b4d28a57cd49796dd8d6f"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# 静态资源（游戏本体）：构建脚本会把仓库根目录的 index.html / three.min.js 拷进 public/
[assets]
directory = "./public"
binding = "ASSETS"
